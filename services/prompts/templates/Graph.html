<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Spatial Interactive Explanation with User Artifacts and Schema Linking">
    <title>Spatial Explanation</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        canvas: {
                            bg: '#040404',
                            dot: '#171717',
                            node: '#0b0b0b',
                            nodeHover: '#141414',
                            border: '#242424',
                            borderHover: '#383838',
                            text: '#f1f1f1',
                            muted: '#737373',
                            accent: '#10b981',
                            accentDim: 'rgba(16, 185, 129, 0.12)',
                            warning: '#f59e0b',
                            warningDim: 'rgba(245, 158, 11, 0.12)',
                            highlight: '#3b82f6',
                            purple: '#a855f7',
                            rose: '#f43f5e',
                            conduit: '#1f2421'
                        },
                        article: {
                            bg: '#000000',
                            text: '#a1a1aa',
                            heading: '#ffffff',
                            border: '#18181b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace']
                    }
                }
            }
        };
    </script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react,react-dom",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "zustand": "https://esm.sh/zustand@4.5.0?external=react",
            "clsx": "https://esm.sh/clsx@2.1.0",
            "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1"
        }
    }
    </script>
    
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            user-select: none;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }

        .tldraw-bg {
            background-color: var(--color-canvas-bg, #040404);
            background-image: radial-gradient(var(--color-canvas-dot, #171717) 1.2px, transparent 0);
            background-size: 30px 30px;
            background-position: -15px -15px;
        }

        .prose p { margin-bottom: 1.8em; line-height: 1.8; color: #a1a1aa; font-weight: 300; font-size: 0.95rem; }
        .prose h2 { color: #fff; font-size: 1.25rem; font-weight: 500; margin-bottom: 1.2em; letter-spacing: -0.02em; }
        .prose section { transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .prose .math-block { 
            font-family: 'Fira Code', monospace; 
            font-size: 0.85rem;
            color: #10b981;
            background: linear-gradient(145deg, #090909, #030303);
            border: 1px solid #1c1c1c;
            border-left: 3px solid #10b981;
            padding: 1.1rem;
            margin: 1.8rem 0;
            border-radius: 4px;
        }
        
        .spatial-node {
            transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
            will-change: transform, opacity;
            transform-origin: center center;
        }
        
        .spatial-node.active-accent {
            border-color: #10b981 !important;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.2), inset 0 0 12px rgba(16, 185, 129, 0.05);
            z-index: 20;
        }
        
        .spatial-node.active-warning {
            border-color: #f59e0b !important;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.2);
            z-index: 20;
        }

        .spatial-node.dimmed { 
            opacity: 0.15; 
            filter: grayscale(80%) blur(0.5px);
        }

        .edge-line {
            stroke: #222222;
            stroke-width: 1.5;
            fill: none;
            transition: stroke 0.6s ease, stroke-width 0.6s ease;
        }
        .edge-line.active { stroke: #10b981; stroke-width: 2.2; filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.4)); }
        .edge-line.active-warning { stroke: #f59e0b; stroke-width: 2.2; filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.4)); }

        .conduit-line {
            fill: none;
            stroke: #1a1a1a;
            stroke-width: 1.5;
            stroke-dasharray: 6 6;
            transition: stroke 0.6s ease, opacity 0.6s ease;
        }
        .conduit-line.active {
            stroke: #10b981;
            stroke-width: 2;
            stroke-dasharray: 8 6;
            opacity: 0.85;
            filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.4));
        }

        .gradient-fade-bottom {
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- AGENT GUIDE: Preserve this spatial canvas architecture (`ArticlePane` with scroll-synced camera waypoints on the left; `InfiniteCanvas` with 1-to-1 pan/zoom, `GraphNode`, `Frame`, `FullConduitNetwork`, and interactive `UserArtifact` schema linking on the right). Populate `ARTICLE` with your lesson's sections, define matching coordinates and camera targets in `STATION_COORDINATES`, `SPATIAL_VIEWS`, and `HIGHLIGHTS`, and build custom spatial node graphs and interactive `Frame` stations inside `SpatialWorld` to visually map the topic's mechanisms. -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { create } from 'zustand';
        import { clsx } from 'clsx';
        import { twMerge } from 'tailwind-merge';
        import * as Lucide from 'lucide-react';

        const cn = (...inputs) => twMerge(clsx(inputs));

        const ARTICLE = [
            {
                id: 'sec-1',
                title: '1. Primary Station Placeholder',
                text: [
                    'Replace this placeholder with rigorous, mechanism-first prose. Scrolling through sections automatically pans and zooms the spatial canvas to the corresponding station.'
                ],
                math: 'f(x) = ...'
            },
            {
                id: 'sec-2',
                title: '2. Secondary Station Placeholder',
                text: [
                    'Add additional sections and map their IDs to coordinates in STATION_COORDINATES, SPATIAL_VIEWS, and HIGHLIGHTS.'
                ]
            }
        ];

        const STATION_COORDINATES = {
            'sec-1': { x: 0, y: 0, label: 'Primary Station' },
            'sec-2': { x: 850, y: 300, label: 'Secondary Station' },
        };

        const SPATIAL_VIEWS = {
            'sec-1': { x: 0, y: 0, z: 0.95 },
            'sec-2': { x: 850, y: 300, z: 0.95 },
        };

        const HIGHLIGHTS = {
            'sec-1': ['node-root', 'conduit-1'],
            'sec-2': ['frame-1', 'conduit-1'],
        };

        const useStore = create((set, get) => ({
            activeSection: ARTICLE[0].id,
            camera: SPATIAL_VIEWS[ARTICLE[0].id],
            isManualNavigation: false,
            configuredArtifactId: null,
            
            artifacts: [
                {
                    id: 'art-demo-1',
                    type: 'note',
                    x: -420,
                    y: -120,
                    w: 240,
                    h: 130,
                    title: 'Schema Note',
                    content: 'User-editable note linked to a spatial station.',
                    color: 'accent',
                    linkedSectionId: ARTICLE[0].id
                }
            ],

            setActiveSection: (id) => {
                if (!SPATIAL_VIEWS[id]) return;
                set({ 
                    activeSection: id, 
                    camera: SPATIAL_VIEWS[id],
                    isManualNavigation: false 
                });
            },
            
            setCameraDirect: (cam) => set({ camera: cam, isManualNavigation: true }),
            setConfiguredArtifactId: (id) => set({ configuredArtifactId: id }),

            addArtifact: (type, extraData = {}) => {
                const { camera, artifacts } = get();
                const newId = `art-${Date.now()}`;
                const base = {
                    id: newId,
                    type,
                    x: Math.round(camera.x + (Math.random() * 80 - 40)),
                    y: Math.round(camera.y + (Math.random() * 80 - 40)),
                    w: type === 'rect' ? 300 : type === 'image' ? 260 : 220,
                    h: type === 'rect' ? 180 : type === 'image' ? 220 : 130,
                    title: type === 'note' ? 'Personal Note' : type === 'rect' ? 'Conceptual Frame' : 'Visual Artifact',
                    content: type === 'note' ? 'Write observations here...' : type === 'rect' ? 'Grouped Boundary' : '',
                    color: 'accent',
                    linkedSectionId: ARTICLE[0].id,
                    ...extraData
                };
                set({ artifacts: [...artifacts, base], configuredArtifactId: newId });
            },

            updateArtifact: (id, patch) => {
                set({
                    artifacts: get().artifacts.map(a => a.id === id ? { ...a, ...patch } : a)
                });
            },

            removeArtifact: (id) => {
                set({
                    artifacts: get().artifacts.filter(a => a.id !== id),
                    configuredArtifactId: get().configuredArtifactId === id ? null : get().configuredArtifactId
                });
            }
        }));

        const GraphNode = ({ id, x, y, width, multiplier, label, subtext, status = 'default', activeNodes = [] }) => {
            const isAll = activeNodes.includes('all');
            const isActive = isAll || activeNodes.includes(id);
            const isDim = !isActive && activeNodes.length > 0 && !isAll;

            const borderColor = status === 'warning' 
                ? (isActive ? 'border-canvas-warning' : 'border-canvas-border')
                : (isActive ? 'border-canvas-accent' : 'border-canvas-border');

            return (
                <div 
                    className={cn(
                        "spatial-node absolute flex items-stretch bg-canvas-node border rounded-md overflow-hidden shadow-md",
                        borderColor,
                        isActive && (status === 'warning' ? "active-warning" : "active-accent"),
                        isDim && "dimmed"
                    )}
                    style={{ 
                        left: x, 
                        top: y, 
                        width: width ? `${width}px` : 'auto',
                        transform: 'translate(-50%, -50%)' 
                    }}
                >
                    {multiplier && (
                        <div className={cn(
                            "px-3 py-2 font-mono text-xs font-bold flex items-center justify-center border-r transition-colors duration-500",
                            status === 'warning'
                                ? (isActive ? "bg-canvas-warning text-black border-canvas-warning" : "bg-[#1c1409] text-canvas-warning border-canvas-border")
                                : (isActive ? "bg-canvas-accent text-black border-canvas-accent" : "bg-[#0a1a12] text-canvas-accent border-canvas-border")
                        )}>
                            ×{multiplier}
                        </div>
                    )}
                    <div className="px-3.5 py-2 flex flex-col justify-center min-w-0">
                        <div className="font-mono text-xs text-canvas-text truncate tracking-tight">
                            {label}
                        </div>
                        {subtext && (
                            <div className="font-mono text-[10px] text-canvas-muted truncate mt-0.5">
                                {subtext}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Frame = ({ id, x, y, width, height, title, children, activeNodes, icon: Icon }) => {
            const isActive = activeNodes.includes(id) || activeNodes.includes('all');
            return (
                <div 
                    className={cn(
                        "spatial-node absolute bg-canvas-node/95 backdrop-blur-md border rounded-xl p-6 flex flex-col overflow-hidden pointer-events-auto",
                        isActive ? "active-accent shadow-2xl scale-100" : "border-canvas-border shadow-lg scale-95 opacity-50",
                        !isActive && activeNodes.length > 0 && !activeNodes.includes('all') && "dimmed"
                    )}
                    style={{ left: x, top: y, width, height, transform: 'translate(-50%, -50%)' }}
                >
                    <div className="flex items-center justify-between font-mono text-xs tracking-wider text-canvas-muted uppercase mb-4 border-b border-canvas-border pb-3">
                        <div className="flex items-center gap-2.5">
                            {Icon && <Icon size={15} className={isActive ? "text-canvas-accent" : "text-canvas-muted"} />}
                            <span className={isActive ? "text-white" : ""}>{title}</span>
                        </div>
                        <span className="text-[10px] text-canvas-accent">Unit Bound Station</span>
                    </div>
                    <div className="flex-1 min-h-0 relative z-10">
                        {children}
                    </div>
                </div>
            );
        };

        const FullConduitNetwork = ({ activeNodes, artifacts, activeSection }) => {
            const isConnActive = (id) => activeNodes.includes(id) || activeNodes.includes('all');

            return (
                <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ overflow: 'visible' }}>
                    {/* Fixed Inter-Station Conduit Placeholder */}
                    <path d="M 140 0 C 400 0, 550 300, 570 300" className={cn("conduit-line", isConnActive('conduit-1') && "active")} />

                    {/* Dynamic Conduits linking User Artifacts to Core Lesson Stations */}
                    {artifacts.map((art) => {
                        if (!art.linkedSectionId) return null;
                        const targetPos = STATION_COORDINATES[art.linkedSectionId];
                        if (!targetPos) return null;

                        const isLinkedActive = activeSection === art.linkedSectionId;
                        const startX = art.x;
                        const startY = art.y;
                        const targetX = targetPos.x;
                        const targetY = targetPos.y;
                        const midX = (startX + targetX) / 2;

                        return (
                            <g key={`user-wire-${art.id}`}>
                                <path
                                    d={`M ${startX} ${startY} Q ${midX} ${startY - 40}, ${targetX} ${targetY}`}
                                    className={cn(
                                        "conduit-line transition-all duration-700",
                                        isLinkedActive ? "active" : "opacity-30"
                                    )}
                                    style={{
                                        stroke: isLinkedActive 
                                            ? (art.color === 'purple' ? '#a855f7' : art.color === 'warning' ? '#f59e0b' : '#10b981')
                                            : '#262626',
                                        strokeWidth: isLinkedActive ? 2.5 : 1.2
                                    }}
                                />
                                {isLinkedActive && (
                                    <circle cx={startX} cy={startY} r="4" fill="#10b981" className="animate-pulse" />
                                )}
                            </g>
                        );
                    })}
                </svg>
            );
        };

        const UserArtifact = ({ artifact, onDragStart, onOpenSettings }) => {
            const activeSection = useStore(s => s.activeSection);
            const isBoundToActive = activeSection === artifact.linkedSectionId;

            const colorClasses = {
                accent: isBoundToActive ? 'border-canvas-accent shadow-[0_0_25px_rgba(16,185,129,0.25)]' : 'border-canvas-border hover:border-canvas-accent/50',
                warning: isBoundToActive ? 'border-canvas-warning shadow-[0_0_25px_rgba(245,158,11,0.25)]' : 'border-canvas-border hover:border-canvas-warning/50',
                purple: isBoundToActive ? 'border-canvas-purple shadow-[0_0_25px_rgba(168,85,247,0.25)]' : 'border-canvas-border hover:border-canvas-purple/50',
            }[artifact.color || 'accent'];

            if (artifact.type === 'rect') {
                return (
                    <div
                        className={cn(
                            "absolute rounded-xl border-2 border-dashed bg-black/40 backdrop-blur-xs flex flex-col p-4 transition-all duration-300 pointer-events-auto",
                            colorClasses
                        )}
                        style={{
                            left: artifact.x,
                            top: artifact.y,
                            width: artifact.w,
                            height: artifact.h,
                            transform: 'translate(-50%, -50%)',
                        }}
                    >
                        <div 
                            className="flex items-center justify-between pb-2 border-b border-white/5 cursor-grab active:cursor-grabbing"
                            onPointerDown={(e) => onDragStart(e, artifact)}
                        >
                            <span className="font-mono text-xs uppercase tracking-wider text-canvas-muted truncate">
                                {artifact.title}
                            </span>
                            <div className="flex items-center gap-1.5 pointer-events-auto">
                                <button
                                    onClick={() => onOpenSettings(artifact.id)}
                                    className="p-1 rounded hover:bg-white/10 text-canvas-muted hover:text-white transition-colors"
                                    title="Link Schema / Configure"
                                >
                                    <Lucide.Settings2 size={13} />
                                </button>
                            </div>
                        </div>
                        <div className="flex-1 flex items-center justify-center font-mono text-xs text-canvas-muted/80 text-center p-2 select-none pointer-events-none">
                            {artifact.content}
                        </div>
                    </div>
                );
            }

            return (
                <div
                    className={cn(
                        "absolute rounded-lg border bg-canvas-node/95 shadow-xl flex flex-col overflow-hidden transition-all duration-300 pointer-events-auto",
                        colorClasses
                    )}
                    style={{
                        left: artifact.x,
                        top: artifact.y,
                        width: artifact.w,
                        minHeight: artifact.h,
                        transform: 'translate(-50%, -50%)',
                    }}
                >
                    <div 
                        className="px-3 py-2 bg-[#121212] border-b border-canvas-border flex items-center justify-between cursor-grab active:cursor-grabbing select-none"
                        onPointerDown={(e) => onDragStart(e, artifact)}
                    >
                        <div className="flex items-center gap-2 min-w-0">
                            {artifact.type === 'note' && <Lucide.FileText size={13} className="text-canvas-accent flex-shrink-0" />}
                            {artifact.type === 'image' && <Lucide.Image size={13} className="text-canvas-purple flex-shrink-0" />}
                            <span className="font-mono text-xs font-medium text-canvas-text truncate">
                                {artifact.title}
                            </span>
                        </div>
                        <div className="flex items-center gap-1">
                            <button
                                onClick={() => onOpenSettings(artifact.id)}
                                className="p-1 rounded hover:bg-[#222] text-canvas-muted hover:text-white transition-colors"
                                title="Link Schema / Settings"
                            >
                                <Lucide.Settings2 size={13} />
                            </button>
                        </div>
                    </div>

                    <div className="p-3 flex-1 flex flex-col font-mono text-xs">
                        {artifact.type === 'note' && (
                            <p className="text-canvas-muted leading-relaxed whitespace-pre-wrap select-text">
                                {artifact.content}
                            </p>
                        )}
                        {artifact.type === 'image' && (
                            <div className="w-full h-full flex items-center justify-center overflow-hidden rounded bg-black">
                                {artifact.content ? (
                                    <img src={artifact.content} alt={artifact.title} className="w-full h-auto object-cover max-h-[220px]" />
                                ) : (
                                    <div className="text-canvas-muted py-6">No image loaded</div>
                                )}
                            </div>
                        )}
                    </div>

                    {artifact.linkedSectionId && (
                        <div className="px-3 py-1.5 bg-[#0e0e0e] border-t border-canvas-border flex items-center justify-between font-mono text-[10px]">
                            <span className="text-canvas-muted">Bound to:</span>
                            <span className={cn(
                                "font-medium truncate max-w-[130px]",
                                isBoundToActive ? "text-canvas-accent" : "text-canvas-muted"
                            )}>
                                {STATION_COORDINATES[artifact.linkedSectionId]?.label || artifact.linkedSectionId}
                            </span>
                        </div>
                    )}
                </div>
            );
        };

        const ArtifactSettingsModal = () => {
            const { configuredArtifactId, setConfiguredArtifactId, artifacts, updateArtifact, removeArtifact, setActiveSection } = useStore();
            const artifact = artifacts.find(a => a.id === configuredArtifactId);

            if (!artifact) return null;

            return (
                <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-md bg-canvas-node border border-canvas-border rounded-xl p-6 shadow-2xl flex flex-col gap-5">
                        
                        <div className="flex items-center justify-between border-b border-canvas-border pb-3">
                            <div className="flex items-center gap-2">
                                <Lucide.Settings2 size={16} className="text-canvas-accent" />
                                <h3 className="font-mono text-sm font-semibold text-white">Artifact Schema Configuration</h3>
                            </div>
                            <button 
                                onClick={() => setConfiguredArtifactId(null)}
                                className="p-1 rounded text-canvas-muted hover:text-white hover:bg-[#1a1a1a]"
                            >
                                <Lucide.X size={16} />
                            </button>
                        </div>

                        <div className="flex flex-col gap-1.5 font-mono text-xs">
                            <label className="text-canvas-muted">Title / Identifier</label>
                            <input
                                type="text"
                                value={artifact.title}
                                onChange={(e) => updateArtifact(artifact.id, { title: e.target.value })}
                                className="bg-[#121212] border border-canvas-border rounded px-3 py-2 text-white focus:outline-none focus:border-canvas-accent"
                            />
                        </div>

                        {artifact.type !== 'image' && (
                            <div className="flex flex-col gap-1.5 font-mono text-xs">
                                <label className="text-canvas-muted">Content / Text</label>
                                <textarea
                                    rows={3}
                                    value={artifact.content}
                                    onChange={(e) => updateArtifact(artifact.id, { content: e.target.value })}
                                    className="bg-[#121212] border border-canvas-border rounded px-3 py-2 text-white focus:outline-none focus:border-canvas-accent resize-none"
                                />
                            </div>
                        )}

                        <div className="flex flex-col gap-1.5 font-mono text-xs">
                            <div className="flex justify-between items-center">
                                <label className="text-canvas-muted">Connect with Lesson Unit</label>
                                <span className="text-[10px] text-canvas-accent">Active Wire Sync</span>
                            </div>
                            <select
                                value={artifact.linkedSectionId || ''}
                                onChange={(e) => updateArtifact(artifact.id, { linkedSectionId: e.target.value })}
                                className="bg-[#121212] border border-canvas-border rounded px-3 py-2 text-white focus:outline-none focus:border-canvas-accent"
                            >
                                {ARTICLE.map((sec) => (
                                    <option key={sec.id} value={sec.id}>
                                        {sec.title}
                                    </option>
                                ))}
                            </select>
                        </div>

                        <div className="flex flex-col gap-1.5 font-mono text-xs">
                            <label className="text-canvas-muted">Theme Accent</label>
                            <div className="flex gap-2">
                                {[
                                    { id: 'accent', label: 'Emerald', bg: 'bg-[#10b981]' },
                                    { id: 'warning', label: 'Amber', bg: 'bg-[#f59e0b]' },
                                    { id: 'purple', label: 'Purple', bg: 'bg-[#a855f7]' },
                                ].map((c) => (
                                    <button
                                        key={c.id}
                                        onClick={() => updateArtifact(artifact.id, { color: c.id })}
                                        className={cn(
                                            "flex-1 py-1.5 rounded border text-xs flex items-center justify-center gap-1.5 transition-all",
                                            artifact.color === c.id ? "border-white text-white font-bold" : "border-canvas-border text-canvas-muted"
                                        )}
                                    >
                                        <span className={cn("w-2 h-2 rounded-full", c.bg)} />
                                        {c.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-between items-center pt-3 border-t border-canvas-border font-mono text-xs">
                            <button
                                onClick={() => removeArtifact(artifact.id)}
                                className="flex items-center gap-1 text-red-400 hover:text-red-300 py-1"
                            >
                                <Lucide.Trash2 size={13} />
                                Delete
                            </button>
                            <div className="flex gap-2">
                                <button
                                    onClick={() => {
                                        if (artifact.linkedSectionId) setActiveSection(artifact.linkedSectionId);
                                        setConfiguredArtifactId(null);
                                    }}
                                    className="px-3 py-1.5 rounded bg-white/10 hover:bg-white/20 text-white font-medium"
                                >
                                    Jump to Unit
                                </button>
                                <button
                                    onClick={() => setConfiguredArtifactId(null)}
                                    className="px-4 py-1.5 rounded bg-canvas-accent text-black font-semibold hover:bg-canvas-accent/90"
                                >
                                    Save & Close
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const SpatialWorld = () => {
            const activeSection = useStore(s => s.activeSection);
            const artifacts = useStore(s => s.artifacts);
            const updateArtifact = useStore(s => s.updateArtifact);
            const setConfiguredArtifactId = useStore(s => s.setConfiguredArtifactId);
            const activeNodes = HIGHLIGHTS[activeSection] || [];

            const dragRef = useRef(null);

            const handleArtifactDragStart = (e, art) => {
                e.stopPropagation();
                const cam = useStore.getState().camera;
                dragRef.current = {
                    id: art.id,
                    startX: e.clientX,
                    startY: e.clientY,
                    origX: art.x,
                    origY: art.y,
                    zoom: cam.z
                };

                const onPointerMove = (moveEvent) => {
                    if (!dragRef.current) return;
                    const dx = (moveEvent.clientX - dragRef.current.startX) / dragRef.current.zoom;
                    const dy = (moveEvent.clientY - dragRef.current.startY) / dragRef.current.zoom;
                    updateArtifact(dragRef.current.id, {
                        x: Math.round(dragRef.current.origX + dx),
                        y: Math.round(dragRef.current.origY + dy)
                    });
                };

                const onPointerUp = () => {
                    dragRef.current = null;
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                };

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            };

            return (
                <div className="absolute inset-0 origin-center">
                    <FullConduitNetwork activeNodes={activeNodes} artifacts={artifacts} activeSection={activeSection} />

                    {/* Station 1 Placeholder */}
                    <GraphNode id="node-root" x={0} y={0} width={280} multiplier="1" label="Primary Concept Node" subtext="Root mechanism placeholder" activeNodes={activeNodes} />

                    {/* Station 2 Frame Placeholder */}
                    <Frame id="frame-1" x={850} y={300} width={540} height={360} title="STATION :: Interactive Frame" icon={Lucide.Activity} activeNodes={activeNodes}>
                        <div className="h-full flex items-center justify-center border border-dashed border-canvas-border rounded font-mono text-xs text-canvas-muted">
                            [ Station Chart / Interactive Diagram Mount ]
                        </div>
                    </Frame>

                    {/* User-created interactive artifacts */}
                    {artifacts.map((art) => (
                        <UserArtifact 
                            key={art.id} 
                            artifact={art} 
                            onDragStart={handleArtifactDragStart}
                            onOpenSettings={setConfiguredArtifactId}
                        />
                    ))}
                </div>
            );
        };

        const InfiniteCanvas = () => {
            const containerRef = useRef(null);
            const { camera, setCameraDirect, isManualNavigation, addArtifact, setActiveSection } = useStore();
            const fileInputRef = useRef(null);

            const [isDragging, setIsDragging] = useState(false);
            const dragStartRef = useRef({ x: 0, y: 0, camX: 0, camY: 0 });

            const handleWheel = useCallback((e) => {
                e.preventDefault();
                const container = containerRef.current;
                if (!container) return;

                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const cx = rect.width / 2;
                const cy = rect.height / 2;

                const curCam = useStore.getState().camera;
                const zoomFactor = Math.exp(-e.deltaY * 0.002);
                const nextZ = Math.min(Math.max(0.15, curCam.z * zoomFactor), 4.0);

                const worldX = curCam.x + (mouseX - cx) / curCam.z;
                const worldY = curCam.y + (mouseY - cy) / curCam.z;

                const nextX = worldX - (mouseX - cx) / nextZ;
                const nextY = worldY - (mouseY - cy) / nextZ;

                setCameraDirect({ x: nextX, y: nextY, z: nextZ });
            }, [setCameraDirect]);

            useEffect(() => {
                const el = containerRef.current;
                if (el) {
                    el.addEventListener('wheel', handleWheel, { passive: false });
                    return () => el.removeEventListener('wheel', handleWheel);
                }
            }, [handleWheel]);

            const handlePointerDown = (e) => {
                if (e.target.closest('.pointer-events-auto') || e.target.closest('button') || e.target.closest('input')) return;
                
                setIsDragging(true);
                dragStartRef.current = {
                    x: e.clientX,
                    y: e.clientY,
                    camX: camera.x,
                    camY: camera.y
                };
            };

            const handlePointerMove = (e) => {
                if (!isDragging) return;
                const dx = (e.clientX - dragStartRef.current.x) / camera.z;
                const dy = (e.clientY - dragStartRef.current.y) / camera.z;
                setCameraDirect({
                    x: dragStartRef.current.camX - dx,
                    y: dragStartRef.current.camY - dy,
                    z: camera.z
                });
            };

            const handlePointerUp = () => {
                setIsDragging(false);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target?.result;
                    if (dataUrl) {
                        addArtifact('image', {
                            title: file.name.substring(0, 16),
                            content: dataUrl,
                            w: 280,
                            h: 220
                        });
                    }
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            return (
                <div 
                    ref={containerRef}
                    className={cn(
                        "flex-1 h-full relative overflow-hidden tldraw-bg select-none",
                        isDragging ? "cursor-grabbing" : "cursor-grab"
                    )}
                    onPointerDown={handlePointerDown}
                    onPointerMove={handlePointerMove}
                    onPointerUp={handlePointerUp}
                    onPointerLeave={handlePointerUp}
                >
                    {/* Floating Artifact Creation Toolbar */}
                    <div className="absolute top-6 left-6 z-40 flex items-center gap-1.5 p-1.5 rounded-lg bg-canvas-node/90 border border-canvas-border shadow-2xl backdrop-blur-md">
                        <button
                            onClick={() => addArtifact('note')}
                            className="flex items-center gap-1.5 px-3 py-1.5 rounded hover:bg-white/10 text-canvas-text font-mono text-xs transition-colors"
                            title="Add Note"
                        >
                            <Lucide.FileText size={14} className="text-canvas-accent" />
                            <span>Add Note</span>
                        </button>
                        <button
                            onClick={() => addArtifact('rect')}
                            className="flex items-center gap-1.5 px-3 py-1.5 rounded hover:bg-white/10 text-canvas-text font-mono text-xs transition-colors"
                            title="Add Frame / Rectangle"
                        >
                            <Lucide.Square size={14} className="text-canvas-purple" />
                            <span>Add Frame</span>
                        </button>
                        <button
                            onClick={() => fileInputRef.current?.click()}
                            className="flex items-center gap-1.5 px-3 py-1.5 rounded hover:bg-white/10 text-canvas-text font-mono text-xs transition-colors"
                            title="Upload Image"
                        >
                            <Lucide.ImagePlus size={14} className="text-canvas-warning" />
                            <span>Image</span>
                        </button>
                        <input
                            ref={fileInputRef}
                            type="file"
                            accept="image/*"
                            onChange={handleImageUpload}
                            className="hidden"
                        />
                        <div className="w-px h-5 bg-canvas-border mx-1" />
                        <button
                            onClick={() => setActiveSection(ARTICLE[0].id)}
                            className="px-2.5 py-1.5 rounded hover:bg-white/10 text-canvas-muted hover:text-white font-mono text-xs transition-colors"
                            title="Reset to Root"
                        >
                            <Lucide.RotateCcw size={13} />
                        </button>
                    </div>

                    {/* Canvas Projection Layer */}
                    <div 
                        className="absolute inset-0 origin-top-left will-change-transform pointer-events-none"
                        style={{
                            transform: `translate(50vw, 50vh) scale(${camera.z}) translate(${-camera.x}px, ${-camera.y}px)`,
                            transition: isManualNavigation ? 'none' : 'transform 0.9s cubic-bezier(0.16, 1, 0.3, 1)',
                            transformOrigin: '0 0'
                        }}
                    >
                        <SpatialWorld />
                    </div>

                    <ArtifactSettingsModal />
                </div>
            );
        };

        const ArticlePane = () => {
            const { setActiveSection, activeSection } = useStore();

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    let maxIntersection = 0;
                    let bestId = null;
                    entries.forEach(entry => {
                        if (entry.isIntersecting && entry.intersectionRatio > maxIntersection) {
                            maxIntersection = entry.intersectionRatio;
                            bestId = entry.target.id;
                        }
                    });
                    if (bestId) setActiveSection(bestId);
                }, { rootMargin: '-20% 0px -40% 0px', threshold: Array.from({ length: 20 }, (_, i) => i / 20) });

                ARTICLE.forEach(sec => {
                    const el = document.getElementById(sec.id);
                    if (el) observer.observe(el);
                });
                return () => observer.disconnect();
            }, [setActiveSection]);

            return (
                <div className="w-full md:w-[480px] lg:w-[540px] flex-shrink-0 h-full overflow-y-auto bg-article-bg border-r border-article-border relative z-20 gradient-fade-bottom">
                    <div className="p-12 pb-[65vh] prose">
                        <div className="mb-24 pt-12">
                            <h1 className="text-3xl font-bold text-white mb-4 tracking-tight leading-tight">
                                Lesson Title<br/>
                                <span className="text-canvas-accent">Placeholder</span>
                            </h1>
                            <div className="text-[11px] font-mono text-canvas-muted flex items-center gap-3 uppercase tracking-widest border border-canvas-border inline-flex px-3.5 py-1.5 rounded-md bg-canvas-node shadow-sm">
                                <span className="w-2 h-2 rounded-full bg-canvas-accent animate-pulse"></span>
                                Spatial Schema
                            </div>
                        </div>

                        {ARTICLE.map((sec) => (
                            <section 
                                key={sec.id} 
                                id={sec.id} 
                                className={cn(
                                    "mb-32 transition-all duration-700",
                                    activeSection === sec.id ? "opacity-100 transform translate-x-0" : "opacity-25 transform -translate-x-4"
                                )}
                            >
                                <h2 className="flex items-center gap-3">
                                    <span className="w-5 h-px bg-canvas-border inline-block"></span>
                                    {sec.title}
                                </h2>
                                {sec.text.map((p, i) => <p key={i}>{p}</p>)}
                                {sec.math && (
                                    <div className="math-block">
                                        {sec.math}
                                    </div>
                                )}
                            </section>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <div className="flex w-screen h-screen bg-black overflow-hidden font-sans">
                    <ArticlePane />
                    <InfiniteCanvas />
                    
                    <div className="absolute bottom-6 right-6 bg-canvas-node/90 backdrop-blur border border-canvas-border text-canvas-muted text-[11px] font-mono px-3.5 py-2 rounded-md pointer-events-none z-50 flex items-center gap-2.5 shadow-xl hidden md:flex">
                        <Lucide.MousePointerClick size={14} className="text-canvas-accent" />
                        Pan: Drag • Zoom: Wheel • Add custom schema notes via top toolbar
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
