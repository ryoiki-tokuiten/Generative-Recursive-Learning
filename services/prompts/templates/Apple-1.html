<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Interactive first-principles lesson.">
    <title>Interactive Lesson</title>
    
    <script>
        (function () {
            const savedTheme = localStorage.getItem('apple-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: 'var(--apple-bg)',
                            surface: 'var(--apple-surface)',
                            surfaceElevated: 'var(--apple-surface-elevated)',
                            text: 'var(--apple-text)',
                            textMuted: 'var(--apple-text-muted)',
                            accent: 'var(--apple-accent)',
                            accentHover: 'var(--apple-accent-hover)',
                            border: 'var(--apple-border)',
                            glass: 'var(--apple-glass)',
                            red: 'var(--apple-red)',
                            orange: 'var(--apple-orange)',
                            chart1: 'var(--apple-chart-1)',
                            chart2: 'var(--apple-chart-2)',
                        }
                    },
                    fontFamily: {
                        sans: [
                            '-apple-system', 
                            'BlinkMacSystemFont', 
                            '"SF Pro Text"', 
                            '"SF Pro Display"', 
                            '"Helvetica Neue"', 
                            'Arial', 
                            'sans-serif'
                        ],
                        mono: [
                            '"SF Mono"', 
                            'ui-monospace', 
                            'Menlo', 
                            'Monaco', 
                            'Consolas', 
                            'monospace'
                        ],
                        display: [
                            '-apple-system', 
                            'BlinkMacSystemFont', 
                            '"SF Pro Display"', 
                            '"Helvetica Neue"', 
                            'sans-serif'
                        ]
                    },
                    boxShadow: {
                        'apple-sm': '0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.04)',
                        'apple-md': '0 4px 12px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.05)',
                        'apple-lg': '0 12px 32px rgba(0, 0, 0, 0.08), 0 16px 48px rgba(0, 0, 0, 0.08)',
                        'apple-glass': '0 8px 32px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        };
    </script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react,react-dom",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "zustand": "https://esm.sh/zustand@4.5.0?external=react",
            "zod": "https://esm.sh/zod@3.22.4",
            "clsx": "https://esm.sh/clsx@2.1.0",
            "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1",
            "lodash": "https://esm.sh/lodash@4.17.21"
        }
    }
    </script>
    
    <style>
        :root {
            --apple-bg: #ffffff;
            --apple-surface: #f5f5f7;
            --apple-surface-elevated: #ffffff;
            --apple-text: #1d1d1f;
            --apple-text-muted: #86868b;
            --apple-accent: #007aff;
            --apple-accent-hover: #006ce0;
            --apple-border: rgba(60, 60, 67, 0.12);
            --apple-glass: rgba(255, 255, 255, 0.75);
            --apple-red: #ff3b30;
            --apple-orange: #ff9500;
            --apple-chart-1: #34c759;
            --apple-chart-2: #5ac8fa;
        }

        .dark {
            --apple-bg: #000000;
            --apple-surface: #1c1c1e;
            --apple-surface-elevated: #2c2c2e;
            --apple-text: #f5f5f7;
            --apple-text-muted: #98989d;
            --apple-accent: #0a84ff;
            --apple-accent-hover: #409cff;
            --apple-border: rgba(84, 84, 88, 0.45);
            --apple-glass: rgba(28, 28, 30, 0.75);
            --apple-red: #ff453a;
            --apple-orange: #ff9f0a;
            --apple-chart-1: #32d74b;
            --apple-chart-2: #64d2ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: background-color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.4s ease;
        }

        * { box-sizing: border-box; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background-clip: padding-box;
            border: 3px solid transparent;
            background-color: var(--apple-text-muted);
            border-radius: 9999px;
            opacity: 0.5;
        }
        ::-webkit-scrollbar-thumb:hover { border-width: 2px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=range].apple-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
            margin: 10px 0;
        }
        input[type=range].apple-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--apple-border);
            border-radius: 2px;
            transition: background 0.2s;
        }
        input[type=range].apple-slider::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15), 0 0 1px rgba(0,0,0,0.2) inset;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -10px;
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
            border: 0.5px solid rgba(0,0,0,0.04);
        }
        input[type=range].apple-slider:active::-webkit-slider-thumb { transform: scale(1.1); }
        .dark input[type=range].apple-slider::-webkit-slider-thumb {
            background: #d1d1d6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255,255,255,0.2) inset;
        }

        .apple-prose p { margin-bottom: 1.4em; line-height: 1.6; }
        h1, h2, h3, h4, .font-display { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; letter-spacing: -0.02em; }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-enter { animation: slideUpFade 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

        .apple-glass-panel {
            background: var(--apple-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--apple-border);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- AGENT GUIDE: Preserve this three-zone Apple HIG layout (macOS table-of-contents sidebar, central reading column, and right-hand interactive simulation pane with sticky `SegmentedControl` header and mobile iOS tab bar) along with all `apple-*` CSS variables and UI primitives (`GlassSlider`, `Panel`, `Stat`, `Button`, `InputText`, `SegmentedControl`). Populate `ARTICLE` with rigorous, mechanism-first sections (`p`, `equation`, `callout`), map sections to tabs in `VIS_TABS` and `SECTION_TO_TAB`, and replace `PlaceholderDashboard` with functional interactive visualizations driven by Zustand state. -->
    <script type="text/babel" data-type="module">
        import React, { useEffect, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { create } from 'zustand';
        import { clsx } from 'clsx';
        import { twMerge } from 'tailwind-merge';
        import _ from 'lodash';
        import * as Lucide from 'lucide-react';

        const cn = (...inputs) => twMerge(clsx(inputs));

        const VIS_TABS = Object.freeze({
            TAB_1: 'tab-1',
            TAB_2: 'tab-2'
        });

        const ARTICLE = Object.freeze([
            {
                id: 'sec-1',
                title: '1. Section title placeholder',
                blocks: [
                    { type: 'p', text: 'Replace this placeholder with clear, mechanism-first lesson prose.' },
                    { type: 'equation', label: 'Core Equation', text: 'f(x) = ...' },
                    { type: 'callout', title: 'Important boundary', text: 'Clarify essential assumptions or conceptual distinctions here.' }
                ]
            }
        ]);

        const SECTION_TO_TAB = Object.freeze({
            'sec-1': VIS_TABS.TAB_1
        });

        const TAB_TO_SECTIONS = _.reduce(SECTION_TO_TAB, (acc, tab, sectionId) => {
            if (!acc[tab]) acc[tab] = [];
            acc[tab].push(sectionId);
            return acc;
        }, {});

        const useLessonStore = create((set, get) => ({
            activeTab: VIS_TABS.TAB_1,
            activeSection: ARTICLE[0].id,
            mobileView: 'visuals',
            theme: localStorage.getItem('apple-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
            fontSizeMultiplier: 1.0,
            paramValue: 0.5,

            update: (partial) => set(partial),
            toggleTheme: () => {
                const newTheme = get().theme === 'dark' ? 'light' : 'dark';
                set({ theme: newTheme });
                localStorage.setItem('apple-theme', newTheme);
                document.documentElement.classList.toggle('dark', newTheme === 'dark');
            },
            increaseFontSize: () => set(state => ({ fontSizeMultiplier: Math.min(1.5, state.fontSizeMultiplier + 0.1) })),
            decreaseFontSize: () => set(state => ({ fontSizeMultiplier: Math.max(0.8, state.fontSizeMultiplier - 0.1) })),
        }));

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return (
                    <div className="p-6 m-6 bg-apple-surfaceElevated border border-apple-red/20 rounded-2xl shadow-apple-md">
                        <h2 className="text-lg font-semibold text-apple-red mb-2 flex items-center gap-2"><Lucide.AlertCircle size={20} /> Error occurred</h2>
                        <p className="font-mono text-sm text-apple-textMuted">{this.state.error?.message || 'Unknown error'}</p>
                    </div>
                );
                return this.props.children;
            }
        }

        const GlassSlider = React.memo(({ label, symbol, min, max, step, value, onChange, formatter }) => {
            const percentage = ((value - min) / (max - min)) * 100;
            const handleInput = useCallback((e) => onChange(parseFloat(e.target.value)), [onChange]);
            const shown = formatter ? formatter(value) : value.toFixed(step < 1 ? (step < 0.01 ? 3 : 2) : 0);
            
            const trackStyle = {
                background: `linear-gradient(to right, var(--apple-accent) 0%, var(--apple-accent) ${percentage}%, var(--apple-border) ${percentage}%, var(--apple-border) 100%)`
            };

            return (
                <div className="space-y-2 w-full animate-enter">
                    <div className="flex justify-between items-baseline text-[13px] font-medium text-apple-text">
                        <span>{label} {symbol && <span className="text-apple-textMuted font-normal font-mono ml-1">{symbol}</span>}</span>
                        <span className="text-apple-accent font-semibold">{shown}</span>
                    </div>
                    <div className="relative w-full h-6 flex items-center">
                        <div className="absolute left-0 right-0 h-1 rounded-full pointer-events-none" style={trackStyle}></div>
                        <input type="range" min={min} max={max} step={step} value={value} onChange={handleInput} className="apple-slider relative z-10 w-full" />
                    </div>
                </div>
            );
        });

        const Panel = ({ children, className = '' }) => (
            <div className={cn('bg-apple-surfaceElevated rounded-[20px] p-6 shadow-apple-sm animate-enter', className)}>{children}</div>
        );

        const Stat = ({ label, value, detail, tone = 'normal' }) => (
            <div className="p-3 bg-apple-surface rounded-xl min-w-0 flex flex-col justify-center">
                <div className="text-[11px] uppercase tracking-wider font-semibold text-apple-textMuted mb-0.5">{label}</div>
                <div className={cn('text-[17px] font-semibold tracking-tight truncate', tone === 'accent' ? 'text-apple-accent' : tone === 'danger' ? 'text-apple-red' : 'text-apple-text')}>{value}</div>
                {detail && <div className="text-[11px] text-apple-textMuted mt-0.5 truncate">{detail}</div>}
            </div>
        );

        const Button = ({ onClick, children, variant = 'secondary', disabled = false, className = '', icon }) => {
            const baseStyle = "px-4 py-2 rounded-full text-[13px] font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 active:scale-95";
            const variants = {
                primary: "bg-apple-accent text-white hover:bg-apple-accentHover shadow-sm",
                secondary: "bg-apple-surface text-apple-text hover:bg-apple-border",
                outline: "border border-apple-border text-apple-text hover:bg-apple-surface"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={cn(baseStyle, variants[variant], disabled && "opacity-50 cursor-not-allowed", className)}>
                    {icon && <span className="opacity-80">{icon}</span>}
                    {children}
                </button>
            );
        };

        const InputText = ({ value, onChange, placeholder, error }) => (
            <div className="w-full">
                <input 
                    type="text" 
                    value={value} 
                    onChange={onChange}
                    placeholder={placeholder}
                    className={cn(
                        "w-full bg-apple-surface border border-transparent rounded-xl px-3 py-2.5 text-[13px] text-apple-text font-mono transition-all focus:outline-none focus:ring-2 focus:ring-apple-accent/50 focus:border-apple-accent",
                        error && "border-apple-red/50 focus:ring-apple-red/50 focus:border-apple-red"
                    )}
                />
            </div>
        );

        const PlaceholderDashboard = () => {
            const store = useLessonStore();
            return (
                <div className="space-y-6">
                    <Panel className="space-y-5">
                        <GlassSlider
                            label="Parameter Control"
                            symbol="θ"
                            min={0}
                            max={1}
                            step={0.01}
                            value={store.paramValue}
                            onChange={(v) => store.update({ paramValue: v })}
                        />
                    </Panel>
                    <Panel>
                        <div className="flex items-center justify-between mb-6">
                            <h3 className="text-[15px] font-semibold flex items-center gap-2"><Lucide.Activity size={18} className="text-apple-accent" /> Interactive Simulation</h3>
                            <span className="text-[11px] font-medium text-apple-textMuted bg-apple-surface px-2 py-1 rounded">LIVE VIEW</span>
                        </div>
                        <div className="h-[220px] flex items-center justify-center rounded-2xl bg-apple-surface border border-apple-border font-mono text-xs text-apple-textMuted">
                            [ Visualization / Simulation Mount ]
                        </div>
                        <div className="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-apple-border/50">
                            <Stat label="Primary Value" value={store.paramValue.toFixed(2)} tone="accent" />
                            <Stat label="Secondary" value="0.00" />
                            <Stat label="Status" value="Ready" />
                        </div>
                    </Panel>
                </div>
            );
        };

        const ArticleBlock = ({ block }) => {
            if (block.type === 'equation') return (
                <div className="my-6 p-5 rounded-2xl bg-apple-surface border border-apple-border/50 text-center">
                    <div className="text-[11px] uppercase font-semibold text-apple-textMuted mb-3 tracking-wide">{block.label}</div>
                    <div className="font-mono text-[15px] sm:text-[17px] text-apple-text overflow-x-auto whitespace-nowrap">{block.text}</div>
                </div>
            );
            if (block.type === 'callout') return (
                <div className="my-6 p-5 rounded-2xl bg-apple-surfaceElevated border border-apple-border shadow-apple-sm">
                    <div className="text-[15px] font-bold text-apple-text mb-2 flex items-center gap-2"><Lucide.Info size={16} className="text-apple-textMuted" />{block.title}</div>
                    <p className="text-[15px] leading-relaxed text-apple-textMuted m-0">{block.text}</p>
                </div>
            );
            return <p className="text-[17px] leading-[1.6] text-apple-text font-normal apple-prose text-justify sm:text-left">{block.text}</p>;
        };

        const SegmentedControl = ({ options, value, onChange, className }) => (
            <div className={cn("inline-flex bg-apple-border/50 p-1 rounded-full", className)}>
                {options.map((opt) => (
                    <button
                        key={opt.id}
                        onClick={() => onChange(opt.id)}
                        className={cn(
                            "px-4 py-1.5 rounded-full text-[13px] font-medium transition-all duration-200 relative z-10 flex items-center gap-1.5",
                            value === opt.id ? "text-apple-text shadow-sm bg-apple-surfaceElevated" : "text-apple-textMuted hover:text-apple-text"
                        )}
                    >
                        {opt.icon && <span className="opacity-80 scale-90">{opt.icon}</span>}
                        {opt.label}
                    </button>
                ))}
            </div>
        );

        const ArticleReader = () => {
            const store = useLessonStore();
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setTimeout(() => store.update({ activeSection: entry.target.id }), 50);
                        }
                    });
                }, { root: null, rootMargin: '-10% 0px -70% 0px', threshold: 0 });
                ARTICLE.forEach(sec => { const el = document.getElementById(sec.id); if (el) observer.observe(el); });
                return () => observer.disconnect();
            }, []);

            return (
                <div className="flex h-full w-full relative">
                    {/* Left Sidebar (macOS style) */}
                    <div className="w-64 xl:w-72 flex-shrink-0 bg-apple-surface/50 backdrop-blur-xl border-r border-apple-border hidden lg:flex flex-col relative z-20">
                        <div className="p-4 pt-6"><h2 className="text-[11px] font-bold uppercase tracking-wider text-apple-textMuted px-3">Contents</h2></div>
                        <div className="flex-1 overflow-y-auto no-scrollbar px-3 pb-24 space-y-0.5">
                            {ARTICLE.map(sec => (
                                <a key={sec.id} href={`#${sec.id}`} className={cn(
                                    'block px-3 py-2 rounded-lg text-[13px] leading-tight transition-colors duration-150',
                                    store.activeSection === sec.id ? 'bg-apple-accent text-white font-medium shadow-sm' : 'text-apple-text hover:bg-apple-border/50'
                                )}>
                                    {sec.title}
                                </a>
                            ))}
                        </div>
                        <div className="absolute bottom-0 left-0 w-full p-4 apple-glass-panel border-t border-apple-border flex justify-between items-center z-30">
                            <button onClick={store.toggleTheme} className="p-2 rounded-full hover:bg-apple-border transition-colors text-apple-textMuted hover:text-apple-text" title="Toggle Theme">
                                {store.theme === 'dark' ? <Lucide.Sun size={18} /> : <Lucide.Moon size={18} />}
                            </button>
                            <div className="flex items-center bg-apple-surface rounded-full border border-apple-border/50 shadow-inner">
                                <button onClick={store.decreaseFontSize} className="p-1.5 px-2 text-apple-textMuted hover:text-apple-text"><span className="text-[14px]">A</span></button>
                                <div className="w-[1px] h-4 bg-apple-border"></div>
                                <button onClick={store.increaseFontSize} className="p-1.5 px-2 text-apple-textMuted hover:text-apple-text"><span className="text-[16px] font-semibold">A</span></button>
                            </div>
                        </div>
                    </div>
                    
                    {/* Main Reading Area */}
                    <div className="flex-1 overflow-y-auto scroll-smooth relative no-scrollbar bg-apple-bg">
                        <div className="px-6 py-12 md:px-16 lg:px-24 lg:py-24 max-w-[800px] mx-auto transition-all" style={{ fontSize: `${store.fontSizeMultiplier}rem` }}>
                            <header className="mb-16">
                                <div className="inline-block px-3 py-1 bg-apple-surface rounded-full text-[11px] font-semibold tracking-wider uppercase text-apple-textMuted mb-6">Interactive Essay</div>
                                <h1 className="text-[2.5em] md:text-[3em] font-bold tracking-tight text-apple-text mb-6 leading-[1.1] font-display">Lesson Title Placeholder</h1>
                                <p className="text-[1.15em] leading-relaxed text-apple-textMuted">Subtitle placeholder introducing the problem, mechanism, and takeaways.</p>
                            </header>
                            <div className="space-y-[4em]">
                                {ARTICLE.map(sec => (
                                    <section key={sec.id} id={sec.id} className="scroll-mt-24 group">
                                        <h2 className="text-[1.4em] font-bold text-apple-text mb-5 tracking-tight font-display flex items-center justify-between">
                                            <span>{sec.title}</span>
                                            <button onClick={() => store.update({ activeTab: SECTION_TO_TAB[sec.id], mobileView: 'visuals' })} className="opacity-0 group-hover:opacity-100 p-2 rounded-full bg-apple-surface hover:bg-apple-border text-apple-accent transition-all lg:hidden" title="View interactive visual">
                                                <Lucide.ChevronRight size={18} />
                                            </button>
                                        </h2>
                                        <div>{sec.blocks.map((block, index) => <ArticleBlock key={index} block={block} />)}</div>
                                    </section>
                                ))}
                            </div>
                            <footer className="mt-[6em] border-t border-apple-border pt-[4em] pb-[8em] text-center">
                                <div className="w-12 h-12 rounded-full bg-apple-surface flex items-center justify-center mx-auto text-apple-textMuted">⌘</div>
                            </footer>
                        </div>
                    </div>
                </div>
            );
        };

        const RelatedReading = ({ sectionIds }) => (
            <div className="mt-8 animate-enter">
                <h4 className="text-[12px] font-semibold uppercase tracking-wider text-apple-textMuted mb-3 px-1">Referenced in Article</h4>
                <div className="flex flex-col gap-2">
                    {(sectionIds || []).map(id => {
                        const sec = ARTICLE.find(s => s.id === id);
                        if (!sec) return null;
                        return (
                            <button key={id} onClick={() => { document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); useLessonStore.setState({ activeSection: id, mobileView: 'article' }); }} className="p-3 rounded-xl bg-apple-surfaceElevated shadow-apple-sm border border-transparent hover:border-apple-border text-left w-full transition-all group flex items-center justify-between">
                                <span className="text-[13px] font-medium text-apple-text truncate">{sec.title}</span>
                                <Lucide.ArrowRight size={14} className="text-apple-textMuted group-hover:text-apple-accent transition-colors shrink-0" />
                            </button>
                        );
                    })}
                </div>
            </div>
        );

        const MainApp = () => {
            const store = useLessonStore();
            const tabs = [
                { id: VIS_TABS.TAB_1, icon: <Lucide.Layers size={14}/>, label: 'Primary' },
                { id: VIS_TABS.TAB_2, icon: <Lucide.Activity size={14}/>, label: 'Secondary' }
            ];

            return (
                <ErrorBoundary>
                    <div className="flex h-screen w-screen bg-apple-bg text-apple-text overflow-hidden font-sans selection:bg-apple-accent/20 selection:text-apple-text relative">
                        
                        {/* Left Pane: Article */}
                        <div className={cn('h-full lg:w-[55%] xl:w-[60%] border-r border-apple-border relative z-10 transition-transform duration-300', store.mobileView === 'article' ? 'block w-full' : 'hidden lg:block')}>
                            <ArticleReader />
                        </div>
                        
                        {/* Right Pane: Visuals */}
                        <div className={cn('h-full lg:w-[45%] xl:w-[40%] bg-apple-surface relative z-0 overflow-y-auto no-scrollbar transition-transform duration-300', store.mobileView === 'visuals' ? 'block w-full' : 'hidden lg:block')}>
                            <div className="sticky top-0 z-30 pt-6 pb-4 px-6 apple-glass-panel">
                                <SegmentedControl 
                                    options={tabs} 
                                    value={store.activeTab} 
                                    onChange={(id) => store.update({ activeTab: id })} 
                                    className="w-full justify-between"
                                />
                            </div>
                            
                            <div className="p-6 pt-2 pb-32">
                                <div className="transition-all duration-300">
                                    <PlaceholderDashboard />
                                </div>
                                <RelatedReading sectionIds={TAB_TO_SECTIONS[store.activeTab] || []} />
                            </div>
                        </div>

                        {/* Mobile Bottom Navigation Bar */}
                        <div className="lg:hidden fixed bottom-0 left-0 w-full apple-glass-panel border-t border-apple-border pb-safe z-50">
                            <div className="flex justify-around items-center h-16 px-4">
                                <button onClick={() => store.update({ mobileView: 'article' })} className={cn('flex flex-col items-center justify-center w-20 h-full gap-1 transition-colors', store.mobileView === 'article' ? 'text-apple-accent' : 'text-apple-textMuted')}>
                                    <Lucide.BookOpen size={22} strokeWidth={store.mobileView==='article'? 2.5 : 2} />
                                    <span className="text-[10px] font-medium">Article</span>
                                </button>
                                <button onClick={() => store.update({ mobileView: 'visuals' })} className={cn('flex flex-col items-center justify-center w-20 h-full gap-1 transition-colors', store.mobileView === 'visuals' ? 'text-apple-accent' : 'text-apple-textMuted')}>
                                    <Lucide.SlidersHorizontal size={22} strokeWidth={store.mobileView==='visuals'? 2.5 : 2} />
                                    <span className="text-[10px] font-medium">Interact</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </ErrorBoundary>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<MainApp />);
    </script>
</body>
</html>
