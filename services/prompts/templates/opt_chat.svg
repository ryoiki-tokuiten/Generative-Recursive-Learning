<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Reinforcement learning — interactive concept map and study</title>
<desc id="desc">A warm charcoal lesson interface with a wide branching reinforcement learning map, connected topic cards, an explanatory reading pane, a mathematical objective, and a small gridworld visual.</desc>
<defs>
  <linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1a1918"/><stop offset="1" stop-color="#201f1d"/></linearGradient>
  <linearGradient id="active" x1="0" x2="1"><stop stop-color="#193323"/><stop offset="1" stop-color="#20251f"/></linearGradient>
  <pattern id="fineGrid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#292825" stroke-width=".7"/></pattern>
</defs>

<!-- Calm dark shell and compact lesson header -->
<rect width="1200" height="675" fill="url(#page)"/>
<rect width="1200" height="48" fill="#211f1d"/>
<path d="M0 48H1200" stroke="#3d3c3a"/>
<circle cx="29" cy="24" r="4" fill="#16a34a"/>
<text x="43" y="28" fill="#e8e6e1" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".9">REINFORCEMENT LEARNING</text>
<circle cx="219" cy="24" r="1.7" fill="#77736b"/>
<text x="231" y="28" fill="#a09d97" font-family="monospace" font-size="9">Markov Decision Processes &amp; Policy Optimization</text>
<circle cx="1152" cy="24" r="8" fill="none" stroke="#77736b" stroke-width="1"/><path d="M1152 19v10m-5-5h10" stroke="#77736b" stroke-width="1"/>

