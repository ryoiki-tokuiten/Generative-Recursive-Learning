<!-- Selected root node -->
<rect x="30" y="177" width="720" height="78" rx="11" fill="url(#active)" stroke="#16a34a" stroke-width="1.8"/>
<text x="50" y="207" fill="#8cc99f" font-family="monospace" font-size="7.3" font-weight="700" letter-spacing="1.1">REWARD-DRIVEN SEQUENTIAL DECISION MAKING</text>
<text x="50" y="231" fill="#efede8" font-family="monospace" font-size="13.2" font-weight="700">A policy improves by acting, observing, and learning</text>

<!-- Four connected method families -->
<g font-family="monospace">
  <rect x="36" y="319" width="170" height="45" rx="7" fill="#242320" stroke="#16a34a" stroke-width="1.4"/>
  <text x="48" y="338" fill="#8cc99f" font-size="7.3" font-weight="700" letter-spacing=".4">MODEL-BASED</text><text x="48" y="354" fill="#ebe9e4" font-size="9.2" font-weight="700">Planning &amp; Bellman</text>
  <rect x="222" y="319" width="170" height="45" rx="7" fill="#242320" stroke="#49463f"/>
  <text x="234" y="338" fill="#a09d97" font-size="7.3" font-weight="700" letter-spacing=".4">MODEL-FREE</text><text x="234" y="354" fill="#ebe9e4" font-size="9.2" font-weight="700">TD &amp; Q-Learning</text>
  <rect x="408" y="319" width="170" height="45" rx="7" fill="#242320" stroke="#49463f"/>
  <text x="420" y="338" fill="#a09d97" font-size="7.3" font-weight="700" letter-spacing=".4">DIRECT SEARCH</text><text x="420" y="354" fill="#ebe9e4" font-size="9.2" font-weight="700">Policy Gradients</text>
