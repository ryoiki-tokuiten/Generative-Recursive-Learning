</g>

<!-- Reading and live lab pane -->
<text x="806" y="122" fill="#efede8" font-family="Georgia,serif" font-size="22" font-weight="700">Reinforcement Learning:</text>
<text x="806" y="149" fill="#efede8" font-family="Georgia,serif" font-size="19" font-weight="700">Optimal sequential control</text>
<text x="806" y="176" fill="#efede8" font-family="Georgia,serif" font-size="19" font-weight="700">under uncertainty</text>
<g fill="#c0bdb6" font-family="Georgia,serif" font-size="11.5">
  <text x="806" y="211">An agent interacts with an environment,</text>
  <text x="806" y="229">observes state transitions and rewards,</text>
  <text x="806" y="247">then improves its policy to maximize</text>
  <text x="806" y="265">long-term return under uncertainty.</text>
</g>

<!-- Mathematical objective -->
<rect x="806" y="286" width="366" height="92" rx="9" fill="#1c1b19" stroke="#3d3c3a"/>
<text x="822" y="305" fill="#9b978f" font-family="monospace" font-size="7.2" font-weight="700" letter-spacing=".9">EXPECTED DISCOUNTED RETURN</text>
<text x="822" y="343" fill="#65c98b" font-family="Georgia,serif" font-size="19" font-style="italic">J(π) = E [ Σ γᵗ rₜ ]</text>
<text x="822" y="362" fill="#8d8981" font-family="monospace" font-size="7.5">choose actions to improve future reward</text>

