<rect y="49" width="1200" height="37" fill="#1d1c1a"/>
<path d="M0 86H1200" stroke="#34322e"/>
<text x="22" y="71" fill="#817c73" font-family="monospace" font-size="7.4" font-weight="700" letter-spacing="1">FAST ZOOM HOPS</text>
<g font-family="monospace" font-size="7.2" fill="#c7c4bd">
  <rect x="126" y="57" width="202" height="20" rx="4" fill="#211f1d" stroke="#45423c"/><text x="136" y="70">Why does Bellman reach an optimum?</text>
  <rect x="335" y="57" width="205" height="20" rx="4" fill="#211f1d" stroke="#45423c"/><text x="345" y="70">Q-learning vs SARSA near hazards</text>
  <rect x="547" y="57" width="196" height="20" rx="4" fill="#211f1d" stroke="#45423c"/><text x="557" y="70">How does PPO stabilize updates?</text>
  <rect x="750" y="57" width="207" height="20" rx="4" fill="#211f1d" stroke="#45423c"/><text x="760" y="70">How should an agent explore?</text>
</g>

<!-- Two-pane lesson: the map gets the larger share -->
<rect x="0" y="87" width="780" height="588" fill="#1a1918"/>
<rect x="0" y="87" width="780" height="588" fill="url(#fineGrid)" opacity=".24"/>
<rect x="780" y="87" width="420" height="588" fill="#211f1d"/>
