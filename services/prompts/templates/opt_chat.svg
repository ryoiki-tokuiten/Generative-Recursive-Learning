  <text x="606" y="338" fill="#a09d97" font-size="7.3" font-weight="700" letter-spacing=".4">UNCERTAINTY</text><text x="606" y="354" fill="#ebe9e4" font-size="9.2" font-weight="700">Explore &amp; Control</text>
</g>

<!-- Principle nodes: paired topics sit within four non-overlapping columns -->
<g font-family="monospace">
  <g><rect x="36" y="394" width="82" height="40" rx="5" fill="#242320" stroke="#49463f"/><text x="43" y="410" fill="#e5e2dc" font-size="7" font-weight="700">MDP model</text><text x="43" y="424" fill="#a09d97" font-size="5.8">states · actions</text></g>
  <g><rect x="124" y="394" width="82" height="40" rx="5" fill="#242320" stroke="#49463f"/><text x="131" y="410" fill="#e5e2dc" font-size="7" font-weight="700">Value backup</text><text x="131" y="424" fill="#a09d97" font-size="5.8">Bellman step</text></g>
  <g><rect x="222" y="394" width="82" height="40" rx="5" fill="#242320" stroke="#49463f"/><text x="229" y="410" fill="#e5e2dc" font-size="7" font-weight="700">TD learning</text><text x="229" y="424" fill="#a09d97" font-size="5.8">bootstrap</text></g>
  <g><rect x="310" y="394" width="82" height="40" rx="5" fill="#242320" stroke="#49463f"/><text x="317" y="410" fill="#e5e2dc" font-size="7" font-weight="700">Q / SARSA</text><text x="317" y="424" fill="#a09d97" font-size="5.8">on · off policy</text></g>
  <g><rect x="408" y="394" width="82" height="40" rx="5" fill="#242320" stroke="#49463f"/><text x="415" y="410" fill="#e5e2dc" font-size="7" font-weight="700">REINFORCE</text><text x="415" y="424" fill="#a09d97" font-size="5.8">policy gradient</text></g>
  <g><rect x="496" y="394" width="82" height="40" rx="5" fill="#242320" stroke="#49463f"/><text x="503" y="410" fill="#e5e2dc" font-size="7" font-weight="700">PPO &amp; GAE</text><text x="503" y="424" fill="#a09d97" font-size="5.8">stable updates</text></g>
  <g><rect x="594" y="394" width="82" height="40" rx="5" fill="#242320" stroke="#49463f"/><text x="601" y="410" fill="#e5e2dc" font-size="7" font-weight="700">Bandits</text><text x="601" y="424" fill="#a09d97" font-size="5.8">regret · optimism</text></g>
  <g><rect x="682" y="394" width="82" height="40" rx="5" fill="#242320" stroke="#49463f"/><text x="689" y="410" fill="#e5e2dc" font-size="7" font-weight="700">Control</text><text x="689" y="424" fill="#a09d97" font-size="5.8">continuous action</text></g>
</g>

<!-- Supporting concepts stay aligned with their parent cards -->
