  <rect x="408" y="443" width="82" height="22" rx="4" fill="#211f1d" stroke="#3d3c3a"/><text x="414" y="457">reward-to-go</text>
  <rect x="408" y="470" width="82" height="22" rx="4" fill="#211f1d" stroke="#3d3c3a"/><text x="414" y="484">baseline V(s)</text>
  <rect x="496" y="443" width="82" height="22" rx="4" fill="#211f1d" stroke="#3d3c3a"/><text x="502" y="457">advantage estimate</text>
