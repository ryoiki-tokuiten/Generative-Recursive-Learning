<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Interactive first-principles lesson.">
    <title>Interactive Essay</title>
    
    <script>
        (function () {
            const savedTheme = localStorage.getItem('apple-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: 'var(--apple-bg)',
                            surface: 'var(--apple-surface)',
                            surfaceElevated: 'var(--apple-surface-elevated)',
                            text: 'var(--apple-text)',
                            textMuted: 'var(--apple-text-muted)',
                            accent: 'var(--apple-accent)',
                            accentHover: 'var(--apple-accent-hover)',
                            border: 'var(--apple-border)',
                            glass: 'var(--apple-glass)',
                            red: 'var(--apple-red)',
                            orange: 'var(--apple-orange)',
                            chart1: 'var(--apple-chart-1)',
                            chart2: 'var(--apple-chart-2)',
                        }
                    },
                    fontFamily: {
                        sans: [
                            '-apple-system', 
                            'BlinkMacSystemFont', 
                            '"SF Pro Text"', 
                            '"Helvetica Neue"', 
                            'sans-serif'
                        ],
                        mono: [
                            '"SF Mono"', 
                            'ui-monospace', 
                            'Menlo', 
                            'Monaco', 
                            'monospace'
                        ],
                        display: [
                            '-apple-system', 
                            'BlinkMacSystemFont', 
                            '"SF Pro Display"', 
                            '"Helvetica Neue"', 
                            'sans-serif'
                        ]
                    },
                    boxShadow: {
                        'apple-sm': '0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02)',
                        'apple-md': '0 8px 24px rgba(0, 0, 0, 0.05), 0 4px 8px rgba(0, 0, 0, 0.03)',
                        'apple-glass': '0 8px 32px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        };
    </script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react,react-dom",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "zustand": "https://esm.sh/zustand@4.5.0?external=react",
            "zod": "https://esm.sh/zod@3.22.4",
            "clsx": "https://esm.sh/clsx@2.1.0",
            "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1",
            "lodash": "https://esm.sh/lodash@4.17.21"
        }
    }
    </script>
    
    <style>
        :root {
            --apple-bg: #ffffff;
            --apple-surface: #f5f5f7;
            --apple-surface-elevated: #ffffff;
            --apple-text: #1d1d1f;
            --apple-text-muted: #86868b;
            --apple-accent: #0066cc;
            --apple-accent-hover: #0055b3;
            --apple-border: rgba(60, 60, 67, 0.12);
            --apple-glass: rgba(255, 255, 255, 0.85);
            --apple-red: #ff3b30;
            --apple-orange: #f56a00;
            --apple-chart-1: #34c759;
            --apple-chart-2: #5ac8fa;
        }

        .dark {
            --apple-bg: #000000;
            --apple-surface: #1c1c1e;
            --apple-surface-elevated: #2c2c2e;
            --apple-text: #f5f5f7;
            --apple-text-muted: #98989d;
            --apple-accent: #2997ff;
            --apple-accent-hover: #5ac8fa;
            --apple-border: rgba(84, 84, 88, 0.45);
            --apple-glass: rgba(28, 28, 30, 0.85);
            --apple-red: #ff453a;
            --apple-orange: #ff9f0a;
            --apple-chart-1: #32d74b;
            --apple-chart-2: #64d2ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: background-color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.4s ease;
        }

        * { box-sizing: border-box; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background-clip: padding-box;
            border: 3px solid transparent;
            background-color: var(--apple-text-muted);
            border-radius: 9999px;
            opacity: 0.5;
        }
        ::-webkit-scrollbar-thumb:hover { border-width: 2px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=range].apple-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
            margin: 10px 0;
        }
        input[type=range].apple-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: var(--apple-border);
            border-radius: 3px;
            transition: background 0.2s;
        }
        input[type=range].apple-slider::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15), 0 0 1px rgba(0,0,0,0.2) inset;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
            border: 0.5px solid rgba(0,0,0,0.04);
        }
        input[type=range].apple-slider:active::-webkit-slider-thumb { transform: scale(1.1); }
        .dark input[type=range].apple-slider::-webkit-slider-thumb {
            background: #d1d1d6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255,255,255,0.2) inset;
        }

        .apple-prose p { 
            margin-bottom: 1.5em; 
            line-height: 1.65; 
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }
        h1, h2, h3, h4, .font-display { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            letter-spacing: -0.025em; 
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

        .apple-glass-panel {
            background: var(--apple-glass);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- AGENT GUIDE: Preserve this Apple editorial scrollytelling layout (fixed glass header, `max-w-[700px]` prose column, and `max-w-[960px]` outset `FigurePanel` interactive components) along with all `apple-*` CSS variables and UI primitives (`GlassSlider`, `FigurePanel`, `Stat`, `Button`, `InputText`, `ArticleBlock`). Populate `ARTICLE` with clear, mechanism-first sections (`p`, `equation`, `callout`), build interactive figures for key sections, and bind them in `SECTION_INTERACTIVES` so they render inline as breakout interactive cards. -->
    <script type="text/babel" data-type="module">
        import React, { useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { create } from 'zustand';
        import { clsx } from 'clsx';
        import { twMerge } from 'tailwind-merge';
        import * as Lucide from 'lucide-react';

        const cn = (...inputs) => twMerge(clsx(inputs));

        const ARTICLE = Object.freeze([
            {
                id: 'sec-1',
                title: '1. Section title placeholder',
                blocks: [
                    { type: 'p', text: 'Replace this placeholder with clear, mechanism-first lesson prose.' },
                    { type: 'equation', label: 'Core Equation', text: 'f(x) = ...' },
                    { type: 'callout', title: 'Important boundary', text: 'Clarify essential assumptions or conceptual boundaries here.' }
                ]
            }
        ]);

        const useLessonStore = create((set, get) => ({
            theme: localStorage.getItem('apple-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
            fontSizeMultiplier: 1.0,
            paramValue: 0.5,

            update: (partial) => set(partial),
            toggleTheme: () => {
                const newTheme = get().theme === 'dark' ? 'light' : 'dark';
                set({ theme: newTheme });
                localStorage.setItem('apple-theme', newTheme);
                document.documentElement.classList.toggle('dark', newTheme === 'dark');
            },
            increaseFontSize: () => set(state => ({ fontSizeMultiplier: Math.min(1.4, state.fontSizeMultiplier + 0.1) })),
            decreaseFontSize: () => set(state => ({ fontSizeMultiplier: Math.max(0.9, state.fontSizeMultiplier - 0.1) })),
        }));

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return (
                    <div className="p-6 m-6 bg-apple-surface border border-apple-red/20 rounded-2xl shadow-sm">
                        <h2 className="text-lg font-semibold text-apple-red mb-2 flex items-center gap-2"><Lucide.AlertCircle size={20} /> Error occurred</h2>
                        <p className="font-mono text-sm text-apple-textMuted">{this.state.error?.message || 'Unknown error'}</p>
                    </div>
                );
                return this.props.children;
            }
        }

        const GlassSlider = React.memo(({ label, symbol, min, max, step, value, onChange, formatter }) => {
            const percentage = ((value - min) / (max - min)) * 100;
            const handleInput = useCallback((e) => onChange(parseFloat(e.target.value)), [onChange]);
            const shown = formatter ? formatter(value) : value.toFixed(step < 1 ? (step < 0.01 ? 3 : 2) : 0);
            
            const trackStyle = {
                background: `linear-gradient(to right, var(--apple-accent) 0%, var(--apple-accent) ${percentage}%, var(--apple-border) ${percentage}%, var(--apple-border) 100%)`
            };

            return (
                <div className="space-y-2 w-full animate-enter">
                    <div className="flex justify-between items-baseline text-[14px] font-medium text-apple-text">
                        <span>{label} {symbol && <span className="text-apple-textMuted font-normal font-mono ml-1">{symbol}</span>}</span>
                        <span className="text-apple-accent font-semibold">{shown}</span>
                    </div>
                    <div className="relative w-full h-8 flex items-center">
                        <div className="absolute left-0 right-0 h-[6px] rounded-full pointer-events-none" style={trackStyle}></div>
                        <input type="range" min={min} max={max} step={step} value={value} onChange={handleInput} className="apple-slider relative z-10 w-full" />
                    </div>
                </div>
            );
        });

        const FigurePanel = ({ children, className = '' }) => (
            <figure className={cn('bg-apple-surface rounded-[24px] sm:rounded-[32px] p-6 sm:p-10 animate-enter', className)}>
                {children}
            </figure>
        );

        const Stat = ({ label, value, detail, tone = 'normal' }) => (
            <div className="p-4 bg-apple-surfaceElevated rounded-2xl min-w-0 flex flex-col justify-center shadow-apple-sm">
                <div className="text-[12px] uppercase tracking-wider font-semibold text-apple-textMuted mb-1">{label}</div>
                <div className={cn('text-[24px] font-semibold tracking-tight truncate font-display', tone === 'accent' ? 'text-apple-accent' : tone === 'danger' ? 'text-apple-red' : 'text-apple-text')}>{value}</div>
                {detail && <div className="text-[13px] font-medium text-apple-textMuted mt-1 truncate">{detail}</div>}
            </div>
        );

        const Button = ({ onClick, children, variant = 'secondary', disabled = false, className = '', icon }) => {
            const baseStyle = "px-4 py-2.5 rounded-full text-[14px] font-medium transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.98]";
            const variants = {
                primary: "bg-apple-accent text-white hover:bg-apple-accentHover shadow-apple-sm",
                secondary: "bg-apple-surfaceElevated text-apple-text hover:bg-apple-border/50 shadow-apple-sm",
                outline: "bg-transparent text-apple-text hover:bg-apple-surface"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={cn(baseStyle, variants[variant], disabled && "opacity-50 cursor-not-allowed", className)}>
                    {icon && <span className="opacity-80">{icon}</span>}
                    {children}
                </button>
            );
        };

        const InputText = ({ value, onChange, placeholder, error }) => (
            <div className="w-full">
                <input 
                    type="text" 
                    value={value} 
                    onChange={onChange}
                    placeholder={placeholder}
                    className={cn(
                        "w-full bg-apple-surfaceElevated rounded-xl px-4 py-3 text-[14px] text-apple-text font-mono transition-all focus:outline-none focus:ring-2 focus:ring-apple-accent/50 shadow-apple-sm",
                        error && "focus:ring-apple-red/50"
                    )}
                />
            </div>
        );

        const PlaceholderFigure = () => {
            const store = useLessonStore();
            return (
                <FigurePanel className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
                    <div className="lg:col-span-5 space-y-8">
                        <div>
                            <h3 className="text-[22px] font-bold font-display mb-3">Interactive Figure</h3>
                            <p className="text-[16px] text-apple-textMuted leading-relaxed">Adjust the controls below to inspect how the underlying mechanism behaves in real time.</p>
                        </div>
                        <div className="space-y-6 bg-apple-surfaceElevated p-6 rounded-[24px] shadow-apple-sm">
                            <GlassSlider
                                label="Parameter Control"
                                symbol="θ"
                                min={0}
                                max={1}
                                step={0.01}
                                value={store.paramValue}
                                onChange={(v) => store.update({ paramValue: v })}
                            />
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <Stat label="Primary Metric" value={store.paramValue.toFixed(2)} tone="accent" detail="Live readout" />
                            <Stat label="Secondary Metric" value="0.00" detail="Reference" />
                        </div>
                    </div>
                    <div className="lg:col-span-7 h-[340px] bg-apple-surfaceElevated rounded-[32px] p-6 shadow-apple-sm flex items-center justify-center font-mono text-xs text-apple-textMuted">
                        [ Outset Interactive Visualization Mount ]
                    </div>
                </FigurePanel>
            );
        };

        const SECTION_INTERACTIVES = {
            'sec-1': () => <PlaceholderFigure />
        };

        const ArticleBlock = ({ block }) => {
            if (block.type === 'equation') return (
                <div className="my-8 p-6 rounded-[24px] bg-apple-surface text-center">
                    <div className="text-[12px] uppercase font-semibold text-apple-textMuted mb-3 tracking-wide font-display">{block.label}</div>
                    <div className="font-mono text-[16px] sm:text-[18px] text-apple-text overflow-x-auto whitespace-nowrap">{block.text}</div>
                </div>
            );
            if (block.type === 'callout') return (
                <div className="my-10 p-8 rounded-[32px] bg-apple-surfaceElevated shadow-apple-md">
                    <div className="text-[18px] font-bold text-apple-text mb-3 flex items-center gap-3 font-display"><Lucide.Info size={22} className="text-apple-accent" />{block.title}</div>
                    <p className="text-[16px] leading-relaxed text-apple-textMuted m-0">{block.text}</p>
                </div>
            );
            return <p className="text-[18px] md:text-[20px] leading-[1.65] text-apple-text font-normal apple-prose mb-[1.5em] tracking-[-0.01em]">{block.text}</p>;
        };

        const MainApp = () => {
            const store = useLessonStore();
            
            return (
                <ErrorBoundary>
                    <div className="min-h-screen bg-apple-bg text-apple-text selection:bg-apple-accent/20 selection:text-apple-text font-sans relative">
                        
                        {/* Immersive Glass Header */}
                        <header className="fixed top-0 left-0 right-0 z-50 apple-glass-panel border-b border-apple-border/50 px-4 sm:px-8 py-4 flex justify-between items-center transition-all duration-300">
                            <div className="font-display font-semibold text-[15px] tracking-tight truncate hidden sm:block opacity-80 hover:opacity-100 transition-opacity">
                                Interactive Lesson
                            </div>
                            <div className="sm:hidden font-display font-semibold text-[15px] tracking-tight">
                                Lesson
                            </div>
                            
                            <div className="flex items-center gap-4 shrink-0">
                                <div className="flex items-center bg-apple-surface rounded-full border border-apple-border/50 shadow-inner overflow-hidden">
                                    <button onClick={store.decreaseFontSize} className="px-3 py-1.5 text-apple-textMuted hover:text-apple-text hover:bg-apple-border/30 transition-colors"><span className="text-[14px]">A</span></button>
                                    <div className="w-[1px] h-4 bg-apple-border"></div>
                                    <button onClick={store.increaseFontSize} className="px-3 py-1.5 text-apple-textMuted hover:text-apple-text hover:bg-apple-border/30 transition-colors"><span className="text-[16px] font-semibold">A</span></button>
                                </div>
                                <button onClick={store.toggleTheme} className="p-2 rounded-full hover:bg-apple-surface transition-colors text-apple-textMuted hover:text-apple-text" title="Toggle Theme">
                                    {store.theme === 'dark' ? <Lucide.Sun size={20} /> : <Lucide.Moon size={20} />}
                                </button>
                            </div>
                        </header>
                        
                        {/* Central Content Flow */}
                        <main className="pt-32 pb-40 w-full overflow-x-hidden" style={{ fontSize: `${store.fontSizeMultiplier}rem` }}>
                            
                            <div className="max-w-[700px] mx-auto px-6 md:px-8 mb-20 md:mb-32">
                                <div className="inline-block px-3 py-1 bg-apple-surface rounded-full text-[12px] font-semibold tracking-wider uppercase text-apple-textMuted mb-6 border border-apple-border/50">Interactive Essay</div>
                                <h1 className="text-[3em] md:text-[3.5em] font-bold tracking-tight text-apple-text mb-6 leading-[1.05] font-display">Lesson Title Placeholder</h1>
                                <p className="text-[1.3em] leading-relaxed text-apple-textMuted max-w-[600px]">Subtitle placeholder introducing the problem, mechanism, and takeaways.</p>
                            </div>

                            <article className="px-4 sm:px-6 md:px-8">
                                {ARTICLE.map((sec) => (
                                    <section key={sec.id} id={sec.id} className="mb-16 md:mb-24 scroll-mt-32">
                                        <div className="max-w-[700px] mx-auto">
                                            <h2 className="text-[1.8em] md:text-[2em] font-bold text-apple-text mb-6 tracking-tight font-display">
                                                {sec.title}
                                            </h2>
                                            <div>{sec.blocks.map((block, index) => <ArticleBlock key={index} block={block} />)}</div>
                                        </div>

                                        {SECTION_INTERACTIVES[sec.id] && (
                                            <div className="max-w-[960px] mx-auto mt-12 mb-20 lg:mt-16 lg:mb-24 relative z-10 px-2 sm:px-0">
                                                {SECTION_INTERACTIVES[sec.id]()}
                                            </div>
                                        )}
                                    </section>
                                ))}
                            </article>

                            <footer className="mt-32 border-t border-apple-border pt-20 pb-20 text-center max-w-[700px] mx-auto px-6">
                                <div className="w-14 h-14 rounded-full bg-apple-surface flex items-center justify-center mx-auto text-apple-textMuted text-xl mb-6 shadow-sm border border-apple-border/50">⌘</div>
                                <p className="text-apple-textMuted text-[14px]">An interactive exploration of first principles.</p>
                            </footer>
                        </main>
                    </div>
                </ErrorBoundary>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<MainApp />);
    </script>
</body>
</html>
