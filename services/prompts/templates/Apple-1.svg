<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Apple 1 — interactive essay with contents and visualizer</title><desc id="desc">A black Apple-style three-pane layout: contents rail, focused article, and a blue-accented interactive chart workspace.</desc>
<defs><linearGradient id="chartfill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2997FF" stop-opacity=".22"/><stop offset="1" stop-color="#2997FF" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="675" fill="#000"/><rect width="218" height="675" fill="#161618"/><rect x="218" width="535" height="675" fill="#000"/><rect x="753" width="447" height="675" fill="#1C1C1E"/><path d="M218 0V675M753 0V675" stroke="#343437"/>
<text x="26" y="34" fill="#98989D" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">LESSON CONTENTS</text><text x="26" y="61" fill="#F5F5F7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Compression</text><text x="26" y="81" fill="#98989D" font-family="Arial,sans-serif" font-size="10">First principles · 16 sections</text><path d="M16 98H202" stroke="#343437"/>
<rect x="16" y="111" width="186" height="78" rx="12" fill="#0A84FF"/><text x="30" y="130" fill="#DCEEFF" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1">01 / 16 · CURRENT</text><text x="30" y="153" fill="#FFF" font-family="Arial,sans-serif" font-size="12" font-weight="700">What the claim</text><text x="30" y="169" fill="#FFF" font-family="Arial,sans-serif" font-size="12" font-weight="700">actually says</text>
<path d="M32 219V405" stroke="#343437"/><g font-family="Arial,sans-serif"><circle cx="32" cy="219" r="9" fill="#232326" stroke="#4A4A4D"/><text x="32" y="222" text-anchor="middle" fill="#B8B8BD" font-size="7">02</text><text x="50" y="219" fill="#E5E5E7" font-size="11" font-weight="600">Regularity &amp; patterns</text><text x="50" y="235" fill="#77777D" font-size="9">Where compressibility begins</text><circle cx="32" cy="281" r="9" fill="#232326" stroke="#4A4A4D"/><text x="32" y="284" text-anchor="middle" fill="#B8B8BD" font-size="7">03</text><text x="50" y="281" fill="#E5E5E7" font-size="11" font-weight="600">Entropy</text><text x="50" y="297" fill="#77777D" font-size="9">The average cost of uncertainty</text><circle cx="32" cy="343" r="9" fill="#232326" stroke="#4A4A4D"/><text x="32" y="346" text-anchor="middle" fill="#B8B8BD" font-size="7">04</text><text x="50" y="343" fill="#E5E5E7" font-size="11" font-weight="600">Probability &amp; codes</text><text x="50" y="359" fill="#77777D" font-size="9">Prediction measured in bits</text><circle cx="32" cy="405" r="9" fill="#232326" stroke="#4A4A4D"/><text x="32" y="408" text-anchor="middle" fill="#B8B8BD" font-size="7">05</text><text x="50" y="405" fill="#E5E5E7" font-size="11" font-weight="600">Model + residual</text><text x="50" y="421" fill="#77777D" font-size="9">Separate rule from remainder</text></g>
<text x="32" y="466" fill="#98989D" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1">+ 11 MORE SECTIONS</text><text x="32" y="500" fill="#98989D" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1">READING PROGRESS</text><text x="188" y="500" text-anchor="end" fill="#B8B8BD" font-family="Arial,sans-serif" font-size="9">01 / 16</text><rect x="32" y="512" width="156" height="4" rx="2" fill="#343437"/><rect x="32" y="512" width="10" height="4" rx="2" fill="#0A84FF"/>
<rect x="0" y="600" width="218" height="75" fill="#19191B"/><path d="M0 600H218" stroke="#343437"/><circle cx="43" cy="637" r="15" fill="#232326"/><path d="M43 628v18m-7-9h14" stroke="#98989D" stroke-width="1.5"/><rect x="88" y="624" width="91" height="25" rx="12" fill="#242426"/><text x="102" y="641" fill="#98989D" font-family="Arial,sans-serif" font-size="11">A−</text><text x="148" y="641" fill="#F5F5F7" font-family="Arial,sans-serif" font-size="12" font-weight="700">A+</text>
<rect x="250" y="36" width="121" height="24" rx="12" fill="#1C1C1E"/><text x="266" y="52" fill="#98989D" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">INTERACTIVE ESSAY</text>
<text x="250" y="109" fill="#D1D1D6" font-family="Arial,sans-serif" font-size="14">“Compression is intelligence” is useful only if we</text><text x="250" y="132" fill="#D1D1D6" font-family="Arial,sans-serif" font-size="14">state the claim precisely. Learning a compact</text><text x="250" y="155" fill="#D1D1D6" font-family="Arial,sans-serif" font-size="14">description of data requires finding regularities that</text><text x="250" y="178" fill="#D1D1D6" font-family="Arial,sans-serif" font-size="14">help a system predict, generalize, and form abstractions.</text>
<g fill="#29292C"><rect x="250" y="198" width="465" height="6" rx="3"/><rect x="250" y="216" width="414" height="6" rx="3"/><rect x="250" y="234" width="326" height="6" rx="3"/></g>
<path d="M250 251H715" stroke="#343437"/><text x="250" y="294" fill="#F5F5F7" font-family="Arial,sans-serif" font-size="22" font-weight="700">A model is a compressed map.</text>
<text x="250" y="322" fill="#98989D" font-family="Arial,sans-serif" font-size="14">Keep the structure. Spend fewer resources describing each detail.</text>
<rect x="250" y="351" width="465" height="91" rx="18" fill="#1C1C1E"/><text x="275" y="378" fill="#98989D" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">THE MODEL</text><text x="275" y="411" fill="#F5F5F7" font-family="Arial,sans-serif" font-size="19" font-weight="600">Signal  →  Pattern  →  Prediction</text>
<rect x="250" y="462" width="465" height="6" rx="3" fill="#29292C"/><rect x="250" y="462" width="410" height="6" rx="3" fill="#5B5B60"/><rect x="250" y="486" width="432" height="6" rx="3" fill="#29292C"/><rect x="250" y="486" width="360" height="6" rx="3" fill="#5B5B60"/>
<text x="785" y="43" fill="#98989D" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">INTERACTIVE MODEL</text><circle cx="1151" cy="39" r="4" fill="#0A84FF"/>
<rect x="779" y="67" width="421" height="47" rx="13" fill="#2C2C2E"/><g font-family="Arial,sans-serif" font-size="11"><rect x="789" y="75" width="80" height="31" rx="9" fill="#3A3A3C"/><text x="807" y="95" fill="#F5F5F7">DETAILS</text><text x="883" y="95" fill="#98989D">MODEL</text><text x="964" y="95" fill="#98989D">LIMITS</text></g>
<text x="788" y="148" fill="#F5F5F7" font-family="Arial,sans-serif" font-size="17" font-weight="600">Change the model</text><path d="M800 177H1168" stroke="#4A4A4D" stroke-width="4" stroke-linecap="round"/><path d="M800 177H1003" stroke="#0A84FF" stroke-width="4" stroke-linecap="round"/><circle cx="1003" cy="177" r="9" fill="#0A84FF"/>
<rect x="779" y="205" width="421" height="275" rx="18" fill="#111113" stroke="#2C2C2E"/><text x="805" y="233" fill="#98989D" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">PREDICTION · EXAMPLE A</text>
<path d="M811 431H1168M811 270V431M811 391H1168M811 351H1168M811 311H1168" stroke="#29292C"/><path d="M824 407 C860 394 879 401 907 367 S947 377 975 335 S1020 354 1050 311 S1091 325 1114 282 S1145 295 1160 260 L1160 431H824Z" fill="url(#chartfill)"/><path d="M824 407 C860 394 879 401 907 367 S947 377 975 335 S1020 354 1050 311 S1091 325 1114 282 S1145 295 1160 260" fill="none" stroke="#2997FF" stroke-width="4"/><circle cx="1050" cy="311" r="5" fill="#64D2FF" stroke="#111113" stroke-width="2"/>
<text x="808" y="455" fill="#98989D" font-family="Arial,sans-serif" font-size="10">OBSERVED</text><text x="1112" y="455" fill="#98989D" font-family="Arial,sans-serif" font-size="10">PREDICTED</text>
<rect x="779" y="499" width="200" height="89" rx="15" fill="#2C2C2E"/><text x="798" y="525" fill="#98989D" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">COMPLEXITY</text><text x="798" y="561" fill="#F5F5F7" font-family="Arial,sans-serif" font-size="21" font-weight="600">Low</text><rect x="992" y="499" width="208" height="89" rx="15" fill="#2C2C2E"/><text x="1011" y="525" fill="#98989D" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">FIT</text><text x="1011" y="561" fill="#64D2FF" font-family="Arial,sans-serif" font-size="21" font-weight="600">Balanced</text>
