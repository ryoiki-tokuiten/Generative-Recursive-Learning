                                    className="w-full accent-optGreen"
                                />
                            </div>
                            <div className="bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded border border-slate-200 dark:border-slate-800 space-y-1">
                                <div className="text-slate-500 dark:text-slate-400">
                                    Estimator Bias: <strong className="text-amber-600 dark:text-amber-400">{((1 - lambda) * 100).toFixed(0)}%</strong>
                                </div>
                                <div className="text-slate-500 dark:text-slate-400">
                                    Sample Variance: <strong className="text-optGreen">{(lambda * 100).toFixed(0)}%</strong>
                                </div>
                            </div>
                        </div>

                        <div className="md:col-span-2 space-y-2">
                            <div className="text-xs font-mono text-slate-600 dark:text-slate-400 mb-1 flex items-center gap-1">
                                <span>Temporal Advantage Weight Decay:</span>
                                <MathView math="(\gamma \lambda)^l" />
                            </div>
                            <div className="grid grid-cols-8 gap-1.5 h-28 items-end bg-slate-50 dark:bg-slate-950 p-2 rounded border border-slate-200 dark:border-slate-800">
                                {weights.map((wt, idx) => (
                                    <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end">
                                        <div
                                            className="w-full bg-optGreen rounded-t transition-all"
                                            style={{ height: `${wt * 100}%` }}
                                        />
                                        <span className="text-[9px] font-mono text-slate-500 dark:text-slate-400 mt-1">l={idx}</span>
                                        <span className="text-[8px] font-mono text-slate-400 dark:text-slate-500">{(wt).toFixed(2)}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LabSoftmaxEntropy = () => {
            const [temp, setTemp] = useState(1.0);
            const [logits, setLogits] = useState([2.5, 1.2, 0.4, -0.8]);

            const probs = useMemo(() => {
                const exps = logits.map(z => Math.exp(z / Math.max(0.05, temp)));
                const sum = exps.reduce((a, b) => a + b, 0);
                return exps.map(e => e / sum);
            }, [logits, temp]);

            const entropy = useMemo(() => {
                return -probs.reduce((sum, p) => sum + (p > 0 ? p * Math.log(p) : 0), 0);
            }, [probs]);

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                        <div>
                            <h4 className="font-mono text-sm font-bold text-slate-800 dark:text-slate-200 uppercase">
                                Softmax Temperature & Shannon Policy Entropy
                            </h4>
                            <p className="text-xs text-slate-500 dark:text-slate-400 font-serif flex items-center gap-1.5">
                                <MathView math="H(\pi) = -\sum \pi(a) \ln \pi(a)" />
                                <span>— Preventing premature deterministic collapse</span>
                            </p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="space-y-3 font-mono text-xs">
                            <div>
                                <div className="flex justify-between text-slate-600 dark:text-slate-400">
                                    <span className="flex items-center gap-1">Temperature (<MathView math="\tau" />):</span>
                                    <strong className="text-optGreen">{temp.toFixed(2)}</strong>
                                </div>
                                <input
                                    type="range"
                                    min="0.1"
                                    max="3.0"
                                    step="0.05"
                                    value={temp}
                                    onChange={e => setTemp(parseFloat(e.target.value))}
                                    className="w-full accent-optGreen"
                                />
                            </div>
                            <div className="bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded border border-slate-200 dark:border-slate-800 space-y-1">
                                <div className="text-slate-500 dark:text-slate-400 flex items-center gap-1">
                                    <span>Policy Entropy</span>
                                    <MathView math="H(\pi)" />:
                                    <strong className="text-optGreen">{entropy.toFixed(3)} nats</strong>
                                </div>
                                <div className="text-slate-500 dark:text-slate-400">
                                    Max Possible (Uniform): <strong className="text-slate-700 dark:text-slate-300">1.386 nats</strong>
                                </div>
                                <div className="text-[10px] text-amber-600 dark:text-amber-400 font-semibold pt-1">
                                    {temp < 0.3 ? '⚠️ High risk of deterministic collapse' : '✓ Healthy exploration entropy'}
                                </div>
                            </div>
                        </div>

                        <div className="md:col-span-2 flex flex-col justify-end gap-2 bg-slate-50 dark:bg-slate-950 p-3 rounded-lg border border-slate-200 dark:border-slate-800">
                            <div className="grid grid-cols-4 gap-2 h-28 items-end">
                                {probs.map((p, idx) => (
                                    <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end">
                                        <div
                                            className="w-full bg-optGreen rounded-t transition-all"
                                            style={{ height: `${p * 100}%` }}
                                        />
                                        <span className="text-[10px] font-mono font-bold text-slate-700 dark:text-slate-300 mt-1">
                                            Act {idx + 1}
                                        </span>
                                        <span className="text-[9px] font-mono text-optGreen font-semibold">
                                            {(p * 100).toFixed(1)}%
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LabCartPole = () => {
            const canvasRef = useRef(null);
            const [running, setRunning] = useState(true);
            const [theta, setTheta] = useState(0.08);
            const [thetaDot, setThetaDot] = useState(0.0);
            const [x, setX] = useState(0.0);
            const [xDot, setXDot] = useState(0.0);

            useEffect(() => {
                if (!running) return;
                const interval = setInterval(() => {
                    const g = 9.8;
                    const massCart = 1.0;
                    const massPole = 0.1;
                    const length = 0.5;

                    const u = -15 * theta - 4 * thetaDot - 2 * x - 2 * xDot;

                    const thetaAcc = (g * Math.sin(theta) + Math.cos(theta) * ((-u - massPole * length * thetaDot * thetaDot * Math.sin(theta)) / (massCart + massPole))) /
                                     (length * (4.0/3.0 - (massPole * Math.cos(theta) * Math.cos(theta)) / (massCart + massPole)));
                    const xAcc = (u + massPole * length * (thetaDot * thetaDot * Math.sin(theta) - thetaAcc * Math.cos(theta))) / (massCart + massPole);

                    setThetaDot(td => td + thetaAcc * 0.02);
                    setTheta(t => t + thetaDot * 0.02);
                    setXDot(xd => xd + xAcc * 0.02);
                    setX(currX => Math.max(-2, Math.min(2, currX + xDot * 0.02)));
                }, 20);

                return () => clearInterval(interval);
            }, [running, theta, thetaDot, x, xDot]);

            useEffect(() => {
                const cvs = canvasRef.current;
                if (!cvs) return;
                const ctx = cvs.getContext('2d');
                const w = cvs.width;
                const h = cvs.height;
                const isDark = document.documentElement.classList.contains('dark');

                ctx.clearRect(0, 0, w, h);

                // Track rail
                ctx.strokeStyle = isDark ? '#334155' : '#cbd5e1';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(20, h - 30);
                ctx.lineTo(w - 20, h - 30);
                ctx.stroke();

                // Cart position
                const cartX = (w / 2) + (x * 70);
                const cartY = h - 35;

                // Draw cart
                ctx.fillStyle = isDark ? '#e2e8f0' : '#0f172a';
                ctx.fillRect(cartX - 25, cartY - 12, 50, 20);

                // Draw pole
                const poleLen = 80;
                const poleEndX = cartX + poleLen * Math.sin(theta);
                const poleEndY = cartY - poleLen * Math.cos(theta);

                ctx.strokeStyle = '#16a34a';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(cartX, cartY);
                ctx.lineTo(poleEndX, poleEndY);
                ctx.stroke();

                // Pole tip bob
                ctx.fillStyle = '#d97706';
                ctx.beginPath();
                ctx.arc(poleEndX, poleEndY, 5, 0, Math.PI * 2);
                ctx.fill();
            }, [x, theta]);

            const perturb = (force) => {
                setThetaDot(td => td + force);
            };

            const resetPendulum = () => {
                setTheta(0.12);
                setThetaDot(0);
                setX(0);
                setXDot(0);
            };

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                        <div>
                            <h4 className="font-mono text-sm font-bold text-slate-800 dark:text-slate-200 uppercase">
                                Real-Time CartPole Continuous Control Simulation
                            </h4>
                            <p className="text-xs text-slate-500 dark:text-slate-400 font-serif">
                                Closed-loop state feedback stabilizing an underactuated non-linear inverted pendulum
                            </p>
                        </div>
                        <div className="flex gap-2">
                            <button
                                onClick={() => perturb(-0.8)}
                                className="px-2.5 py-1 text-xs font-mono border border-slate-300 dark:border-slate-700 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300"
                            >
                                ← Nudge Left
                            </button>
                            <button
                                onClick={() => perturb(0.8)}
                                className="px-2.5 py-1 text-xs font-mono border border-slate-300 dark:border-slate-700 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300"
                            >
                                Nudge Right →
                            </button>
                            <button
                                onClick={resetPendulum}
                                className="px-2.5 py-1 text-xs font-mono bg-optGreen text-white font-bold rounded"
                            >
                                Reset
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="space-y-2 font-mono text-xs bg-slate-50 dark:bg-slate-800/50 p-3 rounded-lg border border-slate-200 dark:border-slate-800">
                            <div className="text-slate-600 dark:text-slate-400 flex items-center gap-1.5">
                                <span>State Vector:</span>
                                <MathView math="\mathbf{s} = [x, \dot{x}, \theta, \dot{\theta}]^T" />
                            </div>
                            <div className="text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                                <span>Pole Angle (</span><MathView math="\theta" /><span>):</span>
                                <strong className="text-optGreen font-bold">{(theta * 180 / Math.PI).toFixed(1)}°</strong>
                            </div>
                            <div className="text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                                <span>Angular Vel (</span><MathView math="\dot{\theta}" /><span>):</span>
                                <strong className="text-slate-900 dark:text-slate-100">{thetaDot.toFixed(2)} rad/s</strong>
                            </div>
                            <div className="text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                                <span>Cart Position (</span><MathView math="x" /><span>):</span>
                                <strong className="text-slate-900 dark:text-slate-100">{x.toFixed(2)} m</strong>
                            </div>
                            <div className="text-[11px] text-slate-500 dark:text-slate-400 pt-2 font-sans flex items-center gap-1 flex-wrap">
                                <span>An active stabilizing actor-critic policy continuously adjusts cart velocity to maintain vertical pole equilibrium (</span>
                                <MathView math="\theta = 0" />
                                <span>).</span>
                            </div>
                        </div>

                        <div className="md:col-span-2 flex justify-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2">
                            <canvas
                                ref={canvasRef}
                                width={420}
                                height={160}
                                className="w-full max-w-md h-auto"
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const ConceptArticulation = ({ activeId }) => {
            const node = NODE_MAP.get(activeId);
            const [activeLabId, setActiveLabId] = useState(node ? node.labId || 'gridworld' : 'gridworld');

            useEffect(() => {
                if (node && node.labId) {
                    setActiveLabId(node.labId);
                }
            }, [node]);

            if (!node) return null;

            return (
                <section className="w-full px-5 py-5 sm:px-7 lg:px-8 lg:py-7 transition-colors">
                    <div className="mt-1">
                        <h2 className="text-xl sm:text-2xl font-serif font-bold text-slate-900 dark:text-slate-50">
                            {node.title}
                        </h2>

                        <p className="mt-3 font-serif text-slate-700 dark:text-slate-300 text-base sm:text-lg leading-relaxed">
                            {node.abstract}
                        </p>
                    </div>

                    {node.math && (
                        <div className="mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800">
                            <div className="text-[10px] font-mono uppercase tracking-wider text-slate-500 dark:text-slate-400 font-bold mb-1">
                                First-Principles Mathematical Invariant
                            </div>
                            <div className="font-mono text-sm sm:text-base font-semibold text-optGreen overflow-x-auto py-1">
                                <MathView math={node.math} display={true} />
                            </div>
                        </div>
                    )}

                    <div className="mt-8 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-sm bg-white dark:bg-slate-900">
                        <div className="p-6">
                            {activeLabId === 'gridworld' && <LabGridWorld />}
                            {activeLabId === 'cliff' && <LabCliffWalking />}
                            {activeLabId === 'bandits' && <LabBandits />}
                            {activeLabId === 'contraction' && <LabBellmanContraction />}
                            {activeLabId === 'ppo' && <LabPPOClip />}
                            {activeLabId === 'gae' && <LabGAETrace />}
                            {activeLabId === 'temperature' && <LabSoftmaxEntropy />}
                            {activeLabId === 'cartpole' && <LabCartPole />}
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [activeId, setActiveId] = useState('root');
            const [theme, setTheme] = useState(() => {
                return document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            });

            const toggleTheme = () => {
                const next = theme === 'dark' ? 'light' : 'dark';
                setTheme(next);
                localStorage.setItem('opt-theme', next);
                if (next === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            const FAST_ZOOMS = [
                { label: 'Why does Bellman iterate to a unique optimum?', targetId: 'bellman-contraction' },
                { label: 'How does Q-learning differ from SARSA on hazards?', targetId: 'q-learning-dqn' },
                { label: 'How does PPO clip ratios prevent policy collapse?', targetId: 'trust-region-ppo' },
                { label: 'Why does the score function cancel unknown dynamics ∇P?', targetId: 'score-function' },
                { label: 'What is the role of entropy regularization in policies?', targetId: 'entropy-bonus' },
                { label: 'How does UCB1 balance bandit exploration?', targetId: 'multi-armed-bandits' },
                { label: 'How does continuous control stabilize pendulums?', targetId: 'continuous-control' }
            ];

            return (
                <div className="h-screen max-h-screen w-screen flex flex-col overflow-hidden bg-optCanvas schematic-grid transition-colors">
                    {/* Clean Header: Focused on Topic and Actions without generic banners */}
                    <header className="h-12 border-b border-optBorder bg-optSurface/95 dark:bg-slate-900/90 backdrop-blur px-4 sm:px-6 flex items-center justify-between shrink-0 sticky top-0 z-40 transition-colors">
                        <div className="flex items-center gap-2.5">
                            <span className="h-2.5 w-2.5 rounded-full bg-optGreen" />
                            <span className="font-mono text-xs font-bold tracking-tight text-slate-900 dark:text-slate-100 uppercase">
                                Reinforcement Learning
                            </span>
                            <span className="text-slate-300 dark:text-slate-700 hidden sm:inline">•</span>
                            <span className="text-xs font-mono text-slate-500 dark:text-slate-400 font-medium truncate hidden sm:inline">
                                Markov Decision Processes & Policy Optimization
                            </span>
                        </div>

                        <div className="flex items-center gap-2">
                            <button
                                onClick={toggleTheme}
                                title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}
                                className="p-1.5 rounded-md border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-optGreen dark:hover:border-optGreen transition-colors"
                            >
                                {theme === 'dark' ? <Lucide.Sun size={14} /> : <Lucide.Moon size={14} />}
                            </button>

                            <button
                                onClick={() => setActiveId('root')}
                                className="px-2.5 py-1 text-xs font-mono text-slate-600 dark:text-slate-300 hover:text-optGreen border border-slate-200 dark:border-slate-700 rounded hover:border-optGreen transition-colors"
                            >
                                Reset Root
                            </button>
                        </div>
                    </header>

                    {/* Fast Zoom-Hop Query Bar */}
                    <div className="bg-optSurface dark:bg-slate-900/60 border-b border-optBorder px-4 sm:px-6 py-2 flex items-center gap-2 overflow-x-auto text-xs font-mono">
                        <span className="text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider text-[10px] shrink-0">
                            Fast Zoom Hops:
                        </span>
                        <div className="flex gap-2 shrink-0">
                            {FAST_ZOOMS.map((q, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => setActiveId(q.targetId)}
                                    className="bg-optCanvas hover:bg-optGreen dark:hover:bg-optGreen hover:text-white dark:hover:text-white text-slate-700 dark:text-slate-300 border border-optBorder px-2.5 py-1 rounded text-[11px] transition-colors whitespace-nowrap shadow-sm"
                                >
                                    {q.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Hierarchical Canvas */}
                    <main className="flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-[minmax(0,1.3fr)_minmax(0,0.7fr)] overflow-y-auto xl:overflow-hidden">
                        <section className="min-w-0 bg-optCanvas border-b xl:border-b-0 xl:border-r border-optBorder xl:min-h-0 xl:flex xl:flex-col xl:overflow-hidden">
                            <div className="px-5 pt-5 pb-2 sm:px-7">
                                <p className="text-sm font-medium text-slate-700 dark:text-slate-200">Select a node to sync its explanation and lab.</p>
                            </div>
                            <ConceptMapExplorer
                                activeId={activeId}
                                onSelect={(id) => setActiveId(id)}
                            />
                        </section>

                        <div className="min-w-0 bg-optSurface dark:bg-[#211f1d] xl:min-h-0 xl:overflow-y-auto">
                            <ConceptArticulation activeId={activeId} />
                        </div>
                    </main>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
