<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Interactive first-principles lesson.">
    <title>Interactive Lesson</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    
    <script>
        (function () {
            const savedTheme = localStorage.getItem('anthropic-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ant: {
                            bg: 'var(--ant-bg)',
                            surface: 'var(--ant-surface)',
                            surfaceHover: 'var(--ant-surface-hover)',
                            text: 'var(--ant-text)',
                            textMuted: 'var(--ant-text-muted)',
                            accent: 'var(--ant-accent)',
                            accentHover: 'var(--ant-accent-hover)',
                            border: 'var(--ant-border)',
                            chartPrimary: 'var(--ant-chart-primary)',
                            chartSecondary: 'var(--ant-chart-secondary)',
                            chartTertiary: 'var(--ant-chart-tertiary)',
                            danger: 'var(--ant-danger)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        serif: ['Newsreader', 'Charter', 'Bitstream Charter', 'sitka text', 'Cambria', 'serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    },
                    boxShadow: {
                        'ant-sm': '0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.03)',
                        'ant-md': '0 4px 6px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.02)',
                    }
                }
            }
        };
    </script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react,react-dom",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "zustand": "https://esm.sh/zustand@4.5.0?external=react",
            "zod": "https://esm.sh/zod@3.22.4",
            "clsx": "https://esm.sh/clsx@2.1.0",
            "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1",
            "lodash": "https://esm.sh/lodash@4.17.21"
        }
    }
    </script>
    
    <style>
        :root {
            --ant-bg: #FAF9F6;
            --ant-surface: #FFFFFF;
            --ant-surface-hover: #F2F0EA;
            --ant-text: #2C2C2A;
            --ant-text-muted: #767570;
            --ant-accent: #D97757;
            --ant-accent-hover: #C2674A;
            --ant-border: #E5E3DB;
            --ant-chart-primary: #D97757;
            --ant-chart-secondary: #7C9682;
            --ant-chart-tertiary: #D4B16A;
            --ant-danger: #C94A4A;
        }

        .dark {
            --ant-bg: #1A1918;
            --ant-surface: #242322;
            --ant-surface-hover: #2D2C2B;
            --ant-text: #EBEBE9;
            --ant-text-muted: #9E9D99;
            --ant-accent: #E58B6E;
            --ant-accent-hover: #D97757;
            --ant-border: #3D3C3A;
            --ant-chart-primary: #E58B6E;
            --ant-chart-secondary: #8FA895;
            --ant-chart-tertiary: #D4B16A;
            --ant-danger: #D95353;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--ant-bg);
            color: var(--ant-text);
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        * { box-sizing: border-box; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background-clip: padding-box;
            border: 2px solid transparent;
            background-color: var(--ant-border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background-color: var(--ant-text-muted); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=range].ant-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
            margin: 8px 0;
        }
        input[type=range].ant-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: var(--ant-border);
            border-radius: 1px;
            transition: background 0.2s;
        }
        input[type=range].ant-slider::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 2px;
            background: var(--ant-accent);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            transition: transform 0.1s ease;
            box-shadow: none;
        }
        input[type=range].ant-slider:active::-webkit-slider-thumb { transform: scale(1.2); }
        input[type=range].ant-slider::-moz-range-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: var(--ant-border);
            border-radius: 1px;
        }
        input[type=range].ant-slider::-moz-range-thumb {
            height: 14px;
            width: 14px;
            border-radius: 2px;
            background: var(--ant-accent);
            cursor: pointer;
            border: none;
        }

        .ant-prose { font-family: 'Newsreader', 'Charter', serif; }
        .ant-prose p { margin-bottom: 1.5em; line-height: 1.7; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter { animation: fadeIn 0.3s ease-out both; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- AGENT GUIDE: Preserve this two-pane Anthropic academic layout (left Newsreader serif essay, right Inter sans-serif interactive workbench) and all `ant-*` CSS variables and UI primitives (`Panel`, `Stat`, `AnthropicSlider`, `Button`, `InputText`, `TabPill`). Populate `ARTICLE` with rigorous, mechanism-first sections (`p`, `equation`, `callout`), define your topic's tabs in `VIS_TABS` and `SECTION_TO_TAB`, and replace `PlaceholderDashboard` with real, domain-accurate interactive visualizations and Zustand state that respond directly to user controls. -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { create } from 'zustand';
        import { clsx } from 'clsx';
        import { twMerge } from 'tailwind-merge';
        import _ from 'lodash';
        import * as Lucide from 'lucide-react';

        const cn = (...inputs) => twMerge(clsx(inputs));

        const VIS_TABS = Object.freeze({
            TAB_1: 'tab-1',
            TAB_2: 'tab-2'
        });

        const ARTICLE = Object.freeze([
            {
                id: 'sec-1',
                title: '1. Section title placeholder',
                blocks: [
                    { type: 'p', text: 'Replace this placeholder with rigorous, mechanism-first lesson prose.' },
                    { type: 'equation', label: 'Equation label', text: 'f(x) = ...' },
                    { type: 'callout', title: 'Key distinction', text: 'Highlight essential boundaries or conceptual nuances here.' }
                ]
            }
        ]);

        const SECTION_TO_TAB = Object.freeze({
            'sec-1': VIS_TABS.TAB_1
        });

        const TAB_TO_SECTIONS = _.reduce(SECTION_TO_TAB, (acc, tab, sectionId) => {
            if (!acc[tab]) acc[tab] = [];
            acc[tab].push(sectionId);
            return acc;
        }, {});

        const useLessonStore = create((set, get) => ({
            activeTab: VIS_TABS.TAB_1,
            activeSection: ARTICLE[0].id,
            mobileView: 'visuals',
            theme: localStorage.getItem('anthropic-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
            fontSizeMultiplier: 1.0,
            paramValue: 0.5,

            update: (partial) => set(partial),
            toggleTheme: () => {
                const newTheme = get().theme === 'dark' ? 'light' : 'dark';
                set({ theme: newTheme });
                localStorage.setItem('anthropic-theme', newTheme);
                document.documentElement.classList.toggle('dark', newTheme === 'dark');
            },
            increaseFontSize: () => set(state => ({ fontSizeMultiplier: Math.min(1.5, state.fontSizeMultiplier + 0.1) })),
            decreaseFontSize: () => set(state => ({ fontSizeMultiplier: Math.max(0.8, state.fontSizeMultiplier - 0.1) })),
        }));

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return (
                    <div className="p-5 border border-ant-danger/30 bg-ant-danger/5 rounded-md">
                        <h2 className="text-sm font-semibold text-ant-danger mb-2 flex items-center gap-2"><Lucide.AlertCircle size={16} /> Rendering Error</h2>
                        <p className="font-mono text-[11px] text-ant-danger/80">{this.state.error?.message || 'Unknown error'}</p>
                    </div>
                );
                return this.props.children;
            }
        }

        const AnthropicSlider = React.memo(({ label, symbol, min, max, step, value, onChange, formatter }) => {
            const handleInput = useCallback((e) => onChange(parseFloat(e.target.value)), [onChange]);
            const shown = formatter ? formatter(value) : value.toFixed(step < 1 ? (step < 0.01 ? 3 : 2) : 0);
            
            return (
                <div className="space-y-1.5 w-full animate-enter">
                    <div className="flex justify-between items-baseline text-[12px] font-medium text-ant-text">
                        <span>{label} {symbol && <span className="text-ant-textMuted font-mono ml-1 italic">{symbol}</span>}</span>
                        <span className="font-mono">{shown}</span>
                    </div>
                    <div className="relative w-full h-4 flex items-center">
                        <input type="range" min={min} max={max} step={step} value={value} onChange={handleInput} className="ant-slider relative z-10 w-full" />
                    </div>
                </div>
            );
        });

        const Panel = ({ children, className = '' }) => (
            <div className={cn('bg-ant-surface rounded-md border border-ant-border p-5 shadow-ant-sm animate-enter', className)}>{children}</div>
        );

        const Stat = ({ label, value, detail, tone = 'normal' }) => (
            <div className="p-3 bg-ant-bg border border-ant-border rounded-md min-w-0 flex flex-col justify-center">
                <div className="text-[10px] uppercase tracking-wider font-semibold text-ant-textMuted mb-1">{label}</div>
                <div className={cn('text-sm font-mono font-medium truncate', tone === 'accent' ? 'text-ant-accent' : 'text-ant-text')}>{value}</div>
                {detail && <div className="text-[10px] text-ant-textMuted mt-1 truncate">{detail}</div>}
            </div>
        );

        const Button = ({ onClick, children, variant = 'primary', disabled = false, className = '', icon }) => {
            const baseStyle = "px-3 py-1.5 rounded-md text-[13px] font-medium transition-colors flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-ant-accent text-white hover:bg-ant-accentHover",
                secondary: "bg-ant-bg border border-ant-border text-ant-text hover:bg-ant-surfaceHover",
                ghost: "text-ant-textMuted hover:text-ant-text hover:bg-ant-surfaceHover"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={cn(baseStyle, variants[variant], disabled && "opacity-50 cursor-not-allowed", className)}>
                    {icon && <span className="opacity-80 scale-90">{icon}</span>}
                    {children}
                </button>
            );
        };

        const InputText = ({ value, onChange, placeholder, error }) => (
            <div className="w-full">
                <input 
                    type="text" 
                    value={value} 
                    onChange={onChange}
                    placeholder={placeholder}
                    className={cn(
                        "w-full bg-ant-bg border border-ant-border rounded-md px-3 py-1.5 text-[13px] text-ant-text font-mono transition-colors focus:outline-none focus:border-ant-accent focus:ring-1 focus:ring-ant-accent",
                        error && "border-ant-danger focus:border-ant-danger focus:ring-ant-danger"
                    )}
                />
            </div>
        );

        const PlaceholderDashboard = () => {
            const store = useLessonStore();
            return (
                <div className="space-y-6">
                    <Panel className="space-y-4">
                        <AnthropicSlider
                            label="Parameter Control"
                            symbol="θ"
                            min={0}
                            max={1}
                            step={0.01}
                            value={store.paramValue}
                            onChange={(v) => store.update({ paramValue: v })}
                        />
                    </Panel>
                    <Panel>
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-sm font-semibold text-ant-text">Interactive Visualization</h3>
                            <span className="text-[10px] uppercase tracking-wider font-semibold text-ant-textMuted">Unit Metric</span>
                        </div>
                        <div className="h-[220px] flex items-center justify-center border border-dashed border-ant-border rounded-md text-xs font-mono text-ant-textMuted">
                            [ Visual / Chart / Simulation Mount ]
                        </div>
                        <div className="grid grid-cols-3 gap-3 mt-6 pt-4 border-t border-ant-border">
                            <Stat label="Metric A" value={store.paramValue.toFixed(2)} tone="accent" />
                            <Stat label="Metric B" value="0.00" />
                            <Stat label="Metric C" value="0.00" />
                        </div>
                    </Panel>
                </div>
            );
        };

        const ArticleBlock = ({ block }) => {
            if (block.type === 'equation') return (
                <div className="my-8 py-5 px-6 bg-ant-bg border-y border-ant-border text-center font-mono">
                    <div className="text-[11px] font-sans font-medium text-ant-textMuted mb-3 uppercase tracking-wider">{block.label}</div>
                    <div className="text-[15px] text-ant-text overflow-x-auto whitespace-nowrap">{block.text}</div>
                </div>
            );
            if (block.type === 'callout') return (
                <div className="my-8 pl-5 border-l-2 border-ant-accent py-1">
                    <div className="text-[14px] font-sans font-semibold text-ant-text mb-2">{block.title}</div>
                    <p className="text-[17px] font-serif leading-relaxed text-ant-textMuted m-0">{block.text}</p>
                </div>
            );
            return <p className="text-[18px] md:text-[20px] font-serif text-ant-text ant-prose">{block.text}</p>;
        };

        const TabPill = ({ options, value, onChange }) => (
            <div className="inline-flex flex-wrap gap-2">
                {options.map((opt) => (
                    <button
                        key={opt.id}
                        onClick={() => onChange(opt.id)}
                        className={cn(
                            "px-3 py-1.5 rounded-full text-[12px] font-medium transition-colors border",
                            value === opt.id ? "bg-ant-surface border-ant-border text-ant-text shadow-sm" : "bg-transparent border-transparent text-ant-textMuted hover:text-ant-text hover:bg-ant-surfaceHover"
                        )}
                    >
                        {opt.label}
                    </button>
                ))}
            </div>
        );

        const ArticleReader = () => {
            const store = useLessonStore();
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) setTimeout(() => store.update({ activeSection: entry.target.id }), 50);
                    });
                }, { root: null, rootMargin: '-15% 0px -75% 0px', threshold: 0 });
                ARTICLE.forEach(sec => { const el = document.getElementById(sec.id); if (el) observer.observe(el); });
                return () => observer.disconnect();
            }, []);

            return (
                <div className="flex h-full w-full bg-ant-bg">
                    <div className="flex-1 overflow-y-auto scroll-smooth relative no-scrollbar">
                        <div className="px-6 py-16 md:px-16 lg:px-24 max-w-[850px] mx-auto transition-all" style={{ fontSize: `${store.fontSizeMultiplier}rem` }}>
                            <header className="mb-20 pb-12 border-b border-ant-border">
                                <div className="text-[12px] font-sans font-medium text-ant-textMuted uppercase tracking-widest mb-6">Essay</div>
                                <h1 className="text-[2.5em] md:text-[3.2em] font-serif text-ant-text mb-6 leading-tight">Lesson Title Placeholder</h1>
                                <p className="text-[1.2em] font-serif leading-relaxed text-ant-textMuted max-w-[90%]">
                                    Subtitle placeholder summarizing the core problem, mechanism, and takeaways.
                                </p>
                            </header>

                            <div className="space-y-[5em]">
                                {ARTICLE.map(sec => (
                                    <section key={sec.id} id={sec.id} className="scroll-mt-24 group relative">
                                        <h2 className="text-[1.4em] font-serif font-semibold text-ant-text mb-6 leading-tight flex items-center justify-between">
                                            <span>{sec.title}</span>
                                            <button 
                                                onClick={() => store.update({ activeTab: SECTION_TO_TAB[sec.id], mobileView: 'visuals' })} 
                                                className="opacity-0 group-hover:opacity-100 p-1.5 rounded bg-ant-surface border border-ant-border text-ant-textMuted hover:text-ant-accent transition-all lg:hidden" 
                                                title="Open visualization"
                                            >
                                                <Lucide.ArrowRight size={16} />
                                            </button>
                                        </h2>
                                        <div>{sec.blocks.map((block, index) => <ArticleBlock key={index} block={block} />)}</div>
                                    </section>
                                ))}
                            </div>
                            
                            <footer className="mt-[6em] border-t border-ant-border pt-[4em] pb-[8em] flex justify-center">
                                <div className="w-2 h-2 bg-ant-border rotate-45"></div>
                            </footer>
                        </div>
                    </div>
                </div>
            );
        };

        const RelatedReading = ({ sectionIds }) => (
            <div className="mt-10 pt-6 border-t border-ant-border animate-enter">
                <h4 className="text-[11px] font-sans font-medium uppercase tracking-wider text-ant-textMuted mb-3">Context</h4>
                <div className="flex flex-col gap-2">
                    {(sectionIds || []).map(id => {
                        const sec = ARTICLE.find(s => s.id === id);
                        if (!sec) return null;
                        return (
                            <button key={id} onClick={() => { document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); useLessonStore.setState({ activeSection: id, mobileView: 'article' }); }} className="py-2 text-left text-[13px] font-sans text-ant-text hover:text-ant-accent transition-colors flex items-baseline gap-3">
                                <span className="w-1.5 h-1.5 bg-ant-border rounded-full shrink-0"></span>
                                {sec.title}
                            </button>
                        );
                    })}
                </div>
            </div>
        );

        const MainApp = () => {
            const store = useLessonStore();
            const tabs = [
                { id: VIS_TABS.TAB_1, label: 'Primary View' },
                { id: VIS_TABS.TAB_2, label: 'Secondary View' }
            ];

            return (
                <ErrorBoundary>
                    <div className="flex h-screen w-screen bg-ant-bg text-ant-text overflow-hidden selection:bg-ant-accent/20 selection:text-ant-text">
                        
                        {/* Left Pane: Article */}
                        <div className={cn('h-full lg:w-[55%] xl:w-[60%] border-r border-ant-border relative z-10 transition-transform duration-0', store.mobileView === 'article' ? 'block w-full' : 'hidden lg:block')}>
                            <div className="absolute top-4 left-6 z-30 flex items-center gap-4">
                                <button onClick={store.toggleTheme} className="text-ant-textMuted hover:text-ant-text transition-colors" title="Toggle Theme">
                                    {store.theme === 'dark' ? <Lucide.Sun size={18} /> : <Lucide.Moon size={18} />}
                                </button>
                                <div className="flex items-center gap-2 text-ant-textMuted">
                                    <button onClick={store.decreaseFontSize} className="hover:text-ant-text text-[12px] font-serif">A</button>
                                    <button onClick={store.increaseFontSize} className="hover:text-ant-text text-[16px] font-serif">A</button>
                                </div>
                            </div>
                            <ArticleReader />
                        </div>
                        
                        {/* Right Pane: Visuals */}
                        <div className={cn('h-full lg:w-[45%] xl:w-[40%] bg-ant-bg relative z-0 overflow-y-auto no-scrollbar transition-transform duration-0 font-sans', store.mobileView === 'visuals' ? 'block w-full' : 'hidden lg:block')}>
                            <div className="sticky top-0 z-30 pt-6 pb-4 px-6 bg-ant-bg/95 backdrop-blur-sm border-b border-ant-border">
                                <TabPill options={tabs} value={store.activeTab} onChange={(id) => store.update({ activeTab: id })} />
                            </div>
                            
                            <div className="p-6 pb-32 max-w-[600px]">
                                <div className="transition-all duration-300">
                                    <PlaceholderDashboard />
                                </div>
                                <RelatedReading sectionIds={TAB_TO_SECTIONS[store.activeTab] || []} />
                            </div>
                        </div>

                        {/* Mobile Navigation */}
                        <div className="lg:hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-ant-surface border border-ant-border shadow-ant-md rounded-full px-1.5 py-1.5 z-50 flex gap-1">
                            <button onClick={() => store.update({ mobileView: 'article' })} className={cn('px-4 py-2 rounded-full text-[13px] font-medium transition-colors', store.mobileView === 'article' ? 'bg-ant-bg text-ant-text shadow-sm' : 'text-ant-textMuted hover:text-ant-text')}>
                                Essay
                            </button>
                            <button onClick={() => store.update({ mobileView: 'visuals' })} className={cn('px-4 py-2 rounded-full text-[13px] font-medium transition-colors', store.mobileView === 'visuals' ? 'bg-ant-bg text-ant-text shadow-sm' : 'text-ant-textMuted hover:text-ant-text')}>
                                Interactive
                            </button>
                        </div>

                    </div>
                </ErrorBoundary>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<MainApp />);
    </script>
</body>
</html>
