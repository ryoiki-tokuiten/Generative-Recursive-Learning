<html lang="en" class="dark">

<head>

    <script>
        (function () {
            const savedTheme = localStorage.getItem('workbench-theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: 'var(--color-obsidian)',
                        obsidian80: 'var(--color-obsidian-80)',
                        surface: 'var(--color-surface)',
                        surface30: 'var(--color-surface-30)',
                        surface50: 'var(--color-surface-50)',
                        surface80: 'var(--color-surface-80)',
                        surface90: 'var(--color-surface-90)',
                        panel: 'var(--color-panel)',
                        border: 'var(--color-border)',
                        border30: 'var(--color-border-30)',
                        border50: 'var(--color-border-50)',
                        accent: 'var(--color-accent)',
                        accent5: 'var(--color-accent-5)',
                        accent10: 'var(--color-accent-10)',
                        accent20: 'var(--color-accent-20)',
                        accent30: 'var(--color-accent-30)',
                        accent50: 'var(--color-accent-50)',
                        danger: 'var(--color-danger)',
                        danger10: 'var(--color-danger-10)',
                        danger20: 'var(--color-danger-20)',
                        danger30: 'var(--color-danger-30)',
                        danger50: 'var(--color-danger-50)',
                        warning: 'var(--color-warning)',
                        textMain: 'var(--color-text-main)',
                        textMuted: 'var(--color-text-muted)',
                        textMuted50: 'var(--color-text-muted-50)',
                        simulationBg: 'var(--color-simulation-bg)',
                        wall: 'var(--color-wall)'
                    },
                    fontFamily: {
                        sans: ['"Google Sans"', 'Inter', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace']
                    }
                }
            }
        }
    </script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react,react-dom",

            "zod": "https://esm.sh/zod@3.22.4",

            "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1",
            "mathjs": "https://esm.sh/mathjs@12.4.0",
            "lodash": "https://esm.sh/lodash@4.17.21"
        }
    }
    </script>
    <style>

            --color-obsidian: #f8fafc;
            --color-obsidian-80: rgba(248, 250, 252, 0.8);
            --color-surface: #ffffff;
            --color-surface-30: rgba(255, 255, 255, 0.3);
            --color-surface-50: rgba(255, 255, 255, 0.5);
            --color-surface-80: rgba(255, 255, 255, 0.8);
            --color-surface-90: rgba(255, 255, 255, 0.9);
            --color-panel: #ffffff;
            --color-border: #e2e8f0;
            --color-border-30: rgba(226, 232, 240, 0.3);
            --color-border-50: rgba(226, 232, 240, 0.5);
            --color-accent: #00b377;
            --color-accent-5: rgba(0, 179, 119, 0.05);
            --color-accent-10: rgba(0, 179, 119, 0.1);
            --color-accent-20: rgba(0, 179, 119, 0.2);
            --color-accent-30: rgba(0, 179, 119, 0.3);
            --color-accent-50: rgba(0, 179, 119, 0.5);
            --color-danger: #ef4444;
            --color-danger-10: rgba(239, 68, 68, 0.1);
            --color-danger-20: rgba(239, 68, 68, 0.2);
            --color-danger-30: rgba(239, 68, 68, 0.3);
            --color-danger-50: rgba(239, 68, 68, 0.5);
            --color-warning: #f59e0b;
            --color-text-main: #0f172a;
            --color-text-muted: #64748b;
            --color-text-muted-50: rgba(100, 116, 139, 0.5);
            --color-simulation-bg: #f8fafc;
            --color-wall: #cbd5e1;
            --pattern-color: rgba(0, 0, 0, 0.03);

        .dark {
            --color-obsidian: #08080a;
            --color-obsidian-80: rgba(8, 8, 10, 0.8);
            --color-surface: #0f0f13;
            --color-surface-30: rgba(15, 15, 19, 0.3);
            --color-surface-50: rgba(15, 15, 19, 0.5);
            --color-surface-80: rgba(15, 15, 19, 0.8);
            --color-surface-90: rgba(15, 15, 19, 0.9);
            --color-panel: #121217;
            --color-border: #22222a;
            --color-border-30: rgba(34, 34, 42, 0.3);
            --color-border-50: rgba(34, 34, 42, 0.5);
            --color-accent: #00e599;
            --color-accent-5: rgba(0, 229, 153, 0.05);
            --color-accent-10: rgba(0, 229, 153, 0.1);
            --color-accent-20: rgba(0, 229, 153, 0.2);
            --color-accent-30: rgba(0, 229, 153, 0.3);
            --color-accent-50: rgba(0, 229, 153, 0.5);
            --color-danger: #ff3366;
            --color-danger-10: rgba(255, 51, 102, 0.1);
            --color-danger-20: rgba(255, 51, 102, 0.2);
            --color-danger-30: rgba(255, 51, 102, 0.3);
            --color-danger-50: rgba(255, 51, 102, 0.5);
            --color-warning: #ffcc00;
            --color-text-main: #e2e8f0;
            --color-text-muted: #a1aab5;
            --color-text-muted-50: rgba(161, 170, 181, 0.5);
            --color-simulation-bg: #08080a;
            --color-wall: #3f3f4e;

            --color-accent-glow: rgba(0, 229, 153, 0.5);
        }

        body {
            font-family: "Google Sans", "Inter", sans-serif;
            background-color: var(--color-obsidian);
            color: var(--color-text-main);
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: subpixel-antialiased;
            -moz-osx-font-smoothing: auto;
            text-rendering: optimizeLegibility;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=range].glass-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 100%;
            background: transparent;
            outline: none;
            margin: 0;
            padding: 0;
        }

        input[type=range].glass-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--color-accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--color-accent-glow), inset 0 0 4px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease;
        }

        input[type=range].glass-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 15px var(--color-accent-glow), inset 0 0 4px rgba(0, 0, 0, 0.2);
        }

        input[type=range].glass-slider::-moz-range-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--color-accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--color-accent-glow), inset 0 0 4px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease;
        }

        .pattern-grid {
            background-image: linear-gradient(var(--pattern-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--pattern-color) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .katex-display {
            margin: 1.25em 0 !important;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.5em 0;
        }

<body>
    <div id="root"></div>

    <!-- AGENT GUIDE: Preserve this Obsidian/Emerald split-pane workbench layout (left `ArticleReader` with its `w-80` index sidebar and bottom theme/font dock; right `pattern-grid` interactive workbench with tab navigation, top high-DPI `<canvas>`/WebGL visualizer, control panels, and `RelatedReading` links). Populate `YAP_CONTENT` with clear, mechanism-first sections, map sections to tabs in `VIS_TABS` and `SECTION_TO_TAB`, and replace `InteractiveCanvasPlaceholder` and `WorkbenchDashboardPlaceholder` with bespoke interactive visualizations and controls tailored to the user's prompt. -->
    <script type="text/babel" data-type="module">
        import React, { useEffect, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { create } from 'zustand';
        import { clsx } from 'clsx';
        import { twMerge } from 'tailwind-merge';
        import _ from 'lodash';
        import * as Lucide from 'lucide-react';

        const cn = (...inputs) => twMerge(clsx(inputs));

        const VIS_TABS = Object.freeze({
            TAB_1: 'tab-1',
            TAB_2: 'tab-2'
        });

        const YAP_CONTENT = Object.freeze([
            {
                id: "sec-1",
                title: "1. Section Title Placeholder",
                text: "Replace this placeholder with clear, mechanism-first lesson prose explaining the core problem, state transitions, and underlying intuition.",
                equation: "f(x) = \\dots"
            }
        ]);

        const SECTION_TO_TAB = Object.freeze({
            "sec-1": VIS_TABS.TAB_1
        });

        const TAB_TO_SECTIONS = _.reduce(SECTION_TO_TAB, (acc, tab, sectionId) => {
            if (!acc[tab]) acc[tab] = [];
            acc[tab].push(sectionId);
            return acc;
        }, {});

        const useWorkbenchStore = create((set, get) => ({
            activeTab: VIS_TABS.TAB_1,
            activeSection: YAP_CONTENT[0].id,
            mobileView: 'simulation',
            theme: localStorage.getItem('workbench-theme') || 'dark',
            fontSizeMultiplier: 1.0,
            paramValue: 0.5,

            toggleTheme: () => {
                const newTheme = get().theme === 'dark' ? 'light' : 'dark';
                set({ theme: newTheme });
                localStorage.setItem('workbench-theme', newTheme);
                document.documentElement.classList.toggle('dark', newTheme === 'dark');
            },
            increaseFontSize: () => set(state => ({ fontSizeMultiplier: Math.min(1.5, state.fontSizeMultiplier + 0.1) })),
            decreaseFontSize: () => set(state => ({ fontSizeMultiplier: Math.max(0.8, state.fontSizeMultiplier - 0.1) })),
            setActiveTab: (tab) => set({ activeTab: tab }),
            setActiveSection: (secId) => set({ activeSection: secId }),
            setMobileView: (view) => set({ mobileView: view }),
            setParamValue: (val) => set({ paramValue: val })
        }));

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 bg-danger10 border border-danger text-danger rounded-xl font-mono text-sm">
                            <h2 className="text-lg font-bold mb-2 flex items-center gap-2"><Lucide.AlertTriangle /> Rendering Error</h2>
                            <p>{this.state.error?.message}</p>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const GlassSlider = React.memo(({ label, symbol, min, max, step, value, onChange, formatDigits = 3 }) => {
            const { theme } = useWorkbenchStore();
            const percentage = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
            const handleInput = useCallback((e) => onChange(parseFloat(e.target.value)), [onChange]);

            const accentColor = theme === 'light' ? '#00b377' : '#00e599';
            const trackColor = theme === 'light' ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)';
            const trackBackground = `linear-gradient(to right, ${accentColor} 0%, ${accentColor} ${percentage}%, ${trackColor} ${percentage}%, ${trackColor} 100%)`;

            return (
                <div className="space-y-3 w-full">
                    <div className="flex justify-between text-xs tracking-wider font-medium text-textMuted font-mono">
                        <span>{label} {symbol && <span className="text-accent">{symbol}</span>}</span>
                        <span className="text-textMain font-bold">{value.toFixed(formatDigits)}</span>
                    </div>
                    <div className="relative w-full h-1.5 rounded-full overflow-visible flex items-center" style={{ background: trackBackground }}>
                        <input
                            type="range" min={min} max={max} step={step} value={value} onChange={handleInput}
                            className="glass-slider absolute inset-0 w-full h-full cursor-pointer z-10 m-0 p-0"
                        />
                    </div>
                </div>
            );
        });

        const KaTeXRenderer = React.memo(({ math, block = false }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(math, containerRef.current, {
                            displayMode: block,
                            throwOnError: false
                        });
                    } catch (e) {
                        containerRef.current.innerText = math;
                    }
                }
            }, [math, block]);

            return <span ref={containerRef} className={cn("text-textMain", block && "block text-center my-3")} />;
        });

        const RelatedReading = ({ sectionIds }) => {
            if (!sectionIds || sectionIds.length === 0) return null;
            return (
                <div className="mt-8 pt-6 border-t border-border/50">
                    <span className="text-[10px] font-mono uppercase tracking-[0.15em] text-textMuted block mb-4">Related Section</span>
                    <div className="flex flex-col gap-2">
                        {sectionIds.map(id => {
                            const sec = YAP_CONTENT.find(s => s.id === id);
                            if (!sec) return null;
                            return (
                                <button key={id}
                                    onClick={() => {
                                        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                        useWorkbenchStore.setState({ activeSection: id, mobileView: 'protocol' });
                                    }}
                                    className="px-4 py-3 rounded-xl text-xs font-medium bg-surface hover:bg-accent10 hover:text-accent border border-border hover:border-accent30 transition-all duration-200 flex items-center gap-3 text-left w-max max-w-full shadow-sm"
                                >
                                    <Lucide.BookOpen size={14} className="opacity-60 shrink-0" />
                                    <span className="truncate">{sec.title}</span>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const InteractiveCanvasPlaceholder = ({ value }) => {
            const canvasRef = useRef(null);
            const { theme } = useWorkbenchStore();

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                ctx.fillStyle = theme === 'light' ? '#ffffff' : '#0f0f13';
                ctx.fillRect(0, 0, rect.width, rect.height);

                ctx.fillStyle = theme === 'light' ? '#00b377' : '#00e599';
                ctx.font = '12px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`[ Interactive Canvas Mount · Parameter = ${value.toFixed(3)} ]`, rect.width / 2, rect.height / 2);
            }, [value, theme]);

            return (
                <div className="relative w-full aspect-video bg-obsidian rounded-xl overflow-hidden border border-border shadow-lg">
                    <canvas ref={canvasRef} className="w-full h-full block" />
                    <div className="absolute top-3 right-3 bg-surface80 backdrop-blur border border-border text-[10px] uppercase font-mono tracking-wider px-2.5 py-1 rounded text-textMuted select-none pointer-events-none">
                        Interactive Simulation
                    </div>
                </div>
            );
        };

        const WorkbenchDashboardPlaceholder = () => {
            const store = useWorkbenchStore();
            return (
                <div className="space-y-6">
                    <div className="bg-panel rounded-xl border border-border p-5 space-y-5 shadow-sm">
                        <div className="flex justify-between items-center border-b border-border/50 pb-3">
                            <h4 className="text-sm font-semibold flex items-center gap-2 text-textMain">
                                <Lucide.Activity size={16} className="text-accent" /> Simulation Controls
                            </h4>
                            <span className="text-[9px] font-mono uppercase bg-accent10 text-accent px-2 py-0.5 rounded border border-accent20 tracking-wider">
                                Live Parameters
                            </span>
                        </div>
                        <GlassSlider
                            label="Primary Parameter"
                            symbol="θ"
                            min={0}
                            max={1}
                            step={0.001}
                            value={store.paramValue}
                            onChange={store.setParamValue}
                        />
                        <div className="grid grid-cols-3 gap-3 text-xs font-mono">
                            <div className="p-3 rounded-lg bg-surface border border-border shadow-sm flex flex-col justify-between">
                                <span className="text-textMuted text-[10px] uppercase mb-1">Metric A</span>
                                <span className="text-accent font-bold text-sm">{store.paramValue.toFixed(3)}</span>
                            </div>
                            <div className="p-3 rounded-lg bg-surface border border-border shadow-sm flex flex-col justify-between">
                                <span className="text-textMuted text-[10px] uppercase mb-1">Metric B</span>
                                <span className="text-warning font-bold text-sm">0.000</span>
                            </div>
                            <div className="p-3 rounded-lg bg-surface border border-border shadow-sm flex flex-col justify-between">
                                <span className="text-textMuted text-[10px] uppercase mb-1">Metric C</span>
                                <span className="text-textMain font-bold text-sm">0.000</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ArticleReader = () => {
            const store = useWorkbenchStore();
            const { activeSection, fontSizeMultiplier } = store;

            useEffect(() => {
                const activeNav = document.getElementById(`nav-${activeSection}`);
                if (activeNav) activeNav.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, [activeSection]);

            useEffect(() => {
                const observerOptions = { root: null, rootMargin: '-20% 0px -60% 0px', threshold: 0 };
                const observerCallback = (entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) store.setActiveSection(entry.target.id);
                    });
                };
                const observer = new IntersectionObserver(observerCallback, observerOptions);
                YAP_CONTENT.forEach((sec) => {
                    const el = document.getElementById(sec.id);
                    if (el) observer.observe(el);
                });
                return () => observer.disconnect();
            }, []);

            return (
                <div className="flex h-full w-full relative">
                    {/* Left Index Nav */}
                    <div className="w-80 flex-shrink-0 border-r border-border bg-obsidian/95 hidden xl:flex flex-col relative z-20">
                        <div className="flex-1 overflow-y-auto no-scrollbar p-8 pb-24">
                            <h2 className="text-[11px] font-bold uppercase tracking-[0.2em] text-textMuted mb-8 flex items-center gap-3">
                                <Lucide.Network size={14} className="text-accent" /> Concept Index
                            </h2>
                            <nav className="space-y-1.5 relative before:absolute before:inset-y-0 before:left-[7px] before:w-px before:bg-border50">
                                {YAP_CONTENT.map((sec) => {
                                    const isActive = activeSection === sec.id;
                                    return (
                                        <a
                                            key={sec.id}
                                            id={`nav-${sec.id}`}
                                            href={`#${sec.id}`}
                                            className={cn(
                                                "relative pl-7 py-2.5 block text-[13px] leading-tight transition-all duration-300 rounded-r-lg",
                                                isActive ? "text-accent font-medium bg-surface50" : "text-textMuted hover:text-textMain hover:bg-surface30"
                                            )}
                                        >
                                            <div className={cn(
                                                "absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full border-4 border-obsidian transition-colors duration-300 z-10",
                                                isActive ? "bg-accent border-accent20 scale-125 shadow-[0_0_10px_var(--color-accent-glow)]" : "bg-border hover:bg-textMuted"
                                            )} />
                                            {sec.title}
                                        </a>
                                    );
                                })}
                            </nav>
                        </div>

                        {/* Theme & Font Controls */}
                        <div className="absolute bottom-0 left-0 w-full h-20 pointer-events-none z-30 flex items-center">
                            <div className="absolute inset-0 bg-surface border-t border-border"></div>
                            <div className="relative w-full px-8 flex items-center justify-between pointer-events-auto">
                                <button
                                    onClick={store.toggleTheme}
                                    className="flex items-center justify-center w-11 h-11 rounded-full border border-border bg-surface shadow-md hover:border-accent hover:text-accent transition-all duration-300 focus:outline-none"
                                    title={store.theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
                                >
                                    {store.theme === 'dark' ? <Lucide.Sun size={20} className="text-accent" /> : <Lucide.Moon size={20} className="text-accent" />}
                                </button>
                                <div className="flex items-center gap-1 bg-surface border border-border rounded-full pl-4 pr-3 h-11 shadow-md">
                                    <span className="text-xs text-textMuted font-medium select-none mr-1">Font</span>
                                    <button onClick={store.decreaseFontSize} className="p-1.5 hover:text-accent transition-colors"><Lucide.Minus size={16} /></button>
                                    <span className="text-xs font-mono w-10 text-center select-none text-textMain font-medium">{store.fontSizeMultiplier.toFixed(1)}x</span>
                                    <button onClick={store.increaseFontSize} className="p-1.5 hover:text-accent transition-colors"><Lucide.Plus size={16} /></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Reading Text Column */}
                    <div className="flex-1 overflow-y-auto scroll-smooth relative no-scrollbar">
                        <div className="px-6 py-12 md:px-12 lg:px-16 lg:py-20 max-w-4xl mx-auto" style={{ fontSize: `${fontSizeMultiplier}rem` }}>
                            <header className="mb-16 border-b border-border50 pb-10">
                                <h1 className="text-[2.25em] md:text-[3.25em] font-bold tracking-tight text-textMain mb-6 leading-[1.1]">
                                    Lesson Title Placeholder
                                </h1>
                                <p className="text-textMuted font-mono text-sm tracking-wide">
                                    Subtitle & Core Domain Overview
                                </p>
                            </header>

                            <div className="space-y-[4em]">
                                {YAP_CONTENT.map((sec) => (
                                    <section key={sec.id} id={sec.id} className="scroll-mt-24 group">
                                        <h2 className="text-[1.25em] md:text-[1.5em] font-bold text-textMain mb-4 tracking-tight flex items-center justify-between">
                                            <span>{sec.title}</span>
                                            <button
                                                onClick={() => {
                                                    store.setActiveTab(SECTION_TO_TAB[sec.id]);
                                                    store.setMobileView('simulation');
                                                }}
                                                className="ml-3 p-2 rounded-lg bg-accent/10 hover:bg-accent/20 text-accent transition-all duration-300 focus:outline-none"
                                                title="Jump directly to visualizer"
                                            >
                                                <Lucide.MousePointerClick size={18} />
                                            </button>
                                        </h2>
                                        <p className="text-[1em] leading-[1.8] text-textMain font-normal text-justify mb-4">
                                            {sec.text}
                                        </p>
                                        {sec.equation && (
                                            <div className="p-4 rounded-xl bg-surface border border-border overflow-x-auto shadow-inner">
                                                <KaTeXRenderer math={sec.equation} block={true} />
                                            </div>
                                        )}
                                    </section>
                                ))}
                            </div>

                            <footer className="mt-[6em] border-t border-border pt-[3em] pb-[6em] text-center">
                                <div className="inline-flex items-center justify-center p-4 rounded-full bg-surface border border-border mb-6">
                                    <Lucide.Radio size={20} className="text-accent" />
                                </div>
                                <p className="text-xs font-mono text-textMuted">End of Lesson</p>
                            </footer>
                        </div>
                    </div>
                </div>
            );
        };

        const MainApp = () => {
            const store = useWorkbenchStore();

            return (
                <ErrorBoundary>
                    <div className="flex h-screen w-screen bg-obsidian text-textMain overflow-hidden font-sans selection:bg-accent30 selection:text-textMain relative">

                        {/* Left Pane: Structured Article */}
                        <div className={cn(
                            "h-full lg:w-[50%] xl:w-[55%] border-r border-border relative z-20 bg-obsidian drop-shadow-2xl transition-all duration-300",
                            store.mobileView === 'protocol' ? 'block w-full' : 'hidden lg:block'
                        )}>
                            <ArticleReader />
                        </div>

                        {/* Right Pane: Interactive Visual Workbench */}
                        <div className={cn(
                            "h-full lg:w-[50%] xl:w-[45%] flex flex-col bg-simulationBg relative pattern-grid overflow-y-auto no-scrollbar transition-all duration-300",
                            store.mobileView === 'simulation' ? 'block w-full' : 'hidden lg:block'
                        )}>
                            <div className="flex-1 flex flex-col p-5 sm:p-8 max-w-4xl mx-auto w-full min-h-max pb-32 lg:pb-16">

                                <div className="border-b border-border/50 pb-4 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div className="flex flex-wrap gap-2 text-[11px] sm:text-xs font-mono w-full sm:w-auto">
                                        <button
                                            onClick={() => store.setActiveTab(VIS_TABS.TAB_1)}
                                            className={cn(
                                                "px-2.5 sm:px-3 py-2 rounded-lg transition-all duration-200 flex items-center gap-1.5 border font-medium",
                                                store.activeTab === VIS_TABS.TAB_1 ? "bg-surface text-accent border-accent30 shadow-sm" : "bg-transparent text-textMuted border-transparent hover:text-textMain hover:border-border30"
                                            )}
                                        >
                                            <Lucide.Activity size={14} /><span>1. Primary View</span>
                                        </button>
                                        <button
                                            onClick={() => store.setActiveTab(VIS_TABS.TAB_2)}
                                            className={cn(
                                                "px-2.5 sm:px-3 py-2 rounded-lg transition-all duration-200 flex items-center gap-1.5 border font-medium",
                                                store.activeTab === VIS_TABS.TAB_2 ? "bg-surface text-accent border-accent30 shadow-sm" : "bg-transparent text-textMuted border-transparent hover:text-textMain hover:border-border30"
                                            )}
                                        >
                                            <Lucide.Cpu size={14} /><span>2. Secondary View</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-6 flex-1 flex flex-col">
                                    <InteractiveCanvasPlaceholder value={store.paramValue} />
                                    <div className="transition-all duration-300 flex-1">
                                        <WorkbenchDashboardPlaceholder />
                                    </div>
                                    <RelatedReading sectionIds={TAB_TO_SECTIONS[store.activeTab] || []} />
                                </div>
                            </div>
                        </div>

                        {/* Mobile Floating Mode Toggle */}
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex lg:hidden bg-surface80 backdrop-blur-xl rounded-full p-1 border border-border shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
                            <button
                                onClick={() => store.setMobileView('protocol')}
                                className={cn(
                                    "px-5 py-2.5 rounded-full text-xs font-bold font-mono tracking-wide transition-all duration-300",
                                    store.mobileView === 'protocol' ? "bg-accent text-obsidian shadow-sm" : "text-textMuted hover:text-textMain"
                                )}
                            >
                                PROTOCOL
                            </button>
                            <button
                                onClick={() => store.setMobileView('simulation')}
                                className={cn(
                                    "px-5 py-2.5 rounded-full text-xs font-bold font-mono tracking-wide transition-all duration-300",
                                    store.mobileView === 'simulation' ? "bg-accent text-obsidian shadow-sm" : "text-textMuted hover:text-textMain"
                                )}
                            >
                                WORKBENCH
                            </button>
                        </div>
                    </div>
                </ErrorBoundary>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<MainApp />);
    </script>
</body>

</html>
