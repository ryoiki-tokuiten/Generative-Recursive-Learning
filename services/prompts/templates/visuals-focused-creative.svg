<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">visuals-focused-creative — Pure Geometric &amp; Physical Metric Proof</title>
  <desc id="desc">Hydrodynamic shoaling ocean shader backdrop with a frosted glassmorphic sidebar and Poincaré half-circle model showing exponentially compressed horocycles and logarithmic y-axis steps.</desc>
  <defs>
    <linearGradient id="oceanDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1D29"/>
      <stop offset="52%" stop-color="#0F2A3A"/>
      <stop offset="68%" stop-color="#173D50"/>
      <stop offset="100%" stop-color="#091A24"/>
    </linearGradient>
    <radialGradient id="causticGlow1" cx="62%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#2D6E82" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1A495B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A1D29" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="causticGlow2" cx="82%" cy="74%" r="38%">
      <stop offset="0%" stop-color="#357B8E" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#163B4C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0A1D29" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassSidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E171E" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0B1319" stop-opacity="0.86"/>
    </linearGradient>
    <filter id="waterBlur" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="675">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="axisGlow" filterUnits="userSpaceOnUse" x="760" y="150" width="46" height="320">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= FULL-VIEWPORT SHOALING OCEAN SHADER BACKDROP ================= -->
  <rect width="1200" height="675" fill="url(#oceanDeep)"/>
  <rect width="1200" height="675" fill="url(#causticGlow1)"/>
  <rect width="1200" height="675" fill="url(#causticGlow2)"/>

  <!-- Refracted Underwater Wavy Grid & Caustic Swells -->
  <g stroke="#3E8CA3" stroke-opacity="0.16" stroke-width="1" fill="none">
    <!-- Vertical refracted grid lines -->
    <path d="M 454 0 Q 451 120 455 240 T 453 480 T 456 675"/>
    <path d="M 564 0 Q 567 110 562 230 T 565 460 T 562 675"/>
    <path d="M 673 0 Q 670 135 675 260 T 672 490 T 675 675"/>
    <path d="M 783 0 L 783 675" stroke-opacity="0.26"/>
    <path d="M 893 0 Q 896 125 891 250 T 894 480 T 892 675"/>
    <path d="M 1003 0 Q 1000 130 1005 255 T 1001 485 T 1004 675"/>
    <path d="M 1113 0 Q 1116 115 1111 245 T 1115 475 T 1112 675"/>

    <!-- Horizontal refracted grid lines -->
    <path d="M 0 64 Q 300 60 600 65 T 1200 63"/>
    <path d="M 0 174 Q 320 170 640 176 T 1200 173" stroke-opacity="0.25"/>
    <path d="M 0 284 Q 290 288 590 282 T 1200 285"/>
    <path d="M 0 394 Q 310 390 620 396 T 1200 393"/>
    <path d="M 0 564 Q 300 568 610 562 T 1200 565"/>
  </g>

  <!-- Hydrodynamic Wave Crests, Ripples & Caustic Rings -->
  <g filter="url(#waterBlur)" opacity="0.55">
    <!-- Large horizontal shoaling wave bands -->
    <path d="M 0 95 Q 240 72 490 98 T 960 88 T 1200 96" fill="none" stroke="#489FB8" stroke-width="5" stroke-opacity="0.22"/>
    <path d="M 0 218 Q 280 198 560 222 T 1020 210 T 1200 218" fill="none" stroke="#52B2CC" stroke-width="4" stroke-opacity="0.24"/>
    <path d="M 0 335 Q 260 320 530 338 T 980 328 T 1200 334" fill="none" stroke="#5BC0DB" stroke-width="3.5" stroke-opacity="0.28"/>
    <path d="M 0 432 Q 300 426 600 434 T 1200 431" fill="none" stroke="#6BD2ED" stroke-width="3" stroke-opacity="0.35"/>
    <path d="M 0 448 Q 300 445 600 449 T 1200 447" fill="none" stroke="#7CE0FA" stroke-width="2.2" stroke-opacity="0.4"/>
    <path d="M 0 492 Q 250 482 520 496 T 1010 488 T 1200 494" fill="none" stroke="#4293AB" stroke-width="4.5" stroke-opacity="0.28"/>
    <path d="M 0 595 Q 310 578 620 602 T 1200 590" fill="none" stroke="#398399" stroke-width="5" stroke-opacity="0.22"/>

    <!-- PDE Water Ripple Rings & Droplet Wakes -->
    <g fill="none" stroke="#6AD0EB" stroke-opacity="0.26" stroke-width="1.6">
      <ellipse cx="592" cy="172" rx="44" ry="26"/>
      <ellipse cx="592" cy="172" rx="22" ry="13"/>
      <ellipse cx="783" cy="454" rx="52" ry="24" stroke-opacity="0.38"/>
      <ellipse cx="783" cy="454" rx="30" ry="14" stroke-opacity="0.45"/>
      <ellipse cx="545" cy="596" rx="48" ry="28"/>
      <ellipse cx="545" cy="596" rx="26" ry="15"/>
      <ellipse cx="678" cy="645" rx="36" ry="21"/>
      <ellipse cx="812" cy="512" rx="28" ry="16"/>
      <ellipse cx="1115" cy="410" rx="24" ry="14"/>
      <ellipse cx="496" cy="39" rx="18" ry="9"/>
    </g>
  </g>

  <!-- ================= POINCARÉ HALF-CIRCLE GEOMETRY OVERLAY ================= -->
  <!-- Exponentially Packed Blue Horocycle Lines (Equal Metric Steps ds = dy / y) -->
  <!-- Origin y0 = 454, Top (0,1)=i at y1 = 174 (R = 280px)
       Metric steps y_k = 454 - 280 * exp(-k * 0.25):
       k=1: y = 454 - 218.1 = 235.9
       k=2: y = 454 - 169.8 = 284.2
       k=3: y = 454 - 132.3 = 321.7
       k=4: y = 454 - 103.0 = 351.0
       k=5: y = 454 - 80.2  = 373.8
       k=6: y = 454 - 62.5  = 391.5
       k=7: y = 454 - 48.7  = 405.3
       k=8: y = 454 - 37.9  = 416.1
       k=9: y = 454 - 29.5  = 424.5
       k=10: y = 454 - 23.0 = 431.0
       k=11: y = 454 - 17.9 = 436.1
       k=12: y = 454 - 13.9 = 440.1
       k=13: y = 454 - 10.8 = 443.2
       k=14: y = 454 - 8.4  = 445.6
       k=15: y = 454 - 6.6  = 447.4
       k=16: y = 454 - 5.1  = 448.9
       k=17: y = 454 - 4.0  = 450.0
       k=18: y = 454 - 3.1  = 450.9
       k=19: y = 454 - 2.4  = 451.6
  -->
  <g stroke="#5B9BD5">
    <line x1="334" y1="235.9" x2="1200" y2="235.9" stroke-width="1.5" stroke-opacity="0.62"/>
    <line x1="334" y1="284.2" x2="1200" y2="284.2" stroke-width="1.5" stroke-opacity="0.62"/>
    <line x1="334" y1="321.7" x2="1200" y2="321.7" stroke-width="1.4" stroke-opacity="0.58"/>
    <line x1="334" y1="351.0" x2="1200" y2="351.0" stroke-width="1.4" stroke-opacity="0.55"/>
    <line x1="334" y1="373.8" x2="1200" y2="373.8" stroke-width="1.3" stroke-opacity="0.52"/>
    <line x1="334" y1="391.5" x2="1200" y2="391.5" stroke-width="1.2" stroke-opacity="0.50"/>
    <line x1="334" y1="405.3" x2="1200" y2="405.3" stroke-width="1.2" stroke-opacity="0.48"/>
    <line x1="334" y1="416.1" x2="1200" y2="416.1" stroke-width="1.1" stroke-opacity="0.45"/>
    <line x1="334" y1="424.5" x2="1200" y2="424.5" stroke-width="1.1" stroke-opacity="0.42"/>
    <line x1="334" y1="431.0" x2="1200" y2="431.0" stroke-width="1.0" stroke-opacity="0.40"/>
    <line x1="334" y1="436.1" x2="1200" y2="436.1" stroke-width="1.0" stroke-opacity="0.38"/>
    <line x1="334" y1="440.1" x2="1200" y2="440.1" stroke-width="0.9" stroke-opacity="0.36"/>
    <line x1="334" y1="443.2" x2="1200" y2="443.2" stroke-width="0.9" stroke-opacity="0.34"/>
    <line x1="334" y1="445.6" x2="1200" y2="445.6" stroke-width="0.8" stroke-opacity="0.32"/>
    <line x1="334" y1="447.4" x2="1200" y2="447.4" stroke-width="0.8" stroke-opacity="0.30"/>
    <line x1="334" y1="448.9" x2="1200" y2="448.9" stroke-width="0.7" stroke-opacity="0.28"/>
    <line x1="334" y1="450.2" x2="1200" y2="450.2" stroke-width="0.7" stroke-opacity="0.26"/>
    <line x1="334" y1="451.4" x2="1200" y2="451.4" stroke-width="0.6" stroke-opacity="0.24"/>
  </g>

  <!-- Vertical Imaginary Axis (x = 783) -->
  <line x1="783" y1="96" x2="783" y2="675" stroke="#F5F4EF" stroke-opacity="0.68" stroke-width="1.8"/>

  <!-- White Euclidean Unit Semicircle centered at (783, 454), radius R = 280 (from 503 to 1063) -->
  <path d="M 454 454 A 329 280 0 0 1 1112 454" fill="none" stroke="#F5F4EF" stroke-width="2.2" stroke-opacity="0.88"/>

  <!-- Coral Boundary Line at y = 0 (y = 454) -->
  <line x1="295" y1="454" x2="1200" y2="454" stroke="#D97757" stroke-width="2.4" stroke-opacity="0.92"/>

  <!-- Colored Equal-Metric-Step Vertical Segments along the y-Axis (x = 783) -->
  <g filter="url(#axisGlow)" stroke-linecap="round">
    <!-- Step 1: Green (174 -> 235.9) -->
    <line x1="783" y1="174" x2="783" y2="235.9" stroke="#46A775" stroke-width="4.2"/>
    <!-- Step 2: Orange (235.9 -> 284.2) -->
    <line x1="783" y1="235.9" x2="783" y2="284.2" stroke="#E09132" stroke-width="4.2"/>
    <!-- Step 3: Purple (284.2 -> 321.7) -->
    <line x1="783" y1="284.2" x2="783" y2="321.7" stroke="#9B7EDE" stroke-width="4.2"/>
    <!-- Step 4: Pink (321.7 -> 351.0) -->
    <line x1="783" y1="321.7" x2="783" y2="351.0" stroke="#D46387" stroke-width="4.2"/>
    <!-- Step 5: Teal (351.0 -> 373.8) -->
    <line x1="783" y1="351.0" x2="783" y2="373.8" stroke="#3B9B96" stroke-width="4.0"/>
    <!-- Step 6: Green (373.8 -> 391.5) -->
    <line x1="783" y1="373.8" x2="783" y2="391.5" stroke="#46A775" stroke-width="3.8"/>
  </g>

  <!-- Step Node Dots along y-Axis -->
  <circle cx="783" cy="174" r="3.8" fill="#0E171E" stroke="#D97757" stroke-width="2"/>
  <circle cx="783" cy="235.9" r="3.0" fill="#0E171E" stroke="#46A775" stroke-width="1.6"/>
  <circle cx="783" cy="284.2" r="3.0" fill="#0E171E" stroke="#E09132" stroke-width="1.6"/>
  <circle cx="783" cy="321.7" r="3.0" fill="#0E171E" stroke="#9B7EDE" stroke-width="1.6"/>
  <circle cx="783" cy="351.0" r="2.8" fill="#0E171E" stroke="#D46387" stroke-width="1.5"/>
  <circle cx="783" cy="373.8" r="2.8" fill="#0E171E" stroke="#3B9B96" stroke-width="1.5"/>
  <circle cx="783" cy="391.5" r="2.8" fill="#0E171E" stroke="#46A775" stroke-width="1.5"/>
  <circle cx="783" cy="454" r="3.8" fill="#0E171E" stroke="#F5F4EF" stroke-width="2"/>

  <!-- Canvas Floating Callout Pills -->
  <g font-family="'JetBrains Mono', monospace" font-size="8.2" text-anchor="middle">
    <!-- (0, 1) = i Badge -->
    <rect x="752" y="151" width="62" height="16" rx="4" fill="#0E1820" fill-opacity="0.92" stroke="#D97757" stroke-width="1" stroke-opacity="0.7"/>
    <text x="783" y="162" fill="#D97757">(0, 1) = i</text>

    <!-- Equal Metric Step 1 (Green) -->
    <line x1="783" y1="205" x2="768" y2="205" stroke="#46A775" stroke-width="1" stroke-dasharray="2.5 2.5" stroke-opacity="0.6"/>
    <rect x="627" y="197" width="141" height="16" rx="4" fill="#0E1820" fill-opacity="0.92" stroke="#46A775" stroke-width="1" stroke-opacity="0.68"/>
    <text x="697.5" y="208" fill="#46A775" font-size="7.6">Equal Metric Step ds = dy / y</text>

    <!-- Equal Metric Step 3 (Purple) -->
    <line x1="783" y1="303" x2="768" y2="303" stroke="#9B7EDE" stroke-width="1" stroke-dasharray="2.5 2.5" stroke-opacity="0.6"/>
    <rect x="627" y="295" width="141" height="16" rx="4" fill="#0E1820" fill-opacity="0.92" stroke="#9B7EDE" stroke-width="1" stroke-opacity="0.68"/>
    <text x="697.5" y="306" fill="#9B7EDE" font-size="7.6">Equal Metric Step ds = dy / y</text>

    <!-- Origin (0, 0) Label -->
    <text x="783" y="473" fill="#F5F4EF" font-size="8.5" font-weight="600">(0, 0)</text>
  </g>

  <!-- ================= LEFT FROSTED GLASS SIDEBAR (392px wide) ================= -->
  <rect width="392" height="675" fill="url(#glassSidebar)"/>
  <line x1="392" y1="0" x2="392" y2="675" stroke="#F0EFEA" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Top Header -->
  <rect width="392" height="44" fill="#121A21" fill-opacity="0.72"/>
  <line x1="0" y1="44" x2="392" y2="44" stroke="#F0EFEA" stroke-opacity="0.12"/>
  <text x="14" y="27" fill="#F5F4EF" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic">∫₀<tspan baseline-shift="super" font-size="8.5">θ</tspan> <tspan font-style="normal">sec</tspan> θ dθ = <tspan font-style="normal">ln(tan(</tspan>π/4 + θ/2<tspan font-style="normal">))</tspan></text>

  <!-- Shoaling Ocean Space Filter Pill -->
  <rect x="259" y="10" width="119" height="23" rx="6" fill="#3B9B96" fill-opacity="0.15" stroke="#3B9B96" stroke-opacity="0.55" stroke-width="1"/>
  <path d="M268 20c1.5-1.8 3-1.8 4.5 0s3 1.8 4.5 0m-9 3.5c1.5-1.8 3-1.8 4.5 0s3 1.8 4.5 0" fill="none" stroke="#3B9B96" stroke-width="1.2" stroke-linecap="round"/>
  <text x="325" y="24.5" text-anchor="middle" fill="#3B9B96" font-family="'JetBrains Mono', monospace" font-size="8.2" font-weight="600">Shoaling Ocean</text>

  <!-- Phase Navigation Tabs (6 cols) -->
  <line x1="0" y1="73" x2="392" y2="73" stroke="#F0EFEA" stroke-opacity="0.12"/>
  <g font-family="'JetBrains Mono', monospace" font-size="7.3" text-anchor="middle" fill="#A0ABA5">
    <text x="32" y="61">RHOMBUS</text>
    <text x="98" y="61">CIRCLE 2SIN</text>
    <text x="163" y="61">IMAGINARY</text>
    <rect x="196" y="44" width="66" height="29" fill="#D97757" fill-opacity="0.12"/>
    <line x1="196" y1="72" x2="262" y2="72" stroke="#D97757" stroke-width="2"/>
    <text x="229" y="61" fill="#F5F4EF" font-weight="600">OCEAN METRIC</text>
    <text x="294" y="61">SECANT ARC</text>
    <text x="360" y="61">LOG(TAN)</text>
  </g>

  <!-- Section Heading & Explanatory Copy -->
  <text x="18" y="99" fill="#F5F4EF" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700">Half-Circle Model: Metric ds² = (dx² + dy²) / y²</text>
  <g fill="#E6E4DD" font-family="Inter, system-ui, sans-serif" font-size="10.2" opacity="0.92">
    <text x="18" y="123">Along the vertical y-axis (dx = 0), metric distance is ∫₁ʸ (dy / y)</text>
    <text x="18" y="139">= ln y! As we move exponentially in Euclidean height (y =</text>
    <text x="18" y="155">e^{−0.6}, y = e^{−3.2}, y = e^{−9.8} → y = 0), the metric</text>
    <text x="18" y="171">distance we move is linear. Use the Logarithmic Precision</text>
    <text x="18" y="187">slider or cycle the Space filter at top-right!</text>
  </g>

  <!-- Equation Card -->
  <rect x="18" y="203" width="356" height="68" rx="9" fill="#0A1015" fill-opacity="0.62" stroke="#F0EFEA" stroke-opacity="0.12"/>
  <text x="196" y="230" text-anchor="middle" fill="#F5F4EF" font-family="Georgia, 'Times New Roman', serif" font-size="12"><tspan font-style="italic">y</tspan>-axis is literally  ln <tspan font-style="italic">y</tspan> = ∫₁ʸ <tspan font-style="italic">dy / y</tspan></text>
  <text x="196" y="254" text-anchor="middle" fill="#F5F4EF" font-family="Georgia, 'Times New Roman', serif" font-size="11.5"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">e</tspan>⁻⁰·⁶ → <tspan font-style="italic">e</tspan>⁻³·² → <tspan font-style="italic">e</tspan>⁻⁹·⁸ → <tspan font-style="italic">y</tspan> = 0</text>

  <!-- Interactive Stage Sub-box -->
  <rect x="18" y="285" width="356" height="82" rx="10" fill="#0A1015" fill-opacity="0.58" stroke="#F0EFEA" stroke-opacity="0.12"/>
  <text x="111" y="310" text-anchor="middle" fill="#A0ABA5" font-family="'JetBrains Mono', monospace" font-size="8.2">Boundary at y = 0</text>
  <rect x="199" y="295" width="161" height="23" rx="6" fill="#3B9B96" fill-opacity="0.16" stroke="#3B9B96" stroke-width="1.1"/>
  <text x="279.5" y="310" text-anchor="middle" fill="#F5F4EF" font-family="'JetBrains Mono', monospace" font-size="8.2" font-weight="600">y-Axis is Literally ln y</text>

  <line x1="30" y1="328" x2="362" y2="328" stroke="#F0EFEA" stroke-opacity="0.09"/>

  <!-- Play Button + Teal Progress Slider -->
  <rect x="30" y="337" width="23" height="21" rx="5" fill="#121A21" stroke="#F0EFEA" stroke-opacity="0.14"/>
  <polygon points="39.5,344 39.5,351 45,347.5" fill="#F5F4EF"/>
  <rect x="64" y="345" width="296" height="5" rx="2.5" fill="#0E171E"/>
  <rect x="64" y="345" width="263" height="5" rx="2.5" fill="#3B9B96" fill-opacity="0.88"/>
  <circle cx="327" cy="347.5" r="5.5" fill="#F5F4EF" stroke="#3B9B96" stroke-width="1.5"/>

  <!-- Bottom Controls -->
  <line x1="0" y1="531" x2="392" y2="531" stroke="#F0EFEA" stroke-opacity="0.12"/>
  <rect x="18" y="540" width="356" height="23" rx="6" fill="#0A1015" fill-opacity="0.58" stroke="#F0EFEA" stroke-opacity="0.14"/>
  <text x="196" y="555" text-anchor="middle" fill="#E6E4DD" font-family="'JetBrains Mono', monospace" font-size="8.2">Reset View</text>

  <line x1="0" y1="572" x2="392" y2="572" stroke="#F0EFEA" stroke-opacity="0.12"/>

  <!-- Slider 1: Logarithmic Stretch & Precision -->
  <text x="18" y="590" fill="#A0ABA5" font-family="'JetBrains Mono', monospace" font-size="7.8" letter-spacing="0.4">LOGARITHMIC STRETCH &amp; PRECISION</text>
  <text x="374" y="590" text-anchor="end" fill="#3B9B96" font-family="'JetBrains Mono', monospace" font-size="8.2" font-weight="600">100% stretch</text>
  <rect x="18" y="601" width="356" height="5" rx="2.5" fill="#0A1015"/>
  <rect x="18" y="601" width="126" height="5" rx="2.5" fill="#3B9B96" fill-opacity="0.88"/>
  <circle cx="144" cy="603.5" r="5.5" fill="#F5F4EF" stroke="#3B9B96" stroke-width="1.5"/>

  <!-- Slider 2: Angle Parameter θ -->
  <line x1="18" y1="620" x2="374" y2="620" stroke="#F0EFEA" stroke-opacity="0.09"/>
  <text x="18" y="635" fill="#A0ABA5" font-family="'JetBrains Mono', monospace" font-size="7.8" letter-spacing="0.4">ANGLE PARAMETER θ</text>
  <text x="374" y="635" text-anchor="end" fill="#F5F4EF" font-family="'JetBrains Mono', monospace" font-size="8.2" font-weight="600">0.880 rad (50.4°)</text>
  <rect x="18" y="644" width="23" height="20" rx="5" fill="#0A1015" stroke="#F0EFEA" stroke-opacity="0.14"/>
  <polygon points="27.5,650.5 27.5,657.5 33,654" fill="#F5F4EF"/>
  <rect x="50" y="651.5" width="324" height="5" rx="2.5" fill="#0A1015"/>
  <rect x="50" y="651.5" width="206" height="5" rx="2.5" fill="#D97757" fill-opacity="0.88"/>
  <circle cx="256" cy="654" r="5.5" fill="#F5F4EF" stroke="#D97757" stroke-width="1.5"/>
</svg>
