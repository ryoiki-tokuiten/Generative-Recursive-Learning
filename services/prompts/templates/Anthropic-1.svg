<path d="M790 351 C835 347 850 329 880 332 S925 298 950 303 S990 271 1015 278 S1062 246 1090 251 S1112 237 1125 228 L1125 376 L790 376Z" fill="url(#area)"/><path d="M790 351 C835 347 850 329 880 332 S925 298 950 303 S990 271 1015 278 S1062 246 1090 251 S1112 237 1125 228" fill="none" stroke="#8FA895" stroke-width="3"/><circle cx="950" cy="303" r="4" fill="#E58B6E"/><circle cx="1090" cy="251" r="4" fill="#E58B6E"/>
<text x="782" y="398" fill="#9E9D99" font-family="monospace" font-size="10">0</text><text x="1117" y="398" fill="#9E9D99" font-family="monospace" font-size="10">1</text>
<rect x="744" y="448" width="196" height="92" rx="5" fill="#242322" stroke="#3D3C3A"/><text x="764" y="476" fill="#9E9D99" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">SAMPLE</text>
