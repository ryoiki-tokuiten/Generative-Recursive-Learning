<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Anthropic 1 — essay and interactive dashboard</title><desc id="desc">A warm charcoal two-pane lesson with a large serif essay beside compact information-coding visuals.</desc>
<defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8FA895" stop-opacity=".24"/><stop offset="1" stop-color="#8FA895" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="675" fill="#1A1918"/><rect x="708" width="492" height="675" fill="#1C1B1A"/><path d="M708 0V675" stroke="#3D3C3A"/>
<g fill="#9E9D99"><circle cx="42" cy="34" r="8"/><path d="M38 34h8M42 30v8" stroke="#1A1918" stroke-width="1.5"/><text x="68" y="39" font-family="Arial,sans-serif" font-size="15" letter-spacing="1">A a</text></g>
<text x="86" y="105" fill="#E58B6E" font-family="Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3">ESSAY</text>
<text x="86" y="177" fill="#EBEBE9" font-family="Georgia,serif" font-size="55" letter-spacing="-1.5">Compression is</text><text x="86" y="238" fill="#EBEBE9" font-family="Georgia,serif" font-size="55" letter-spacing="-1.5">Intelligence.</text>
<text x="86" y="285" fill="#B1AFAB" font-family="Georgia,serif" font-size="21">Why compact models predict, where description length becomes</text><text x="86" y="316" fill="#B1AFAB" font-family="Georgia,serif" font-size="21">learning, and why compression is central without being the whole.</text>
<path d="M86 356H658" stroke="#3D3C3A"/><text x="86" y="403" fill="#EBEBE9" font-family="Georgia,serif" font-size="25" font-weight="600">The shape of a good explanation</text>
<rect x="86" y="426" width="522" height="6" rx="3" fill="#3D3C3A"/><rect x="86" y="426" width="458" height="6" rx="3" fill="#6F6D68"/><rect x="86" y="450" width="546" height="6" rx="3" fill="#3D3C3A"/><rect x="86" y="450" width="504" height="6" rx="3" fill="#6F6D68"/><rect x="86" y="474" width="496" height="6" rx="3" fill="#3D3C3A"/><rect x="86" y="474" width="416" height="6" rx="3" fill="#6F6D68"/>
<path d="M86 520v66" stroke="#E58B6E" stroke-width="3"/><text x="105" y="542" fill="#EBEBE9" font-family="Georgia,serif" font-size="18">A useful distinction</text><text x="105" y="568" fill="#9E9D99" font-family="Arial,sans-serif" font-size="14">A compact model captures regularity while leaving room for</text><text x="105" y="588" fill="#9E9D99" font-family="Arial,sans-serif" font-size="14">the evidence that still needs explaining.</text>
<text x="744" y="43" fill="#9E9D99" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.7">INTERACTIVE VISUALS</text>
<g font-family="Arial,sans-serif" font-size="12"><rect x="744" y="61" width="124" height="30" rx="15" fill="#34302D"/><text x="761" y="81" fill="#EBEBE9">Coding</text><text x="880" y="81" fill="#9E9D99">Entropy</text><text x="955" y="81" fill="#9E9D99">MDL</text><text x="1001" y="81" fill="#9E9D99">Prediction</text></g>
<text x="744" y="133" fill="#EBEBE9" font-family="Georgia,serif" font-size="23">Information coding</text><text x="744" y="158" fill="#9E9D99" font-family="Arial,sans-serif" font-size="13">How many bits describe this sequence?</text>
<rect x="744" y="180" width="412" height="250" rx="5" fill="#242322" stroke="#3D3C3A"/><text x="766" y="208" fill="#9E9D99" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.4">BITS PER SYMBOL</text>
