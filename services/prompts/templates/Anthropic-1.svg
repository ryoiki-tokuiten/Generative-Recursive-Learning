<rect x="956" y="448" width="200" height="92" rx="5" fill="#242322" stroke="#3D3C3A"/><text x="976" y="476" fill="#9E9D99" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">ENTROPY</text><text x="976" y="515" fill="#D4B16A" font-family="Georgia,serif" font-size="31">0.72</text><text x="1046" y="513" fill="#9E9D99" font-family="Arial,sans-serif" font-size="13">bits / symbol</text>
