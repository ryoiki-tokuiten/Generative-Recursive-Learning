<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">visuals-focused — Pure Geometric Proof Interactive Visualizer</title>
  <desc id="desc">Dark mathematical proof interface with a glassmorphic control sidebar on the left and a high-precision p5.js geometric canvas on the right showing concentric circle projections onto sec x.</desc>
  <defs>
    <linearGradient id="sidebarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D1C1A"/>
      <stop offset="100%" stop-color="#191816"/>
    </linearGradient>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSeg" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="canvasClip">
      <rect x="366" y="0" width="834" height="675"/>
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="#141413"/>

  <!-- ================= RIGHT GEOMETRIC CANVAS ================= -->
  <g clip-path="url(#canvasClip)">
    <!-- Minor Grid Lines (step = 114.25px) -->
    <g stroke="#F0EFEA" stroke-opacity="0.045" stroke-width="1">
      <line x1="366" y1="588" x2="1200" y2="588"/>
      <line x1="366" y1="473.75" x2="1200" y2="473.75"/>
      <line x1="366" y1="359.5" x2="1200" y2="359.5"/>
      <line x1="366" y1="245.25" x2="1200" y2="245.25"/>
      <line x1="366" y1="131" x2="1200" y2="131"/>
      <line x1="366" y1="16.75" x2="1200" y2="16.75"/>
      <line x1="480" y1="0" x2="480" y2="675"/>
      <line x1="594.25" y1="0" x2="594.25" y2="675"/>
      <line x1="708.5" y1="0" x2="708.5" y2="675"/>
      <line x1="822.75" y1="0" x2="822.75" y2="675"/>
      <line x1="937" y1="0" x2="937" y2="675"/>
      <line x1="1051.25" y1="0" x2="1051.25" y2="675"/>
      <line x1="1165.5" y1="0" x2="1165.5" y2="675"/>
    </g>

    <!-- Major Grid Lines -->
    <g stroke="#F0EFEA" stroke-opacity="0.11" stroke-width="1.2">
      <line x1="366" y1="131" x2="1200" y2="131"/>
      <line x1="937" y1="0" x2="937" y2="675"/>
    </g>

    <!-- Main Coordinate Axes through Origin (480, 588) -->
    <line x1="366" y1="588" x2="1200" y2="588" stroke="#F0EFEA" stroke-opacity="0.32" stroke-width="1.6"/>
    <line x1="480" y1="0" x2="480" y2="675" stroke="#F0EFEA" stroke-opacity="0.32" stroke-width="1.6"/>

    <!-- Vertical Tangent Wall at x = 1 (x = 1072, where R = 592px) -->
    <line x1="1072" y1="8" x2="1072" y2="625" stroke="#F0EFEA" stroke-opacity="0.52" stroke-width="2"/>

    <!-- Base = 1 Segment along horizontal axis -->
    <line x1="480" y1="588" x2="1072" y2="588" stroke="#5B9BD5" stroke-opacity="0.55" stroke-width="2.4"/>

    <!-- 5 Intermediate Rays from Origin (480, 588) to Wall (x = 1072) -->
    <!-- Angles for x = 0.82, n = 5: 0.164, 0.328, 0.492, 0.656, 0.820 rad -->
    <!-- Wall points:
         i=1: (1072, 490.0)
         i=2: (1072, 386.6)
         i=3: (1072, 270.9)
         i=4: (1072, 132.4)
         i=5: (1072, -37.2 -> scaled in view to (1072, 52.0) with R=500, let's use exact screenshot coords!)
    -->
    <!-- Screenshot exact coordinates:
         Origin O = (480, 588)
         Wall x = 1073 (R = 593)
         Top of wall (tan x) = (1073, 52) -> angle = atan2(536, 593) = 42.11 deg
         Wait: in screenshot:
         Origin is (480, 588)
         Wall is at x = 1073
         Ray 1 hits wall at (1073, 502)
         Ray 2 hits wall at (1073, 412)
         Ray 3 hits wall at (1073, 312)
         Ray 4 hits wall at (1073, 195)
         Ray 5 (Main sec x ray) hits wall at (1073, 52)
    -->
    <g stroke="#F5F4EF" stroke-opacity="0.22" stroke-width="1.2">
      <line x1="480" y1="588" x2="1073" y2="502"/>
      <line x1="480" y1="588" x2="1073" y2="412"/>
      <line x1="480" y1="588" x2="1073" y2="312"/>
      <line x1="480" y1="588" x2="1073" y2="195"/>
      <line x1="480" y1="588" x2="1073" y2="52"/>
    </g>

    <!-- Annulus Sector Shaded Bands between Concentric Circles and Main Ray -->
    <!-- Main ray unit vector: dx = 593, dy = -536, len = 799.35 (ux = 0.74185, uy = -0.67056)
         Radii from O(480, 588):
         r0 = 593.0 -> on main ray: (919.9, 190.4)
         r1 = sqrt(593^2 + 86^2) = 599.2 -> on main ray: (924.5, 186.2)
         r2 = sqrt(593^2 + 176^2) = 618.6 -> on main ray: (938.9, 173.2)
         r3 = sqrt(593^2 + 276^2) = 654.1 -> on main ray: (965.2, 150.4)
         r4 = sqrt(593^2 + 393^2) = 711.4 -> on main ray: (1007.8, 110.9)
         r5 = sqrt(593^2 + 536^2) = 799.4 -> on main ray: (1073.0, 52.0)
    -->
    <!-- Subtle colored sector fills -->
    <path d="M 1073 502 A 599.2 599.2 0 0 0 924.5 186.2 L 919.9 190.4 A 593 593 0 0 1 1066.8 502.9 Z" fill="#D97757" fill-opacity="0.06"/>
    <path d="M 1073 412 A 618.6 618.6 0 0 0 938.9 173.2 L 924.5 186.2 A 599.2 599.2 0 0 1 1054.5 417.5 Z" fill="#E09132" fill-opacity="0.06"/>
    <path d="M 1073 312 A 654.1 654.1 0 0 0 965.2 150.4 L 938.9 173.2 A 618.6 618.6 0 0 1 1037.5 328.5 Z" fill="#9B7EDE" fill-opacity="0.06"/>
    <path d="M 1073 195 A 711.4 711.4 0 0 0 1007.8 110.9 L 965.2 150.4 A 654.1 654.1 0 0 1 1018.8 231.0 Z" fill="#D46387" fill-opacity="0.06"/>
    <path d="M 1073 52 A 799.4 799.4 0 0 0 1073 52 L 1007.8 110.9 A 711.4 711.4 0 0 1 1007.8 110.9 Z" fill="#3B9B96" fill-opacity="0.08"/>

    <!-- Solid Circular Transfer Arcs between consecutive rays -->
    <path d="M 1073 588 A 593 593 0 0 0 1066.8 502.9" fill="none" stroke="#D97757" stroke-width="1.6" stroke-opacity="0.8"/>
    <path d="M 1073 502 A 599.2 599.2 0 0 0 1054.5 417.5" fill="none" stroke="#E09132" stroke-width="1.6" stroke-opacity="0.8"/>
    <path d="M 1073 412 A 618.6 618.6 0 0 0 1037.5 328.5" fill="none" stroke="#9B7EDE" stroke-width="1.6" stroke-opacity="0.8"/>
    <path d="M 1073 312 A 654.1 654.1 0 0 0 1018.8 231.0" fill="none" stroke="#D46387" stroke-width="1.6" stroke-opacity="0.8"/>
    <path d="M 1073 195 A 711.4 711.4 0 0 0 1007.8 110.9" fill="none" stroke="#3B9B96" stroke-width="1.8" stroke-opacity="0.85"/>

    <!-- Faint tip growth segments along intermediate rays near wall -->
    <line x1="1066.8" y1="502.9" x2="1073" y2="502" stroke="#D97757" stroke-width="2.2" stroke-opacity="0.45"/>
    <line x1="1054.5" y1="417.5" x2="1073" y2="412" stroke="#E09132" stroke-width="2.2" stroke-opacity="0.45"/>
    <line x1="1037.5" y1="328.5" x2="1073" y2="312" stroke="#9B7EDE" stroke-width="2.2" stroke-opacity="0.45"/>
    <line x1="1018.8" y1="231.0" x2="1073" y2="195" stroke="#D46387" stroke-width="2.2" stroke-opacity="0.45"/>

    <!-- Concentric Dashed Arcs sweeping up to the Main sec x Ray -->
    <path d="M 1066.8 502.9 A 593 593 0 0 0 919.9 190.4" fill="none" stroke="#D97757" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.82"/>
    <path d="M 1054.5 417.5 A 599.2 599.2 0 0 0 924.5 186.2" fill="none" stroke="#E09132" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.82"/>
    <path d="M 1037.5 328.5 A 618.6 618.6 0 0 0 938.9 173.2" fill="none" stroke="#9B7EDE" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.82"/>
    <path d="M 1018.8 231.0 A 654.1 654.1 0 0 0 965.2 150.4" fill="none" stroke="#D46387" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.82"/>
    <path d="M 1007.8 110.9 A 711.4 711.4 0 0 0 1007.8 110.9" fill="none" stroke="#3B9B96" stroke-width="1.8" stroke-dasharray="5 4" stroke-opacity="0.88"/>

    <!-- Wall Tip Dots -->
    <circle cx="1073" cy="502" r="2.8" fill="#141413" stroke="#D97757" stroke-width="1.5" opacity="0.75"/>
    <circle cx="1073" cy="412" r="2.8" fill="#141413" stroke="#E09132" stroke-width="1.5" opacity="0.75"/>
    <circle cx="1073" cy="312" r="2.8" fill="#141413" stroke="#9B7EDE" stroke-width="1.5" opacity="0.75"/>
    <circle cx="1073" cy="195" r="2.8" fill="#141413" stroke="#D46387" stroke-width="1.5" opacity="0.75"/>

    <!-- MAIN RAY: Glowing Base 1 Vector (480, 588) -> (919.9, 190.4) -->
    <g filter="url(#glowBlue)">
      <line x1="480" y1="588" x2="914" y2="195.5" stroke="#5B9BD5" stroke-width="4.5" stroke-linecap="round"/>
      <polygon points="919.9,190.4 908.5,194.2 912.5,196.8 914.2,201.2" fill="#5B9BD5"/>
    </g>

    <!-- MAIN RAY: Stacked Δr₁ .. Δr₅ Vectors with Glow -->
    <g filter="url(#glowSeg)" stroke-linecap="round">
      <!-- Δr₁ -->
      <line x1="919.9" y1="190.4" x2="924.5" y2="186.2" stroke="#D97757" stroke-width="4.8"/>
      <!-- Δr₂ -->
      <line x1="924.5" y1="186.2" x2="938.9" y2="173.2" stroke="#E09132" stroke-width="4.8"/>
      <!-- Δr₃ -->
      <line x1="938.9" y1="173.2" x2="965.2" y2="150.4" stroke="#9B7EDE" stroke-width="4.8"/>
      <polygon points="965.2,150.4 955.2,153.8 958.8,156.2 960.5,160.1" fill="#9B7EDE"/>
      <!-- Δr₄ -->
      <line x1="965.2" y1="150.4" x2="1007.8" y2="110.9" stroke="#D46387" stroke-width="4.8"/>
      <polygon points="1007.8,110.9 997.5,114.6 1001.2,117.1 1002.9,121.0" fill="#D46387"/>
      <!-- Δr₅ -->
      <line x1="1007.8" y1="110.9" x2="1068.5" y2="56.0" stroke="#3B9B96" stroke-width="5.2"/>
      <polygon points="1073.0,52.0 1061.4,56.5 1065.6,59.2 1067.6,63.6" fill="#3B9B96"/>
    </g>

    <!-- Main Ray Segment Boundary Dots -->
    <circle cx="919.9" cy="190.4" r="3.4" fill="#141413" stroke="#D97757" stroke-width="1.8"/>
    <circle cx="924.5" cy="186.2" r="3.4" fill="#141413" stroke="#E09132" stroke-width="1.8"/>
    <circle cx="938.9" cy="173.2" r="3.6" fill="#141413" stroke="#9B7EDE" stroke-width="1.8"/>
    <circle cx="965.2" cy="150.4" r="3.6" fill="#141413" stroke="#D46387" stroke-width="1.8"/>
    <circle cx="1007.8" cy="110.9" r="3.8" fill="#141413" stroke="#3B9B96" stroke-width="1.8"/>
    <circle cx="1073.0" cy="52.0" r="4.0" fill="#141413" stroke="#3B9B96" stroke-width="1.8"/>

    <!-- Origin & Base 1 Wall Dots -->
    <circle cx="480" cy="588" r="4.2" fill="#141413" stroke="#F5F4EF" stroke-width="2"/>
    <circle cx="1073" cy="588" r="4.0" fill="#141413" stroke="#5B9BD5" stroke-width="2"/>

    <!-- Canvas Callout Badges & Dashed Leader Lines -->
    <g font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">
      <!-- Base 1 Badge -->
      <rect x="605" y="392" width="46" height="17" rx="4" fill="#1C1B19" fill-opacity="0.94" stroke="#5B9BD5" stroke-width="1" stroke-opacity="0.65"/>
      <text x="628" y="403.5" fill="#5B9BD5">Base 1</text>

      <!-- Δr₂ Badge -->
      <line x1="931.7" y1="179.7" x2="916" y2="167" stroke="#E09132" stroke-width="1" stroke-dasharray="2.5 2.5" stroke-opacity="0.6"/>
      <rect x="890" y="152" width="28" height="16" rx="4" fill="#1C1B19" fill-opacity="0.94" stroke="#E09132" stroke-width="1" stroke-opacity="0.65"/>
      <text x="904" y="163" fill="#E09132" font-size="8.8">Δr₂</text>

      <!-- Δr₃ Badge -->
      <line x1="952" y1="161.8" x2="937" y2="149" stroke="#9B7EDE" stroke-width="1" stroke-dasharray="2.5 2.5" stroke-opacity="0.6"/>
      <rect x="912" y="134" width="28" height="16" rx="4" fill="#1C1B19" fill-opacity="0.94" stroke="#9B7EDE" stroke-width="1" stroke-opacity="0.65"/>
      <text x="926" y="145" fill="#9B7EDE" font-size="8.8">Δr₃</text>

      <!-- Δr₄ Badge -->
      <line x1="986.5" y1="130.6" x2="972" y2="117" stroke="#D46387" stroke-width="1" stroke-dasharray="2.5 2.5" stroke-opacity="0.6"/>
      <rect x="946" y="102" width="28" height="16" rx="4" fill="#1C1B19" fill-opacity="0.94" stroke="#D46387" stroke-width="1" stroke-opacity="0.65"/>
      <text x="960" y="113" fill="#D46387" font-size="8.8">Δr₄</text>

      <!-- Δr₅ Badge -->
      <line x1="1040.4" y1="81.4" x2="1026" y2="68" stroke="#3B9B96" stroke-width="1" stroke-dasharray="2.5 2.5" stroke-opacity="0.6"/>
      <rect x="1001" y="53" width="28" height="16" rx="4" fill="#1C1B19" fill-opacity="0.94" stroke="#3B9B96" stroke-width="1" stroke-opacity="0.65"/>
      <text x="1015" y="64" fill="#3B9B96" font-size="8.8">Δr₅</text>
    </g>
  </g>

  <!-- ================= LEFT GLASS SIDEBAR (366px wide) ================= -->
  <rect width="366" height="675" fill="url(#sidebarBg)"/>
  <line x1="366" y1="0" x2="366" y2="675" stroke="#F0EFEA" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Top Header -->
  <rect width="366" height="44" fill="#22211E"/>
  <line x1="0" y1="44" x2="366" y2="44" stroke="#F0EFEA" stroke-opacity="0.1" stroke-width="1"/>
  <text x="16" y="27" fill="#F5F4EF" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">∫₀ˣ <tspan font-style="normal">tan</tspan> t dt = <tspan font-style="normal">ln(sec</tspan> x<tspan font-style="normal">)</tspan></text>

  <!-- Theme Toggle Button -->
  <rect x="326" y="10" width="24" height="24" rx="6" fill="#151412" stroke="#F0EFEA" stroke-opacity="0.14"/>
  <circle cx="338" cy="22" r="4" fill="none" stroke="#96938B" stroke-width="1.3"/>
  <path d="M338 15v2m0 10v2m-7-7h2m10 0h2m-9.9-4.9l1.4 1.4m7 7l1.4 1.4m0-9.8l-1.4 1.4m-7 7l-1.4 1.4" stroke="#96938B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Phase Navigation Tabs (6 cols) -->
  <rect y="44" width="366" height="30" fill="#1C1B19"/>
  <line x1="0" y1="74" x2="366" y2="74" stroke="#F0EFEA" stroke-opacity="0.1"/>
  <g font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle" fill="#96938B" letter-spacing="0.4">
    <text x="30" y="62">SECANT</text>
    <text x="91" y="62">STEP</text>
    <rect x="122" y="44" width="61" height="30" fill="#D97757" fill-opacity="0.1"/>
    <line x1="122" y1="73" x2="183" y2="73" stroke="#D97757" stroke-width="2"/>
    <text x="152.5" y="62" fill="#F5F4EF" font-weight="600">STACK</text>
    <text x="213.5" y="62">COMPOUND</text>
    <text x="274.5" y="62">LINEARIZE</text>
    <text x="335.5" y="62">INTUITION</text>
  </g>

  <!-- Section Title & Prose -->
  <text x="16" y="101" fill="#F5F4EF" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700">Concentric Projection onto sec x</text>
  <g fill="#E6E4DD" font-family="Inter, system-ui, sans-serif" font-size="10.2" opacity="0.9">
    <text x="16" y="124">Continue each concentric circle of radius 1, sec x₁, sec x₂, …</text>
    <text x="16" y="140">from the vertical wall right up to the main sec x ray (or toggle</text>
    <text x="16" y="156">Full Circles to see the complete concentric shells)! The circles</text>
    <text x="16" y="172">carve sec x directly into Base 1 plus Δr₁ + Δr₂ + ··· + Δrₙ.</text>
  </g>

  <!-- Equation Box -->
  <rect x="16" y="187" width="334" height="42" rx="8" fill="#151412" stroke="#F0EFEA" stroke-opacity="0.12"/>
  <text x="183" y="213" text-anchor="middle" fill="#F5F4EF" font-family="Georgia, 'Times New Roman', serif" font-size="13">sec <tspan font-style="italic">x</tspan> = 1 + Δ<tspan font-style="italic">r</tspan>₁ + Δ<tspan font-style="italic">r</tspan>₂ + ··· + Δ<tspan font-style="italic">rₙ</tspan></text>

  <!-- Interactive Stage Controls Sub-box -->
  <rect x="16" y="258" width="334" height="143" rx="10" fill="#151412" stroke="#F0EFEA" stroke-opacity="0.12"/>
  <!-- 2 Stage Pills -->
  <text x="99" y="281" text-anchor="middle" fill="#96938B" font-family="'JetBrains Mono', monospace" font-size="8.2">Ray Cascade</text>
  <rect x="184" y="267" width="154" height="22" rx="6" fill="#D97757" fill-opacity="0.14" stroke="#D97757" stroke-width="1.1"/>
  <text x="261" y="281" text-anchor="middle" fill="#F5F4EF" font-family="'JetBrains Mono', monospace" font-size="8.2" font-weight="600">Circles to Main Ray</text>

  <line x1="28" y1="300" x2="338" y2="300" stroke="#F0EFEA" stroke-opacity="0.08"/>

  <!-- Play Button + Progress Slider -->
  <rect x="28" y="311" width="22" height="22" rx="5" fill="#1C1B19" stroke="#F0EFEA" stroke-opacity="0.14"/>
  <polygon points="37,318 37,326 43,322" fill="#F5F4EF"/>
  <rect x="58" y="319.5" width="276" height="5" rx="2.5" fill="#D97757" fill-opacity="0.85"/>
  <circle cx="334" cy="322" r="5.5" fill="#F5F4EF" stroke="#D97757" stroke-width="1.5"/>

  <!-- Active Radial Growth Circles Stepper -->
  <line x1="28" y1="344" x2="338" y2="344" stroke="#F0EFEA" stroke-opacity="0.08"/>
  <text x="28" y="360" fill="#96938B" font-family="'JetBrains Mono', monospace" font-size="7.5" letter-spacing="0.5">ACTIVE RADIAL GROWTH CIRCLES</text>
  <text x="338" y="360" text-anchor="end" fill="#D97757" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">5/5</text>

  <g font-family="'JetBrains Mono', monospace" font-size="7.8" text-anchor="middle">
    <rect x="28" y="368" width="73" height="22" rx="5" fill="#1C1B19" stroke="#F0EFEA" stroke-opacity="0.12"/>
    <text x="64.5" y="382" fill="#96938B">⏮ Reset</text>
    <rect x="106" y="368" width="73" height="22" rx="5" fill="#1C1B19" stroke="#F0EFEA" stroke-opacity="0.12"/>
    <text x="142.5" y="382" fill="#96938B">← Back</text>
    <rect x="184" y="368" width="73" height="22" rx="5" fill="#1C1B19" stroke="#F0EFEA" stroke-opacity="0.18"/>
    <text x="220.5" y="382" fill="#F5F4EF" font-weight="600">▶ Auto</text>
    <rect x="262" y="368" width="76" height="22" rx="5" fill="#D97757" fill-opacity="0.12" stroke="#D97757" stroke-opacity="0.45"/>
    <text x="300" y="382" fill="#D97757">Step →</text>
  </g>

  <!-- Bottom Global Controls -->
  <line x1="0" y1="531" x2="366" y2="531" stroke="#F0EFEA" stroke-opacity="0.1"/>
  <rect x="16" y="540" width="242" height="23" rx="6" fill="#151412" stroke="#F0EFEA" stroke-opacity="0.14"/>
  <circle cx="101" cy="551.5" r="4.5" fill="none" stroke="#96938B" stroke-width="1.1"/>
  <circle cx="101" cy="551.5" r="2" fill="none" stroke="#96938B" stroke-width="1"/>
  <text x="144" y="555" text-anchor="middle" fill="#E6E4DD" font-family="'JetBrains Mono', monospace" font-size="8.2">Full Circles</text>

  <rect x="266" y="540" width="84" height="23" rx="6" fill="#151412" stroke="#F0EFEA" stroke-opacity="0.14"/>
  <text x="308" y="555" text-anchor="middle" fill="#96938B" font-family="'JetBrains Mono', monospace" font-size="8.2">Reset View</text>

  <line x1="0" y1="572" x2="366" y2="572" stroke="#F0EFEA" stroke-opacity="0.1"/>

  <!-- Slider 1: Differential Segments n -->
  <text x="16" y="590" fill="#96938B" font-family="'JetBrains Mono', monospace" font-size="7.8" letter-spacing="0.4">DIFFERENTIAL SEGMENTS N (DX = X / N)</text>
  <text x="350" y="590" text-anchor="end" fill="#5B9BD5" font-family="'JetBrains Mono', monospace" font-size="8.2" font-weight="600">n = 5 slices</text>
  <rect x="16" y="601" width="334" height="4.5" rx="2.25" fill="#151412"/>
  <rect x="16" y="601" width="14" height="4.5" rx="2.25" fill="#5B9BD5"/>
