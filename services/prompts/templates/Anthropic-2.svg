<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Anthropic 2 — editorial lesson preview</title><desc id="desc">A warm charcoal research essay preview with readable paragraph copy, subtle loading lines, and a full-width three-part entropy figure.</desc>
<defs><pattern id="cells" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="15" height="15" fill="#34312D"/></pattern><linearGradient id="curvefill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8FA895" stop-opacity=".25"/><stop offset="1" stop-color="#8FA895" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="675" fill="#1A1918"/><path d="M0 70H1200" stroke="#3D3C3A"/>
<text x="72" y="44" fill="#EBEBE9" font-family="Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2">ANTHROPIC RESEARCH</text><circle cx="1128" cy="36" r="8" fill="none" stroke="#9E9D99"/><path d="M1124 36h8" stroke="#9E9D99"/>
<text x="40" y="111" fill="#9E9D99" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5">1 / WHAT THE CLAIM ACTUALLY SAYS</text>
<text x="40" y="148" fill="#EBEBE9" font-family="Georgia,serif" font-size="24">A compact description is useful when it captures regularities that help a system predict and generalize.</text>
<text x="40" y="179" fill="#B1AFAB" font-family="Georgia,serif" font-size="16">Finding those regularities is what makes data compressible. The shorter description can represent more than the examples</text><text x="40" y="202" fill="#B1AFAB" font-family="Georgia,serif" font-size="16">it was built from, supporting useful predictions about what comes next.</text>
<g fill="#383633"><rect x="40" y="224" width="1096" height="6" rx="3"/><rect x="40" y="242" width="1038" height="6" rx="3"/><rect x="40" y="260" width="1080" height="6" rx="3"/><rect x="40" y="278" width="686" height="6" rx="3"/></g>
<text x="40" y="321" fill="#EBEBE9" font-family="Georgia,serif" font-size="22">Entropy is uncertainty you can measure</text><text x="40" y="346" fill="#9E9D99" font-family="Arial,sans-serif" font-size="13">Common outcomes are easier to predict; rare ones carry more surprise.</text>
<path d="M0 380H1200M0 628H1200" stroke="#3D3C3A"/>
<text x="72" y="414" fill="#9E9D99" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.4">PROBABILITY P(1)</text><path d="M72 453H280" stroke="#4A4743" stroke-width="3"/><path d="M72 453H202" stroke="#E58B6B" stroke-width="3"/><circle cx="202" cy="453" r="8" fill="#E58B6B" stroke="#1A1918" stroke-width="3"/><text x="244" y="442" fill="#EBEBE9" font-family="monospace" font-size="14">0.72</text>
<text x="72" y="495" fill="#9E9D99" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.4">SHANNON ENTROPY</text><text x="72" y="535" fill="#E58B6B" font-family="Georgia,serif" font-size="36">0.855</text><text x="190" y="534" fill="#9E9D99" font-family="Arial,sans-serif" font-size="13">bits per symbol</text><text x="72" y="570" fill="#9E9D99" font-family="Arial,sans-serif" font-size="13">More balanced outcomes carry more surprise.</text>
<rect x="409" y="414" width="180" height="180" fill="url(#cells)"/>
