<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Interactive first-principles lesson.">
    <title>Interactive Research Essay</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        (function () {
            const savedTheme = localStorage.getItem('anthropic-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ant: {
                            bg: 'var(--ant-bg)',
                            surface: 'var(--ant-surface)',
                            surfaceHover: 'var(--ant-surface-hover)',
                            text: 'var(--ant-text)',
                            textMuted: 'var(--ant-text-muted)',
                            accent: 'var(--ant-accent)',
                            accentHover: 'var(--ant-accent-hover)',
                            border: 'var(--ant-border)',
                            chartPrimary: 'var(--ant-chart-primary)',
                            chartSecondary: 'var(--ant-chart-secondary)',
                            chartTertiary: 'var(--ant-chart-tertiary)',
                            danger: 'var(--ant-danger)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        serif: ['Newsreader', 'Charter', 'serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
                    }
                }
            }
        };
    </script>
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react,react-dom",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom",
            "zustand": "https://esm.sh/zustand@4.5.0?external=react",
            "clsx": "https://esm.sh/clsx@2.1.0",
            "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1",
            "lodash": "https://esm.sh/lodash@4.17.21"
        }
    }
    </script>
    
    <style>
        :root {
            --ant-bg: #FAF9F6;
            --ant-surface: #F2F0EA;
            --ant-surface-hover: #E8E5DF;
            --ant-text: #2C2C2A;
            --ant-text-muted: #767570;
            --ant-accent: #D97757; 
            --ant-accent-hover: #C2674A;
            --ant-border: #E5E3DB;
            --ant-chart-primary: #D97757;
            --ant-chart-secondary: #7C9682; 
            --ant-chart-tertiary: #D4B16A; 
            --ant-danger: #C94A4A;
        }

        .dark {
            --ant-bg: #1A1918;
            --ant-surface: #242322;
            --ant-surface-hover: #2D2C2B;
            --ant-text: #EBEBE9;
            --ant-text-muted: #9E9D99;
            --ant-accent: #E58B6E;
            --ant-accent-hover: #D97757;
            --ant-border: #3D3C3A;
            --ant-chart-primary: #E58B6E;
            --ant-chart-secondary: #8FA895;
            --ant-chart-tertiary: #D4B16A;
            --ant-danger: #D95353;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--ant-bg);
            color: var(--ant-text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        * { box-sizing: border-box; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background-clip: padding-box;
            background-color: var(--ant-border);
            border-radius: 3px;
        }

        input[type=range].ant-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
            margin: 8px 0;
        }
        input[type=range].ant-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 1px;
            cursor: pointer;
            background: var(--ant-border);
        }
        input[type=range].ant-slider::-webkit-slider-thumb {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--ant-accent);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            transition: transform 0.1s ease;
        }
        input[type=range].ant-slider:active::-webkit-slider-thumb { transform: scale(1.3); }

        .ant-prose { font-family: 'Newsreader', 'Charter', serif; }
        .ant-prose p { margin-bottom: 1.5em; line-height: 1.7; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter { animation: fadeIn 0.4s ease-out both; }
        
        .breakout-container {
            width: 100%;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- AGENT GUIDE: Preserve this single-column Anthropic research layout (`max-w-[700px]` centered Newsreader prose) with wide breakout interactive figures (`breakout-container` up to `1100px`). Populate `ARTICLE` with clear, mechanism-first sections (`p`, `equation`, `callout`), build topic-specific interactive React dashboards using `Slider`, `StatBox`, and your imported visualization libraries, and register them in `DASHBOARDS` keyed by section ID so they render inline below their corresponding prose sections. -->
    <script type="text/babel" data-type="module">
        import React, { useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { create } from 'zustand';
        import { clsx } from 'clsx';
        import { twMerge } from 'tailwind-merge';
        import * as Lucide from 'lucide-react';

        const cn = (...inputs) => twMerge(clsx(inputs));

        const ARTICLE = Object.freeze([
            {
                id: 'sec-1',
                title: '1. Section title placeholder',
                blocks: [
                    { type: 'p', text: 'Replace this placeholder with clear, mechanism-first prose.' },
                    { type: 'equation', label: 'Core identity', text: 'f(x) = ...' },
                    { type: 'callout', title: 'Important boundary', text: 'State essential assumptions, edge cases, or conceptual boundaries here.' }
                ]
            }
        ]);

        const useStore = create((set, get) => ({
            theme: localStorage.getItem('anthropic-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
            paramValue: 0.5,

            update: (partial) => set(partial),
            toggleTheme: () => {
                const t = get().theme === 'dark' ? 'light' : 'dark';
                set({ theme: t });
                localStorage.setItem('anthropic-theme', t);
                document.documentElement.classList.toggle('dark', t === 'dark');
            }
        }));

        const Slider = ({ label, min, max, step, value, onChange, format }) => (
            <div className="w-full">
                <div className="flex justify-between text-[12px] text-ant-textMuted mb-2 font-sans font-medium uppercase tracking-wide">
                    <span>{label}</span>
                    <span className="font-mono text-ant-text">{format ? format(value) : value}</span>
                </div>
                <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(parseFloat(e.target.value))} className="ant-slider" />
            </div>
        );

        const StatBox = ({ label, value, sub, accent }) => (
            <div className="flex flex-col">
                <span className="text-[10px] uppercase tracking-wider text-ant-textMuted mb-1 font-semibold">{label}</span>
                <span className={cn("text-2xl font-mono", accent ? "text-ant-accent" : "text-ant-text")}>{value}</span>
                {sub && <span className="text-[11px] text-ant-textMuted mt-1 uppercase tracking-wide">{sub}</span>}
            </div>
        );

        const BreakoutDashboardPlaceholder = () => {
            const store = useStore();
            return (
                <div className="my-16 animate-enter breakout-container border-y border-ant-border py-12">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-12 items-center">
                        <div className="space-y-8">
                            <Slider
                                label="Parameter Control"
                                min={0}
                                max={1}
                                step={0.01}
                                value={store.paramValue}
                                onChange={v => store.update({ paramValue: v })}
                                format={v => v.toFixed(2)}
                            />
                            <StatBox label="Computed Output" value={store.paramValue.toFixed(3)} sub="Unit description" accent />
                        </div>
                        <div className="md:col-span-2 h-[260px] flex items-center justify-center border border-dashed border-ant-border font-mono text-xs text-ant-textMuted">
                            [ Breakout Interactive Figure Mount ]
                        </div>
                    </div>
                </div>
            );
        };

        const ArticleBlock = ({ block }) => {
            if (block.type === 'equation') return (
                <div className="my-10 py-8 text-center font-mono border-y border-ant-border bg-ant-surface/30">
                    <div className="text-[11px] font-sans font-semibold text-ant-textMuted mb-3 uppercase tracking-widest">{block.label}</div>
                    <div className="text-[16px] text-ant-text">{block.text}</div>
                </div>
            );
            if (block.type === 'callout') return (
                <div className="my-10 pl-6 py-2 border-l-2 border-ant-accent bg-transparent">
                    <div className="text-[13px] font-sans uppercase tracking-widest font-semibold text-ant-text mb-3">{block.title}</div>
                    <p className="text-[18px] font-serif text-ant-textMuted leading-relaxed m-0 italic">{block.text}</p>
                </div>
            );
            return <p className="text-[19px] md:text-[21px] font-serif text-ant-text ant-prose">{block.text}</p>;
        };

        const ArticleReader = () => {
            const store = useStore();
            const DASHBOARDS = {
                'sec-1': BreakoutDashboardPlaceholder
            };

            return (
                <div className="w-full h-full overflow-y-auto no-scrollbar scroll-smooth">
                    <div className="sticky top-0 z-30 w-full bg-ant-bg/90 backdrop-blur-md border-b border-ant-border py-4 px-4 sm:px-6 md:px-8 flex justify-between items-center">
                        <div className="text-[13px] font-medium font-sans uppercase tracking-widest text-ant-text">Anthropic Research</div>
                        <div className="flex items-center gap-5">
                            <button onClick={store.toggleTheme} className="text-ant-textMuted hover:text-ant-text transition-colors">
                                {store.theme === 'dark' ? <Lucide.Sun size={18} /> : <Lucide.Moon size={18} />}
                            </button>
                        </div>
                    </div>
                    
                    <div className="w-full pt-20 pb-32">
                        <div className="w-full max-w-[700px] mx-auto px-4 sm:px-6 md:px-8">
                            <header className="mb-24">
                                <h1 className="text-[3em] md:text-[3.8em] font-serif text-ant-text mb-6 leading-[1.1] tracking-tight">Lesson Title Placeholder</h1>
                                <p className="text-[1.4em] font-serif leading-relaxed text-ant-textMuted">
                                    Subtitle placeholder introducing the core problem and structure of the explanation.
                                </p>
                            </header>
                        </div>

                        <div className="space-y-[6em]">
                            {ARTICLE.map(sec => {
                                const DashboardComponent = DASHBOARDS[sec.id];
                                return (
                                    <section key={sec.id} id={sec.id}>
                                        <div className="w-full max-w-[700px] mx-auto px-4 sm:px-6 md:px-8">
                                            <h2 className="text-[1.6em] font-serif font-semibold text-ant-text mb-8 leading-tight">
                                                {sec.title}
                                            </h2>
                                            <div>
                                                {sec.blocks.map((block, index) => <ArticleBlock key={index} block={block} />)}
                                            </div>
                                        </div>
                                        
                                        {DashboardComponent && (
                                            <div className="px-4 sm:px-6 md:px-8">
                                                <DashboardComponent />
                                            </div>
                                        )}
                                    </section>
                                );
                            })}
                        </div>
                        
                        <footer className="w-full max-w-[700px] mx-auto px-4 sm:px-6 md:px-8 mt-[8em] border-t border-ant-border pt-[4em] flex justify-center opacity-30">
                            <Lucide.Aperture size={24} />
                        </footer>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ArticleReader />);
    </script>
</body>
</html>
