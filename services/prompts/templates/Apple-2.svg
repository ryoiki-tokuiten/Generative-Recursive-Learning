<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Apple 2 — full-width reading and inline visualization</title>
<desc id="desc">A nearly full-bleed Apple-style lesson preview that replaces a large hero title with paragraph content and a wide interactive entropy figure.</desc>
<defs>
  <linearGradient id="blueArea" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2997FF" stop-opacity=".2"/><stop offset="1" stop-color="#2997FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="softLine" x1="0" x2="1"><stop stop-color="#48484A"/><stop offset="1" stop-color="#29292C"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="#000"/>
<path d="M0 48H1200" stroke="#1C1C1E"/>
<text x="28" y="30" fill="#98989D" font-family="Arial,sans-serif" font-size="11" font-weight="600">A lesson in information</text>
<text x="1090" y="30" fill="#98989D" font-family="Arial,sans-serif" font-size="10">A A</text>
<circle cx="1151" cy="26" r="7" fill="none" stroke="#98989D"/>

<!-- Paragraph-first opening: varied text lines suggest real article content without a title block -->
<text x="30" y="76" fill="#98989D" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">01  /  THE INFORMATION CONTENT OF A SOURCE</text>
<rect x="30" y="95" width="1128" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="112" width="1093" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="129" width="1112" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="146" width="1026" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="163" width="1070" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="180" width="748" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="204" width="1105" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="221" width="1067" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="238" width="1090" height="6" rx="3" fill="url(#softLine)"/>
<rect x="30" y="255" width="849" height="6" rx="3" fill="url(#softLine)"/>

<!-- A compact inline equation gives the reading a concrete visual anchor -->
<rect x="28" y="278" width="1144" height="50" rx="12" fill="#1C1C1E"/>
<text x="52" y="298" fill="#98989D" font-family="Arial,sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">SHANNON ENTROPY</text>
<text x="52" y="318" fill="#64D2FF" font-family="Georgia,serif" font-size="16">H(X) = − Σ p(x) log₂ p(x)</text>
<path d="M652 291v24" stroke="#3A3A3C"/>
<rect x="679" y="295" width="469" height="5" rx="2.5" fill="#343437"/>
<rect x="679" y="308" width="420" height="5" rx="2.5" fill="#343437"/>

<!-- Full-width inline figure -->
<rect x="28" y="345" width="1144" height="302" rx="20" fill="#1C1C1E"/>
<text x="54" y="375" fill="#F5F5F7" font-family="Arial,sans-serif" font-size="15" font-weight="700">Entropy landscape</text>
<text x="54" y="395" fill="#98989D" font-family="Arial,sans-serif" font-size="10.5">Probability shapes how predictable a source is, and how much information each symbol carries.</text>
<path d="M422 412V625" stroke="#343437"/>

<!-- Controls and explanatory text -->
<rect x="54" y="420" width="336" height="200" rx="16" fill="#2C2C2E"/>
<rect x="76" y="441" width="131" height="5" rx="2.5" fill="#98989D"/>
<rect x="76" y="454" width="290" height="4" rx="2" fill="#49494C"/>
<rect x="76" y="464" width="266" height="4" rx="2" fill="#49494C"/>
<rect x="76" y="474" width="278" height="4" rx="2" fill="#49494C"/>
<text x="76" y="508" fill="#98989D" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".9">PROBABILITY OF 1</text>
<path d="M76 526H354" stroke="#48484A" stroke-width="4" stroke-linecap="round"/>
<path d="M76 526H245" stroke="#2997FF" stroke-width="4" stroke-linecap="round"/>
<circle cx="245" cy="526" r="8" fill="#2997FF"/>
<text x="316" y="530" fill="#F5F5F7" font-family="monospace" font-size="10">0.61</text>
<text x="76" y="559" fill="#98989D" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".9">SAMPLE LENGTH</text>
<path d="M76 578H354" stroke="#48484A" stroke-width="4" stroke-linecap="round"/>
<path d="M76 578H220" stroke="#2997FF" stroke-width="4" stroke-linecap="round"/>
<circle cx="220" cy="578" r="7" fill="#2997FF"/>
<text x="76" y="604" fill="#64D2FF" font-family="Arial,sans-serif" font-size="9">Drag to change the source distribution</text>

<!-- Paired metric cards -->
<rect x="445" y="420" width="175" height="66" rx="15" fill="#2C2C2E"/>
<text x="463" y="442" fill="#98989D" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing=".7">THEORETICAL ENTROPY</text>
<text x="463" y="470" fill="#64D2FF" font-family="Arial,sans-serif" font-size="17" font-weight="700">0.965 bits</text>
<rect x="632" y="420" width="162" height="66" rx="15" fill="#2C2C2E"/>
<text x="650" y="442" fill="#98989D" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing=".7">EMPIRICAL P(1)</text>
<text x="650" y="470" fill="#F5F5F7" font-family="Arial,sans-serif" font-size="17" font-weight="700">0.608</text>

<!-- Wide interactive curve -->
<rect x="445" y="499" width="699" height="121" rx="15" fill="#111113"/>
<path d="M470 588H1122M470 526V588M470 567H1122M470 546H1122" stroke="#343437"/>
<path d="M480 582 C540 578 574 563 626 540 C677 517 723 508 760 508 C808 508 846 520 890 542 C939 566 985 578 1038 582 L1038 588H480Z" fill="url(#blueArea)"/>
<path d="M480 582 C540 578 574 563 626 540 C677 517 723 508 760 508 C808 508 846 520 890 542 C939 566 985 578 1038 582" fill="none" stroke="#2997FF" stroke-width="3"/>
<path d="M861 502V588" stroke="#F5F5F7" stroke-dasharray="4 4" stroke-opacity=".65"/>
<circle cx="861" cy="526" r="4.5" fill="#2997FF"/>
<text x="470" y="607" fill="#98989D" font-family="monospace" font-size="8">0</text>
<text x="1034" y="607" fill="#98989D" font-family="monospace" font-size="8">1</text>
<text x="731" y="607" fill="#98989D" font-family="Arial,sans-serif" font-size="8.5">Probability p</text>

<!-- Content tokens continue beneath the figure -->
<g font-family="monospace" font-size="8" text-anchor="middle">
  <rect x="825" y="432" width="18" height="18" rx="4" fill="#15191D" stroke="#343437"/><text x="834" y="444" fill="#64D2FF">1</text>
  <rect x="847" y="432" width="18" height="18" rx="4" fill="#17202A" stroke="#343437"/><text x="856" y="444" fill="#64D2FF">0</text>
  <rect x="869" y="432" width="18" height="18" rx="4" fill="#15191D" stroke="#343437"/><text x="878" y="444" fill="#64D2FF">1</text>
  <rect x="891" y="432" width="18" height="18" rx="4" fill="#17202A" stroke="#343437"/><text x="900" y="444" fill="#64D2FF">0</text>
  <rect x="913" y="432" width="18" height="18" rx="4" fill="#15191D" stroke="#343437"/><text x="922" y="444" fill="#64D2FF">1</text>
  <rect x="935" y="432" width="18" height="18" rx="4" fill="#17202A" stroke="#343437"/><text x="944" y="444" fill="#64D2FF">0</text>
  <rect x="957" y="432" width="18" height="18" rx="4" fill="#15191D" stroke="#343437"/><text x="966" y="444" fill="#64D2FF">1</text>
  <rect x="979" y="432" width="18" height="18" rx="4" fill="#17202A" stroke="#343437"/><text x="988" y="444" fill="#64D2FF">0</text>
</g>
</svg>
